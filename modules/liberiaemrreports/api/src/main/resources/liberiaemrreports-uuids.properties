# Report and report-design UUIDs for modules/liberiaemrreports (ADR 0010 decisions 6 and 7).
#
# Each value is a content variable token, resolved at build time from
# content-packages/content-liberia-national/configuration/variables.properties. Declare a new
# UUID THERE, then map it here; never write a UUID literal in this file or in Java. The api
# build fails if any token survives filtering.
