# Content UUIDs the liberiaemr module needs at runtime (ADR 0010 decision 7, the same pattern as
# modules/liberiaemrreports/api/src/main/resources/liberiaemrreports-uuids.properties).
#
# Each value is a content variable token, resolved at build time from
# content-packages/content-liberia-national/configuration/variables.properties. Declare a new
# UUID THERE, then map it here; never write a UUID literal in this file or in Java. The api
# build fails if any token survives filtering.

# The facility of origin of a record at central (IdentityService, ADR 0005): the nearest
# ancestor-or-self location with this tag. The ETL's mamba_dim_location_hierarchy uses the same
# variable for facility_location_id.
var.locationtag.health-facility.uuid=${var.locationtag.health-facility.uuid}

# Remote patient history (LE-382, ADR 0013 §4): what central's history endpoint returns. The MCH
# programmes and ANC encounter types come from content-liberia-mch, which api/pom.xml also filters.
var.program.anc.uuid=${var.program.anc.uuid}
var.program.labour-delivery.uuid=${var.program.labour-delivery.uuid}
var.program.pnc.uuid=${var.program.pnc.uuid}
var.program.family-planning.uuid=${var.program.family-planning.uuid}
var.encountertype.anc-initial.uuid=${var.encountertype.anc-initial.uuid}
var.encountertype.anc-followup.uuid=${var.encountertype.anc-followup.uuid}
var.concept.national.gestational-age-weeks.uuid=${var.concept.national.gestational-age-weeks.uuid}
var.concept.national.scheduled-date-for-next-anc-visit.uuid=${var.concept.national.scheduled-date-for-next-anc-visit.uuid}
var.concept.ciel.immunization-history.uuid=${var.concept.ciel.immunization-history.uuid}
var.concept.ciel.immunizations.uuid=${var.concept.ciel.immunizations.uuid}
var.concept.ciel.vaccination-date.uuid=${var.concept.ciel.vaccination-date.uuid}
