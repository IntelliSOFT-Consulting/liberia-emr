# LiberiaEMR — CENTRAL aggregation stack
#
# Receives the unidirectional push from each facility. Cross-facility patient query is
# Sprint 4 scope and is NOT enabled here yet (see integration/cross-facility/).
#
#   docker compose --env-file ../../env/central.env up -d
name: liberiaemr-central

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_allowed_packet=1G
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # For initdb/10-sync-mgmt-db.sh, which runs ONLY on the first boot of an empty
      # volume; an unset password means it does nothing.
      SYNC_MGMT_DB_NAME: ${SYNC_MGMT_DB_NAME:-openmrs_mgmt}
      SYNC_MGMT_DB_USER: ${SYNC_MGMT_DB_USER:-dbsync_mgmt}
      SYNC_MGMT_DB_PASSWORD: ${SYNC_MGMT_DB_PASSWORD:-}
    volumes:
      - db-data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [liberiaemr]

  backend:
    image: ${REGISTRY}/liberia-emr-backend:${LIBERIAEMR_VERSION}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      OMRS_CONFIG_CONNECTION_TYPE: mysql
      OMRS_CONFIG_CONNECTION_SERVER: db
      OMRS_CONFIG_CONNECTION_DATABASE: ${MYSQL_DATABASE}
      OMRS_CONFIG_CONNECTION_USERNAME: ${MYSQL_USER}
      OMRS_CONFIG_CONNECTION_PASSWORD: ${MYSQL_PASSWORD}
      # true for the FIRST boot on an empty database only, then back to false.
      OMRS_CONFIG_CREATE_TABLES: "${OMRS_CREATE_TABLES:-false}"
      OMRS_CONFIG_AUTO_UPDATE_DATABASE: "true"
      # Legacy admin UI, MOH ICT SOP control D5. Hard-coded false here, unlike the
      # facility stack: central holds the national data set and has no dev/staging
      # deployment of its own, so there is no environment that should ever unblock it.
      OMRS_CONFIG_MODULE_WEB_ADMIN: "false"
      # One of continue_on_error, fail_on_error, disabled. The previous
      # 'continue_on_error=false' was none of them and fell through to continuing anyway;
      # this is the same behaviour spelled validly. See distribution/backend/Dockerfile for
      # why fail_on_error is not the safer-sounding choice it appears to be.
      OMRS_CONFIG_INITIALIZER_STARTUP_LOAD: continue_on_error
      # Password reset email (liberiaemr module). The relay is deployment state, not content:
      # the same image runs at every facility, so these come from the gitignored .env rather
      # than from an Initializer global property. LIBERIAEMR_SMTP_PASSWORD_FILE names a path
      # read verbatim inside the container — mount the secret there and leave the plain
      # variable empty. Unset means no reset mail is delivered, which the module logs.
      LIBERIAEMR_SMTP_HOST: ${LIBERIAEMR_SMTP_HOST:-}
      LIBERIAEMR_SMTP_PORT: ${LIBERIAEMR_SMTP_PORT:-587}
      LIBERIAEMR_SMTP_USER: ${LIBERIAEMR_SMTP_USER:-}
      LIBERIAEMR_SMTP_PASSWORD: ${LIBERIAEMR_SMTP_PASSWORD:-}
      LIBERIAEMR_SMTP_PASSWORD_FILE: ${LIBERIAEMR_SMTP_PASSWORD_FILE:-}
      LIBERIAEMR_SMTP_FROM: ${LIBERIAEMR_SMTP_FROM:-}
      LIBERIAEMR_FRONTEND_URL: ${LIBERIAEMR_FRONTEND_URL:-}
      # Where the sync status page reads its numbers. This stack's own Prometheus already
      # scrapes the broker, the receiver and the certificate exporter; empty turns the page
      # off, which is what a facility gets, since it never sets this.
      LIBERIAEMR_SYNC_MONITORING_URL: ${LIBERIAEMR_SYNC_MONITORING_URL:-http://prometheus:9090}
      JAVA_OPTS: -Xmx${BACKEND_HEAP:-6g} -Duser.timezone=Africa/Monrovia
    volumes:
      - openmrs-data:/openmrs/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/openmrs/health/started"]
      interval: 20s
      timeout: 5s
      retries: 60
      # Must cover a first boot's full concept-dictionary import — see the same setting in
      # the facility stack. At 300s a healthy import was marked unhealthy after ~25 minutes
      # and every service gated on condition: service_healthy stayed down.
      start_period: 5400s
    networks: [liberiaemr]

  frontend:
    image: ${REGISTRY}/liberia-emr-frontend:${LIBERIAEMR_VERSION}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SPA_PATH: /openmrs/spa
      API_URL: /openmrs
      SPA_CONFIG_URLS: >-
        /openmrs/spa/config/config-core.json,
        /openmrs/spa/config/config-national.json,
        /openmrs/spa/config/config-central.json
    networks: [liberiaemr]

  gateway:
    image: ${REGISTRY}/liberia-emr-gateway:${LIBERIAEMR_VERSION}
    restart: unless-stopped
    depends_on: [frontend, backend]
    ports:
      - "443:443"
    volumes:
      - ${TLS_CERT_DIR}:/etc/nginx/certs:ro
    networks: [liberiaemr]

  # The broker facilities push to, mutual TLS only (distribution/broker/README.md). Its
  # journal is a copy of clinical data at rest (sync-eip.md 7.4). Metrics on 8161 stay on
  # the internal network.
  artemis:
    image: ${REGISTRY}/liberia-emr-broker:${LIBERIAEMR_VERSION}
    restart: unless-stopped
    ports:
      # Only enrolled facilities can authenticate, but still firewall it to the networks
      # they connect from and bind it to that interface.
      - "${ARTEMIS_BIND_ADDR:-0.0.0.0}:61617:61617"
    volumes:
      - type: bind
        source: ${BROKER_CERTS_DIR:-/etc/liberiaemr/broker-certs}
        target: /etc/broker-certs
        read_only: true
        bind:
          create_host_path: false
      - broker-data:/var/lib/artemis-data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/61617'"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [liberiaemr]

  # Applies facility pushes to the central database: the dbsync receiver
  # (distribution/sync/). Waits for a healthy backend because it reads the platform
  # version over REST at start-up. Contract: integration/eip/routes/README.md.
  sync-receiver:
    image: ${REGISTRY}/liberia-emr-sync-receiver:${LIBERIAEMR_VERSION}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      artemis:
        condition: service_healthy
    environment:
      OPENMRS_DB_HOST: db
      OPENMRS_DB_PORT: "3306"
      OPENMRS_DB_NAME: ${MYSQL_DATABASE}
      OPENMRS_DB_USER: ${MYSQL_USER}
      OPENMRS_DB_PASSWORD: ${MYSQL_PASSWORD}
      MGMT_DB_NAME: ${SYNC_MGMT_DB_NAME:-openmrs_mgmt}
      MGMT_DB_USER: ${SYNC_MGMT_DB_USER:-dbsync_mgmt}
      # :? so a missing credential fails the deploy loudly instead of leaving the EMR up
      # with a crash-looping receiver.
      MGMT_DB_PASSWORD: ${SYNC_MGMT_DB_PASSWORD:?set in central.env}
      # "artemis" is in the broker certificate's names, so hostname verification holds.
      ARTEMIS_URL: ssl://artemis:61617
      OPENMRS_BASE_URL: http://backend:8080/openmrs
      OPENMRS_REST_USER: ${SYNC_REST_USER:?set in central.env}
      OPENMRS_REST_PASSWORD: ${SYNC_REST_PASSWORD:?set in central.env}
      LOG_LEVEL: ${SYNC_LOG_LEVEL:-INFO}
    volumes:
      - receiver-state:/opt/eip
      - type: bind
        source: ${RECEIVER_CERTS_DIR:-/etc/liberiaemr/receiver-certs}
        target: /app/sync-certs
        read_only: true
        bind:
          create_host_path: false
    networks: [liberiaemr]

  # Certificate and revocation list expiry for Prometheus. At central, so an expiring
  # facility certificate alerts while that facility is offline (sync-eip.md 7.6).
  # Mounts public material only.
  cert-expiry:
    image: ${REGISTRY}/liberia-emr-cert-expiry:${LIBERIAEMR_VERSION}
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${BROKER_CERTS_DIR:-/etc/liberiaemr/broker-certs}/public
        target: /public
        read_only: true
        bind:
          create_host_path: false
    networks: [liberiaemr]

  # DHIS2 aggregate export runs from central only, never from a facility.
  dhis2-export:
    image: ${REGISTRY}/liberia-emr-dhis2-export:${LIBERIAEMR_VERSION}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DHIS2_BASE_URL: ${DHIS2_BASE_URL}
      DHIS2_USERNAME: ${DHIS2_USERNAME}
      DHIS2_PASSWORD: ${DHIS2_PASSWORD}
    # Blocked until the MOH delivers the data-element mappings; see
    # integration/dhis2/mappings/README.md.
    profiles: ["dhis2"]
    networks: [liberiaemr]

  # Watches the sync receiver (distribution/monitoring/). UI binds loopback by
  # default: reach it over an SSH tunnel, or set PROM_BIND_ADDR consciously.
  prometheus:
    image: prom/prometheus:v2.53.4
    restart: unless-stopped
    ports:
      - "${PROM_BIND_ADDR:-127.0.0.1}:${PROM_PORT:-9090}:9090"
    volumes:
      - ../../monitoring/prometheus-central.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/rules-central.yml:/etc/prometheus/rules.yml:ro
      - prom-data:/prometheus
    networks: [liberiaemr]

  # Delivers alerts by email and/or webhook (monitoring/alertmanager-entrypoint.sh); with
  # neither configured, alerts are visible in the UIs only, which suits a dev box alone.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_SMTP_SMARTHOST: ${ALERT_SMTP_SMARTHOST:-}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
      ALERT_SMTP_REQUIRE_TLS: ${ALERT_SMTP_REQUIRE_TLS:-true}
    entrypoint: ["/bin/sh", "/etc/amtpl/alertmanager-entrypoint.sh"]
    ports:
      - "${PROM_BIND_ADDR:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ../../monitoring:/etc/amtpl:ro
      - alertmanager-data:/alertmanager
    networks: [liberiaemr]

volumes:
  db-data:
  openmrs-data:
  # Renamed from artemis-data so the interim broker's plaintext journal is never reused.
  broker-data:
  receiver-state:
  prom-data:
  alertmanager-data:

networks:
  liberiaemr:
