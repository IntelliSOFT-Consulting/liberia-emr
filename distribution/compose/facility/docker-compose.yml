# LiberiaEMR — FACILITY stack (Careysburg / Barnersville)
#
# Offline-first: this stack runs a complete EMR with no dependency on the central
# instance. Sync to central is a separate, unidirectional push service that queues
# locally when the link is down (see integration/eip/routes/).
#
# Images are immutable and versioned — never mount a git checkout in production.
#   docker compose --env-file ../../env/facility.env up -d
name: liberiaemr-facility

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    # Binlog feeds the sync sender's Debezium engine (sync-eip.md §1.3). Retention is
    # the maximum-outage ceiling and the disk must be sized for it (risk F2). MariaDB
    # CAPS this variable at 8553600 (99 days); the doc's six-month floor is not
    # reachable here, see risk F1. Safe on an existing volume.
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_allowed_packet=1G
      --log-bin=binlog
      --binlog-format=ROW
      --binlog-row-image=FULL
      --server-id=${DB_SERVER_ID:-1}
      --binlog-expire-logs-seconds=${BINLOG_EXPIRE_SECONDS:-8553600}
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # For initdb/10-sync-db-users.sh, which runs ONLY on the first boot of an empty
      # volume; unset passwords mean it does nothing.
      DEBEZIUM_DB_USER: ${DEBEZIUM_DB_USER:-debezium}
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD:-}
      SYNC_MGMT_DB_NAME: ${SYNC_MGMT_DB_NAME:-openmrs_mgmt}
      SYNC_MGMT_DB_USER: ${SYNC_MGMT_DB_USER:-dbsync_mgmt}
      SYNC_MGMT_DB_PASSWORD: ${SYNC_MGMT_DB_PASSWORD:-}
    volumes:
      - db-data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [liberiaemr]

  backend:
    image: ${REGISTRY}/liberia-emr-backend:${LIBERIAEMR_VERSION}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      OMRS_CONFIG_CONNECTION_TYPE: mysql
      OMRS_CONFIG_CONNECTION_SERVER: db
      OMRS_CONFIG_CONNECTION_DATABASE: ${MYSQL_DATABASE}
      OMRS_CONFIG_CONNECTION_USERNAME: ${MYSQL_USER}
      OMRS_CONFIG_CONNECTION_PASSWORD: ${MYSQL_PASSWORD}
      OMRS_CONFIG_CREATE_TABLES: "${OMRS_CREATE_TABLES:-false}"
      OMRS_CONFIG_AUTO_UPDATE_DATABASE: "true"
      # Legacy admin UI, MOH ICT SOP control D5. Blocked in production and unblocked on
      # dev/staging, from ONE variable that also drives the gateway below — the two layers
      # cannot be half-set from separate knobs. Unset means false, so a facility env file
      # that never mentions it stays disabled. Only dev/staging env files set it to true.
      OMRS_CONFIG_MODULE_WEB_ADMIN: "${LEGACY_ADMIN_UI:-false}"
      # One of three literals: continue_on_error, fail_on_error, disabled. The previous
      # 'continue_on_error=false' was none of them and fell through to continuing, so this
      # is the same behaviour spelled validly — not a change.
      # fail_on_error is not used on purpose: the first erroring domain aborts every later
      # one, which loses more metadata than it protects. See distribution/backend/Dockerfile.
      OMRS_CONFIG_INITIALIZER_STARTUP_LOAD: continue_on_error
      # Password reset email (liberiaemr module). The relay is deployment state, not content:
      # the same image runs at every facility, so these come from the gitignored .env rather
      # than from an Initializer global property. LIBERIAEMR_SMTP_PASSWORD_FILE names a path
      # read verbatim inside the container — mount the secret there and leave the plain
      # variable empty. Unset means no reset mail is delivered, which the module logs.
      LIBERIAEMR_SMTP_HOST: ${LIBERIAEMR_SMTP_HOST:-}
      LIBERIAEMR_SMTP_PORT: ${LIBERIAEMR_SMTP_PORT:-587}
      LIBERIAEMR_SMTP_USER: ${LIBERIAEMR_SMTP_USER:-}
      LIBERIAEMR_SMTP_PASSWORD: ${LIBERIAEMR_SMTP_PASSWORD:-}
      LIBERIAEMR_SMTP_PASSWORD_FILE: ${LIBERIAEMR_SMTP_PASSWORD_FILE:-}
      LIBERIAEMR_SMTP_FROM: ${LIBERIAEMR_SMTP_FROM:-}
      LIBERIAEMR_FRONTEND_URL: ${LIBERIAEMR_FRONTEND_URL:-}
      JAVA_OPTS: >-
        -Xmx${BACKEND_HEAP:-3g}
        -Duser.timezone=Africa/Monrovia
    volumes:
      - openmrs-data:/openmrs/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/openmrs/health/started"]
      interval: 20s
      timeout: 5s
      retries: 60
      # A FIRST boot imports the whole concept dictionary before it will answer this probe.
      # start_period has to cover that, because failures inside it are the only ones that do
      # not count toward retries: at the previous 300s, a healthy import was declared
      # unhealthy after ~25 minutes (300s + 60 x 20s), and frontend and sync — which both
      # gate on condition: service_healthy below — never started at all. Measured against the
      # full CIEL dictionary, which the ocl/ README says not to ship; a curated subset is up
      # in minutes and never comes near this ceiling. Failures still surface, just later, and
      # a backend that has answered once leaves the start period immediately.
      start_period: 5400s
    networks: [liberiaemr]

  frontend:
    image: ${REGISTRY}/liberia-emr-frontend:${LIBERIAEMR_VERSION}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SPA_PATH: /openmrs/spa
      API_URL: /openmrs
      # Every runtime config file must be listed here or O3 will not load it, even though
      # the file is present in the image. See IMPLEMENTATION.md §7.
      #
      # This list must match, in order, what collect-frontend-config.sh actually collected;
      # build-distribution.sh compares the two and fails on drift. The lab, pharmacy and
      # opd-ipd layers carry no frontend config yet — add their entries here in layer order
      # at the same time as the first config-<layer>.json.
      SPA_CONFIG_URLS: >-
        /openmrs/spa/config/config-core.json,
        /openmrs/spa/config/config-national.json,
        /openmrs/spa/config/config-mch.json,
        /openmrs/spa/config/config-opd.json,
        /openmrs/spa/config/config-site.json
      SPA_DEFAULT_LOCALE: en
    networks: [liberiaemr]

  gateway:
    image: ${REGISTRY}/liberia-emr-gateway:${LIBERIAEMR_VERSION}
    restart: unless-stopped
    depends_on: [frontend, backend]
    environment:
      # Same variable as the backend above: false blocks /openmrs/admin/ at the edge,
      # true lets it through to the backend. The image itself defaults to false, so
      # this line changes nothing in production — it exists so dev/staging can opt out.
      LEGACY_ADMIN_UI: "${LEGACY_ADMIN_UI:-false}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # TLS material is mounted, never baked into the image and never committed.
      - ${TLS_CERT_DIR}:/etc/nginx/certs:ro
    networks: [liberiaemr]

  # Unidirectional facility -> central push: the dbsync sender (distribution/sync/).
  # Waits for a healthy backend because it reads the platform version over REST at
  # start-up. Contract and guarantees: integration/eip/routes/README.md.
  sync:
    image: ${REGISTRY}/liberia-emr-sync:${LIBERIAEMR_VERSION}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DBSYNC_SENDER_ID: ${FACILITY_CODE}
      OPENMRS_DB_HOST: db
      OPENMRS_DB_PORT: "3306"
      OPENMRS_DB_NAME: ${MYSQL_DATABASE}
      OPENMRS_DB_USER: ${MYSQL_USER}
      OPENMRS_DB_PASSWORD: ${MYSQL_PASSWORD}
      MGMT_DB_NAME: ${SYNC_MGMT_DB_NAME:-openmrs_mgmt}
      MGMT_DB_USER: ${SYNC_MGMT_DB_USER:-dbsync_mgmt}
      MGMT_DB_PASSWORD: ${SYNC_MGMT_DB_PASSWORD:-}
      DEBEZIUM_SERVER_ID: ${DEBEZIUM_SERVER_ID:-20001}
      DEBEZIUM_DB_USER: ${DEBEZIUM_DB_USER:-debezium}
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD:-}
      # ssl://<central>:61617; the host must be one of the names in the broker certificate.
      ARTEMIS_URL: ${ARTEMIS_URL:-}
      OPENMRS_BASE_URL: http://backend:8080/openmrs
      OPENMRS_REST_USER: ${SYNC_REST_USER:-}
      OPENMRS_REST_PASSWORD: ${SYNC_REST_PASSWORD:-}
      # Defaults to this facility's own broker address in the image; a file: endpoint is
      # QA-only (distribution/sync/README.md) and never a deployed configuration.
      SYNC_OUTPUT_ENDPOINT: ${SYNC_OUTPUT_ENDPOINT:-}
      SYNC_PAYLOAD_ENCRYPTION: ${SYNC_PAYLOAD_ENCRYPTION:-}
      LOG_LEVEL: ${SYNC_LOG_LEVEL:-INFO}
    volumes:
      # Debezium offset and schema history; losing this volume means re-snapshotting.
      # One of the enumerated copies of clinical data at rest (sync-eip.md §7.4).
      - sync-queue:/opt/eip
      # This facility's client certificate and PGP keys. A missing directory fails the
      # start rather than being created empty.
      - type: bind
        source: ${SYNC_CERTS_DIR:-/etc/liberiaemr/sync-certs}
        target: /app/sync-certs
        read_only: true
        bind:
          create_host_path: false
    profiles: ["sync"]
    networks: [liberiaemr]

  # Watches the sync sender (distribution/monitoring/); rides the sync profile because
  # it monitors nothing else. UI binds loopback by default: reach it over an SSH tunnel,
  # or set PROM_BIND_ADDR consciously.
  prometheus:
    image: prom/prometheus:v2.53.4
    restart: unless-stopped
    profiles: ["sync"]
    ports:
      - "${PROM_BIND_ADDR:-127.0.0.1}:${PROM_PORT:-9090}:9090"
    volumes:
      - ../../monitoring/prometheus-facility.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/rules-facility.yml:/etc/prometheus/rules.yml:ro
      - prom-data:/prometheus
    networks: [liberiaemr]

  # Delivers alerts by email and/or webhook (monitoring/alertmanager-entrypoint.sh); with
  # neither configured, alerts are visible in the UIs only, which suits a dev box alone.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    profiles: ["sync"]
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_SMTP_SMARTHOST: ${ALERT_SMTP_SMARTHOST:-}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
      ALERT_SMTP_REQUIRE_TLS: ${ALERT_SMTP_REQUIRE_TLS:-true}
    entrypoint: ["/bin/sh", "/etc/amtpl/alertmanager-entrypoint.sh"]
    ports:
      - "${PROM_BIND_ADDR:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ../../monitoring:/etc/amtpl:ro
      - alertmanager-data:/alertmanager
    networks: [liberiaemr]

volumes:
  db-data:
  openmrs-data:
  sync-queue:
  prom-data:
  alertmanager-data:

networks:
  liberiaemr:
