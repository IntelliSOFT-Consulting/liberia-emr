# LEGACY_ADMIN_UI=false — the production posture (MOH ICT SOP control D5).
#
# Blocks the legacy admin UI at the edge. This is the default: the gateway Dockerfile
# sets LEGACY_ADMIN_UI=false, so any environment that does not deliberately opt out
# lands here. The backend also runs with OMRS_CONFIG_MODULE_WEB_ADMIN=false, so this
# is the outer of two independent layers — both must be flipped to expose the UI.
#
# /openmrs/admin/ is a longer prefix than /openmrs/, so nginx picks this location and
# the request never reaches the backend.
location /openmrs/admin/ {
    return 404;
}
