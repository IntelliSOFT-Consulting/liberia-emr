# The sync route (LE-372, ADR 0014): facilities reach the broker at central through
# https://<central>/sync/broker/ on 443, for networks that allow nothing but HTTPS to central.
#
# Behind it is the central sync-tunnel service (wstunnel), which forwards each WebSocket to
# the broker and nowhere else. What travels inside is the facility's own TLS session with the
# broker, opened at the facility: this gateway ends only the outer HTTPS, never sees inside,
# and the broker checks the facility's certificate, revocation and permissions exactly as on
# 61617.
#
# Resolved when a request arrives rather than at start, so a stack without the tunnel (every
# facility) starts normally and answers 502 here.
location /sync/broker/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $liberiaemr_sync_tunnel http://sync-tunnel:8080;
    proxy_pass $liberiaemr_sync_tunnel;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # A sync connection lives for hours. Both tunnel ends ping every 30 s, and OpenWire keeps
    # its own heartbeat inside, so an hour without a byte means the connection is dead.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}
