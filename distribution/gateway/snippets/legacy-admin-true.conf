# LEGACY_ADMIN_UI=true — dev and staging only. NEVER a facility or central production
# instance; see docs/security/moh-ict-sop-mapping.md control D5.
#
# This file deliberately defines NO location block. With no /openmrs/admin/ location,
# the request falls through to the general `location /openmrs/` above and is proxied to
# the backend with that block's headers, timeouts and body-size limit already applied.
# Re-declaring the proxy here would duplicate those settings and let the two copies
# drift apart, so the absence is the mechanism, not an oversight.
#
# Unblocking the edge is not sufficient on its own: the backend must also run with
# OMRS_CONFIG_MODULE_WEB_ADMIN=true or OpenMRS still refuses to render the UI. Both
# come from the single LEGACY_ADMIN_UI variable in the compose files.
