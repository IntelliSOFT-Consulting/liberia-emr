# LiberiaEMR gateway — TLS termination and routing.
#
# TLS is contractual for facility<->cloud traffic (MOH ICT SOPs Feb 2023 v1.1.0,
# National Cybersecurity Strategy 2025-2029). Do not weaken the protocol or cipher
# settings below; see docs/security/.

server {
    listen 80;
    server_name _;
    # Plain HTTP exists only to redirect.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Forms, concept ZIPs and attachments can be large.
    client_max_body_size 512m;

    location /openmrs/spa/ {
        proxy_pass http://frontend:80/openmrs/spa/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /openmrs/ {
        proxy_pass http://backend:8080/openmrs/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    location = / {
        return 302 /openmrs/spa/;
    }

    # The legacy admin UI is disabled in production images; block it at the edge too.
    location /openmrs/admin/ {
        return 404;
    }
}
