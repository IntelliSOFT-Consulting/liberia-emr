# HIS-Lite. billing and stockmanagement come from the RefApp block above.
#
# omod.dispensing WAS pinned at 1.2.0 and is now DROPPED — the VERIFY note that used to sit
# here was right. It is an O2 module: on a real startup it refuses to load with
#   requires the following module(s): htmlformentryui 1.0, appframework 2.0,
#   providermanagement, appui 1.0
# and those O2 UI modules have no place in an O3 distribution. Dispensing in O3 is
# esm-dispensing-app (pinned below) talking FHIR MedicationDispense through fhir2.
# content-liberia-pharmacy's requirement was relaxed to match.
# omod.dispensing=1.2.0
omod.labonfhir=1.2.0

# --- Audit log (MOH ICT SOP control C1) — built from pinned upstream source ---
# openmrs/openmrs-module-auditlog: a Hibernate interceptor that records every create, update
# and delete made through OpenMRS into auditlog_audit_log. content-liberia-national's
# gp-audit.xml configures it. config.xml at this commit: require_version 2.5.0 (so core
# 2.8.8 qualifies), no required modules, aware of legacyui (which hosts its viewer).
#
# NOT an omod.* entry: mavenrepo.openmrs.org has no usable release. Its
# org.openmrs.module:auditlog-omod:1.1-1.0.0 is a different module under the same
# coordinate, and the real module's 1.1 (Repsy only) lacks the AUDIT-35 stored-XSS fix and
# the AUDIT-38 viewer fix. distribution/backend/Dockerfile (stage 2b) fetches this exact
# commit, checks the SHA, stamps the version below and builds it. Bump the commit and the
# version together; move to an omod.auditlog pin once upstream releases these fixes.
source.auditlog.repository=https://github.com/openmrs/openmrs-module-auditlog.git
source.auditlog.commit=ba96ba5471ccf6e91db0d11b5c7d416ffd4a7460
source.auditlog.version=1.2.0-ba96ba5

# --- Sync / integration (facility -> central) ---
# These are NOT OMODs. openmrs-eip is a toolbox (openmrs-watcher, the OpenMRS Camel
# component); the deployable sender and receiver applications are
# mekomsolutions/openmrs-dbsync, built on top of it and run as their own containers.
# ADR 0008 records the selection; this closes risk E4 (sync-eip.md §10 item 3).
#
# sync.dbsync is the source tag distribution/sync/Dockerfile builds; sync.eip is the
# openmrs-eip version that dbsync tag declares (its pom's eipVersion), recorded here so
# the pair is explicit. Bump them together, never independently.
sync.dbsync=4.0.0
sync.eip=4.2.0

