# Custom login application replacing the core esm-login-app
spa.frontendModules.@liberiaemr/esm-liberia-login-app=10.0.0-pre.143

# National sync status page. Central-only in effect: on a facility the endpoint reports
# enabled=false, so the menu item is hidden and a direct /sync-status visit shows only a
# "not available on this server" notice. Tooling is on 10.0.0 like the
# e-partograph above; re-pin deliberately after each publish (§6).
spa.frontendModules.@liberiaemr/esm-liberia-sync-status-app=1.0.0-pre.143

# MOH indicator report runner (ADR 0010 decision 8a): run, view and export the reports built
# by modules/liberiaemrreports. Facility and central alike; the instance role comes from the
# reports module's context endpoint at runtime. Its report list is `reportUuids` in
# config-national.json. Tooling is on 10.0.0 like the e-partograph above; re-pin
# deliberately after each publish (§6).
spa.frontendModules.@liberiaemr/esm-liberia-reports-app=1.0.0-pre.155

# The ICT Unit's audit log viewer (MOH ICT SOP B3, packages/esm-liberia-audit-log-app), reading
# modules/liberiaemr's /liberiaemr/auditlog. NOT PINNED YET, deliberately: the package is new and
# has no published version until its first merge to main, when packages.yml publishes
# 1.0.0-pre.<run>. A pin to a version that is not on npm fails `openmrs assemble`, which would
# fail every frontend image build and the E2E job. The follow-up PR uncomments this line with
# that exact pre-release, after checking its npm gitHead is the merge commit (as #199 did for
# the reports app). Until then qa/e2e/cypress/e2e/AuditLog.cy.ts loads this checkout's build.
# spa.frontendModules.@liberiaemr/esm-liberia-audit-log-app=1.0.0-pre.<run of the merge>

# Remote Search (packages/esm-liberia-remote-search-app): find a patient on the central server and
