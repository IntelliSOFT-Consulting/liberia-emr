# Demo content is never part of a production distribution; training stacks add it via the
# demo compose overlay. The RefApp's own demo artefacts are therefore left out on purpose:
#   content.referenceapplication-demo=1.9.2
#   omod.referencedemodata=2.6.1
# content.liberiaemr-demo is DELIBERATELY ABSENT for the same reason.
#
# content-demo IS that 1.9.2 demo content, lifted into the repository rather than resolved
# as the artefact above, so a training stack builds offline. Nothing here pins it: the demo
# image gets it from DEMO_PACKAGE in distribution/backend/Dockerfile, which only
# scripts/build/build-distribution.sh --demo sets. omod.referencedemodata stays out either
# way — the lifted package is metadata, and no demo PATIENTS are generated.

# ---------------------------------------------------------------------------
# In-tree OMOD — NOT pinned here on purpose
# ---------------------------------------------------------------------------
# modules/liberiaemr (password reset, and the SMS/MFA provisions after it) is built from
# the source in THIS commit by a stage of distribution/backend/Dockerfile and copied into
# /openmrs/distribution/openmrs_modules/ beside the OMODs above.
#
# It is deliberately absent from the omod.* list. Every entry there is resolved from
# mavenrepo.openmrs.org by scripts/build/resolve-modules.sh; liberiaemr has never been
# published to that repository, so a pin would name a coordinate that cannot resolve — and
# the resolver's count check would fail the build rather than ship a short module set.
#
# Building from the tag's own source is the stronger guarantee in any case: there is no
# coordinate that can drift out from under the pin. If the module is ever published
# externally, move it into the omod.* list and delete the module stage from the Dockerfile.
#
# modules/mambaetl (mamba-etl-liberiaemr, the reporting ETL; ADR 0010) is built the same way,
# in the same Dockerfile stage, and is absent from omod.* for the same reasons. The MambaETL
# core it runs, org.openmrs.module:mamba-core-api, is a LIBRARY bundled inside that OMOD's
# lib/ at the version modules/mambaetl/pom.xml pins (mambaCoreVersion). NEVER add it here: it
# is not a module, and pinning it would load a second copy of core beside the bundled one.
