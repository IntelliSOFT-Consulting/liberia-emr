# distro.properties — LiberiaEMR distribution
#
# THIS FILE PINS EXACT, TESTED VERSIONS. Never use `latest`, a dynamic version, a range,
# or `-SNAPSHOT` outside development. Ranges belong in each package's content.properties.
# See IMPLEMENTATION.md §6.
#
# RECONCILED 2026-07-28 against a resolved openmrs-distro-referenceapplication
# **3.7.1** manifest (~/openmrs/liberiaemr/openmrs-distro.properties). Every version below
# that also appears in the RefApp is copied verbatim from it — do not hand-edit those
# individually; re-run the reconciliation against a newer RefApp instead.
#
# Entries marked "LiberiaEMR addition" are NOT part of the RefApp tested set and carry
# their own upgrade risk. Entries marked "VERIFY" still need confirmation before release.
#
# The 3.6 -> 3.7.1 rebase and the reasoning behind it are recorded in
# docs/adr/0006-pin-o3-refapp-3.7.1.md, which supersedes ADR 0002.

name=LiberiaEMR
version=1.0.0-SNAPSHOT

# ---------------------------------------------------------------------------
# Platform
# ---------------------------------------------------------------------------
war.openmrs=2.8.8

# ---------------------------------------------------------------------------
# Concept dictionary (OCL)
# ---------------------------------------------------------------------------
# The collections scripts/build/fetch-ciel.sh pulls from the MOH's OCL org, and the released
# collection version to pin them to. The dictionary decides what every concept UUID in
# content resolves to, so it belongs under the same pinning rule as the WAR and the OMODs:
# two builds of one tag must get the same concepts.
#
# ocl.collection.version is INTENTIONALLY EMPTY until the MOH publishes a released version.
# Empty means fetch-ciel.sh exports HEAD, which is reproducible only by accident — the build
# says so out loud. Set it to the released version id before cutting a release.
ocl.org=LIB
ocl.collections=mch
ocl.collection.version=1.0.2

