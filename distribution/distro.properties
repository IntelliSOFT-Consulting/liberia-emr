# published version exists until its first merge to main, and a pin to one that is not on npm fails
# `openmrs assemble`. The follow-up PR uncomments this line with that exact pre-release. Until then
# the extension slots that distribution/frontend/patch-patient-search-remote.cjs adds stay empty and
