# --- Custom Build (IMPLEMENTATION.md §3) ---
# The e-partograph is greenfield: a normal, separately versioned O3 frontend module pinned
# here like any other. It is NOT bundled inside a content package.
#
# Pinned to the exact build verified against spa.core=10.0.0 above. The module's tooling
# (@openmrs/esm-framework, openmrs) must stay on 10.0.0: 10.0.1-pre and newer inject a
# Module Federation runtime guard that the 10.0.0 app shell cannot satisfy, and the module
# refuses to start. Re-pin deliberately after each publish — never `next` (§6).
spa.frontendModules.@liberiaemr/esm-liberia-epartograph-app=1.0.0-pre.53

# Generic obs-by-encounter widget (TB Screening first, then Partograph/ANC summaries).
