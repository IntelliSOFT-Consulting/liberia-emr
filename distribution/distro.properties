# --- Custom Build (IMPLEMENTATION.md §3) ---
# The e-partograph is greenfield: a normal, separately versioned O3 frontend module pinned
# here like any other. It is NOT bundled inside a content package.
#
# COMMENTED OUT until the module is implemented and published. packages/esm-liberia-
# epartograph-app is still a scaffold — routes.json, a config schema and an index.ts, with
# no webpack or tsconfig — so nothing can be built from it, and the coordinate below does
# not exist on npm. Left pinned, `openmrs assemble` fails the frontend image with a 404 and
# no distribution can be built at all. Restore this line the moment the module publishes.
# spa.frontendModules.@liberiaemr/esm-liberia-epartograph-app=1.0.0-SNAPSHOT

