# VERIFY — RefApp 3.7.1 itself pins a SNAPSHOT here, which violates the no-SNAPSHOT rule
# at the top of this file. Replace with the released 3.1.0 (or later) before go-live.
omod.spa=3.1.0-SNAPSHOT

# --- LiberiaEMR additions (not in the RefApp tested set) --------------------
# Required by content-packages/content-common/content.properties (>=5.4.0). RefApp 3.7.1
# no longer ships htmlformentry (O3 uses o3forms + esm-form-engine). Keep only while a
# content package still needs it; it depends on omod.htmlwidgets, pinned above.
omod.htmlformentry=5.4.0

# HIS-Lite. billing and stockmanagement come from the RefApp block above.
#
# omod.dispensing WAS pinned at 1.2.0 and is now DROPPED — the VERIFY note that used to sit
# here was right. It is an O2 module: on a real startup it refuses to load with
#   requires the following module(s): htmlformentryui 1.0, appframework 2.0,
#   providermanagement, appui 1.0
# and those O2 UI modules have no place in an O3 distribution. Dispensing in O3 is
# esm-dispensing-app (pinned below) talking FHIR MedicationDispense through fhir2.
# content-liberia-pharmacy's requirement was relaxed to match.
# omod.dispensing=1.2.0
omod.labonfhir=1.2.0

# --- Sync / integration (facility -> central) ---
# omod.eip is COMMENTED OUT: openmrs-eip is a standalone Camel application, run as its own
# container (distribution/compose/facility/docker-compose.yml, integration/eip/routes/),
# not an OMOD. Re-enable only if an actual OpenMRS-side EIP module is adopted.
# omod.eip=1.0.0

