# Serves the assembled O3 SPA. TLS is handled upstream by the gateway.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed bundle filenames are immutable; cache them hard.
    location ~* ^/openmrs/spa/.+\.(js|css|woff2?|png|svg|jpg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Runtime configuration must NEVER be cached — it is how an operator changes
    # branding, feature flags and UUID mappings without rebuilding the image.
    location /openmrs/spa/config/ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall through to the shell.
    location /openmrs/spa/ {
        # Inject CSS to fix the Carbon TimePicker component width bug
        sub_filter '</head>' '<style>.cds--time-picker__input-field { width: auto !important; min-width: 5rem; }</style></head>';
        sub_filter_once on;
        try_files $uri $uri/ /openmrs/spa/index.html;
    }
}
