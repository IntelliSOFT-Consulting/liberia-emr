# promtool unit tests for rules-central.yml. Run with:
#   docker run --rm -v "$PWD/distribution/monitoring:/m:ro" --entrypoint promtool \
#     prom/prometheus:v2.53.4 test rules /m/tests/rules-central-test.yml
# Test time starts at unix 0, so a value of N days * 86400 means "expires in N days".
rule_files:
  - ../rules-central.yml

evaluation_interval: 1m

tests:
  - name: a facility certificate 80 days from expiry is flagged at 90 only
    interval: 1m
    input_series:
      - series: 'sync_cert_not_after_seconds{identity="careysburg",kind="facility"}'
        values: '6912000x180'
    alert_rule_test:
      - eval_time: 2h
        alertname: SyncCertExpiresIn90Days
        exp_alerts:
          - exp_labels: {severity: info, identity: careysburg, kind: facility}
            exp_annotations:
              summary: "Sync certificate careysburg expires within 90 days"
              description: "Start renewal with the MOH ICT Unit now; issuing and installing a facility certificate takes a site visit or a trusted remote session."
      - eval_time: 2h
        alertname: SyncCertExpiresIn60Days
        exp_alerts: []
      - eval_time: 2h
        alertname: SyncCertExpiresIn30Days
        exp_alerts: []

  - name: a facility certificate 20 days from expiry is critical
    interval: 1m
    input_series:
      - series: 'sync_cert_not_after_seconds{identity="barnersville",kind="facility"}'
        values: '1728000x180'
    alert_rule_test:
      - eval_time: 2h
        alertname: SyncCertExpiresIn30Days
        exp_alerts:
          - exp_labels: {severity: critical, identity: barnersville, kind: facility}
            exp_annotations:
              summary: "Sync certificate barnersville expires within 30 days"
              description: "If it lapses, that identity is refused by the broker. A facility keeps working locally and queues, but cannot deliver until the certificate is replaced."

  - name: the alert holds for an hour before firing
    interval: 1m
    input_series:
      - series: 'sync_cert_not_after_seconds{identity="barnersville",kind="facility"}'
        values: '1728000x180'
    alert_rule_test:
      - eval_time: 30m
        alertname: SyncCertExpiresIn30Days
        exp_alerts: []

  - name: a healthy certificate raises nothing
    interval: 1m
    input_series:
      - series: 'sync_cert_not_after_seconds{identity="careysburg",kind="facility"}'
        values: '17280000x180'
    alert_rule_test:
      - eval_time: 2h
        alertname: SyncCertExpiresIn90Days
        exp_alerts: []

  - name: a revocation list with under a quarter of its validity left is critical
    interval: 1m
    input_series:
      - series: 'sync_crl_next_update_seconds'
        values: '86400x180'
      - series: 'sync_crl_last_update_seconds'
        values: '-518400x180'
      - series: 'sync_cert_files_read'
        values: '3x180'
      - series: 'sync_cert_read_errors'
        values: '0x180'
    alert_rule_test:
      - eval_time: 2h
        alertname: SyncCrlStale
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "The broker's revocation list must be replaced soon"
              description: "Once it lapses the broker refuses EVERY client certificate. Replace crl.pem (atomically) from the MOH ICT Unit's CA; the broker reloads it within a minute."
      - eval_time: 2h
        alertname: SyncCertExpiryBlind
        exp_alerts: []

  - name: a weekly revocation list early in its life is not stale
    interval: 1m
    input_series:
      - series: 'sync_crl_next_update_seconds'
        values: '518400x180'
      - series: 'sync_crl_last_update_seconds'
        values: '-86400x180'
    alert_rule_test:
      - eval_time: 2h
        alertname: SyncCrlStale
        exp_alerts: []

  - name: an exporter that reads nothing raises the blind alert
    interval: 1m
    input_series:
      - series: 'sync_cert_files_read'
        values: '0x60'
      - series: 'sync_cert_read_errors'
        values: '0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: SyncCertExpiryBlind
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "Certificate expiry is not being checked"
              description: "The exporter found no readable certificates, could not parse one, or cannot read the revocation list."

  - name: a dead exporter is noticed
    interval: 1m
    input_series:
      - series: 'up{job="cert-expiry",instance="cert-expiry:9101"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: SyncCertExpiryExporterDown
        exp_alerts:
          - exp_labels: {severity: warning, job: cert-expiry, instance: "cert-expiry:9101"}
            exp_annotations:
              summary: "Certificate expiry exporter is down"

  - name: a dead letter raises a critical alert
    interval: 1m
    input_series:
      - series: 'artemis_message_count{address="DLA",broker="liberiaemr-sync",queue="DLQ"}'
        values: '0x5 1x30'
    alert_rule_test:
      - eval_time: 4m
        alertname: SyncDeadLetters
        exp_alerts: []
      - eval_time: 20m
        alertname: SyncDeadLetters
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "Sync messages are in the broker's dead-letter queue"
              description: "The receiver failed on these 10 times. They are not in the national record; inspect DLQ with the admin certificate (distribution/broker/README.md)."

  - name: a revocation list from the wrong issuer is critical
    interval: 1m
    input_series:
      - series: 'sync_crl_valid'
        values: '0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: SyncCrlInvalid
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "The revocation list in place does not verify against the CA"
              description: "The broker keeps the list it loaded and will not load this one. Replace crl.pem with one issued by the CA in public/certs/ca.pem."
