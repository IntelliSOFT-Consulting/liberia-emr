# Facility alert rules. Metric names are dbsync's own, verified against the running
# 4.0.0 sender: openmrs_dbsync_watcher_errors is the sender's error/retry queue depth,
# openmrs_dbsync_watcher_datasource_status_* is 1 when the datasource answers.
groups:
  - name: sync-sender
    rules:
      - alert: SyncPushErrors
        expr: openmrs_dbsync_watcher_errors > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sync push errors queued at the facility"
          description: "The sender's error/retry queue has been non-empty for 5 minutes. Records are safe and will retry; investigate the broker link if this persists. NEVER a reason to stop clinical work."

      - alert: SyncPushErrorsSustained
        expr: openmrs_dbsync_watcher_errors > 0
        for: 2h
        labels:
          severity: critical
        annotations:
          summary: "Sync push failing for over 2 hours"
          description: "Sustained failure suggests an outage or misconfiguration rather than a blip. Check connectivity to the central broker; queued records remain safe."

      - alert: SyncSenderDown
        expr: up{job="sync-sender"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Sync sender is not running"
          description: "Nothing is capturing changes from the binlog. Change capture resumes from the saved offset when the sender returns; the binlog retention window (99 days) is the deadline."

      - alert: SyncSenderDatasourceDown
        expr: openmrs_dbsync_watcher_datasource_status_openmrs == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Sync sender cannot reach the facility database"

  # From the capture exporter (monitoring/sync-capture/): the one failure the sender's own
  # metrics cannot show, a sender that is up but no longer reading the binlog.
  - name: sync-capture
    rules:
      - alert: SyncCaptureStalled
        expr: sync_capture_stalled_seconds > 900 and on() up{job="sync-sender"} == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Sync sender is running but has stopped capturing changes"
          description: "New records have been saved at the facility for over 15 minutes while the sender's binlog position has not moved, so none of them is being sent. Look for an error repeating in the sender's log (for example 'bogus data in log event' after a power cut). The records are safe in the facility database and are sent once capture resumes, provided the binlog still holds them. NEVER a reason to stop clinical work."

      - alert: SyncCaptureCheckBlind
        expr: up{job="sync-capture"} == 0 or sync_capture_db_readable == 0 or (time() - sync_capture_last_run_seconds) > 600 or sync_capture_unverified_seconds > 1800
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The sync capture check cannot see the facility"
          description: "The capture exporter is down, cannot read the database with the Debezium account, has stopped refreshing, or has had no saved sender position to read for half an hour while records were being saved, so a stalled sender would go unnoticed."
