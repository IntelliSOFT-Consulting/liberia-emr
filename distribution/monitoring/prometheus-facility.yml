# Facility-side Prometheus: watches the sync sender. Mounted read-only by the facility
# compose; rules in rules-facility.yml.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: sync-sender
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["sync:8080"]
