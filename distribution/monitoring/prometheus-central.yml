# Central-side Prometheus: watches the sync receiver, the broker, and the expiry of the
# sync security material. Mounted read-only by the central compose; rules in rules-central.yml.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: sync-receiver
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["sync-receiver:8080"]

  - job_name: cert-expiry
    static_configs:
      - targets: ["cert-expiry:9101"]

  - job_name: broker
    metrics_path: /metrics/
    static_configs:
      - targets: ["artemis:8161"]
