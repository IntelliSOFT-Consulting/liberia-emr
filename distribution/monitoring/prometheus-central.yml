# Central-side Prometheus: watches the sync receiver. Mounted read-only by the central
# compose; rules in rules-central.yml.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: sync-receiver
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["sync-receiver:8080"]
