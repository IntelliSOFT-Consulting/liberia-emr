# content.properties
#
# DECLARE RANGES HERE (>=), NEVER EXACT PINS. A content package says "I need this or
# later"; only distribution/distro.properties pins an exact tested version.
# See IMPLEMENTATION.md §6.

name=${project.artifactId}
version=${project.version}

# === Platform ===
war.openmrs = >=2.7.0

# === Backend modules (OMOD) ===
omod.initializer = >=2.9.0

# === Frontend modules (ESM) ===
spa.frontendModules.@openmrs/esm-form-engine-app = >=3.0.0

# === Content package dependencies ===
content.liberiaemr-common = >=1.0.0
content.liberiaemr-national = >=1.0.0
# omod.dispensing is NOT required. It is an O2 module — it will not start without
# appframework, appui, htmlformentryui and providermanagement, none of which are in an O3
# distribution. O3 dispensing is esm-dispensing-app over FHIR MedicationDispense, served by
# fhir2. See distribution/distro.properties.
# omod.dispensing = >=1.1.0
omod.fhir2 = >=2.0.0
omod.stockmanagement = >=1.1.0
