# variables.properties — liberiaemr-common
#
# Declare every UUID ONCE here, then reference it as ${var.<name>} in Initializer CSV/JSON,
# forms, reports and frontend configuration. NEVER hard-code a UUID anywhere else.
# See IMPLEMENTATION.md §7 and §11.
#
# Two reasons this matters more than it looks:
#   1. A site package can override any variable below to map our metadata onto UUIDs that
#      already exist in a production database, instead of creating duplicates.
#   2. A variable with no safe default can be left unset, which forces the distribution
#      author to supply a value rather than silently inheriting a wrong one.
#
# Convention: <domain>.<thing>.uuid — lower-kebab, grouped by Initializer domain.
# Once a version of this package ships, these UUIDs are FROZEN: changing a UUID that
# production data references is forbidden (IMPLEMENTATION.md §9).

# ---------------------------------------------------------------------------
# Concept classes
# ---------------------------------------------------------------------------
# Program, Workflow and State are NOT OpenMRS core concept classes — core ships Test,
# Procedure, Drug, Diagnosis, Finding, Question, ConvSet, Misc and friends, but not these.
# CIEL carries them, so while the full CIEL export sat in ocl/ they were created as a side
# effect of the import and concepts-mch.csv's 16 Program/Workflow/State rows loaded. Against
# the curated LIB/mch collection this distribution actually ships, they do not exist and
# every one of those rows fails with "Bad concept class name 'Program'".
#
# Declared here rather than in content-liberia-mch, which is currently their only consumer,
# because a concept class is shared vocabulary: the lab and pharmacy packages will need the
# same classes and must not have to depend on MCH for them.
#
# Safe to declare even though CIEL also defines them. CONCEPT_CLASSES loads at position 5,
# well before OCL at 25, and the OCL importer resolves a concept class by NAME
# (CacheService.getConceptClassByName) and constructs one only when the lookup misses — so
# it reuses these rather than creating a second class that would collide on the unique name.
# That is the opposite of Health Facility above, where the module creates the row first.
var.conceptclass.program.uuid=3d8a5c17-9e42-4b06-8f31-2c7e0a9b4d65
var.conceptclass.workflow.uuid=6b1e9f43-2a70-4c58-9d82-4f0c6e3a8b17
var.conceptclass.state.uuid=9c4f2a08-7b35-4e91-a6d0-8e1b5c7f0a23

