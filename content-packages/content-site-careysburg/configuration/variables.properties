# variables.properties — liberiaemr-site-careysburg
#
# Facility-specific values for Careysburg Health Center. A site package is the LAST layer to load, so any
# variable set here overrides the same variable in common, national or a programme package.
#
# Overriding a UUID is the supported way to map LiberiaEMR metadata onto objects that
# already exist in this facility's database instead of creating duplicates
# (IMPLEMENTATION.md §7). Security variables from liberiaemr-national must NOT be
# overridden looser — see IMPLEMENTATION.md §10.

# ---------------------------------------------------------------------------
# Facility root — required. content-common deliberately leaves this unset.
# ---------------------------------------------------------------------------
var.location.facility-root.uuid=2c4e6a80-1d3f-4b57-9e02-a4c6e8102b3d

# ---------------------------------------------------------------------------
# Departments and service points
# ---------------------------------------------------------------------------
var.location.opd.uuid=4e6a8002-3f51-4d79-b024-c6e8102b4d5f
var.location.maternity.uuid=c446688a-b5d9-4401-38a2-4d6f81a3c5d7
var.location.ward.uuid=6a800224-5173-4f9b-d246-e8102b4d6f71
var.location.laboratory.uuid=80022446-7195-40bd-f468-102b4d6f8193
var.location.pharmacy.uuid=a2244668-93b7-42df-1680-2b4d6f81a3b5

# ---------------------------------------------------------------------------
# Administrative parents
# ---------------------------------------------------------------------------
var.location.county.name=Montserrado
var.location.district.name=Careysburg District

# ---------------------------------------------------------------------------
# Sync identity
# ---------------------------------------------------------------------------
var.site.facility-code=careysburg
