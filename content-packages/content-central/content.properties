# content.properties
#
# DECLARE RANGES HERE (>=), NEVER EXACT PINS. A content package says "I need this or
# later"; only distribution/distro.properties pins an exact tested version.
# See IMPLEMENTATION.md §6.
#
# The central layer. It takes the place a site layer holds in a facility build
# (`build-distribution.sh --site central`) and is never part of a facility build, so a
# setting here cannot reach a facility. See docs/adr/0011-central-composition.md.

name=${project.artifactId}
version=${project.version}

# === Platform ===
war.openmrs = >=2.7.0

# === Content package dependencies ===
# Central sits on top of the same national and programme layers a facility does: it
# displays records those layers describe, so it needs their configuration too.
content.liberiaemr-common = >=1.0.0
content.liberiaemr-national = >=1.0.0
content.liberiaemr-mch = >=1.0.0
content.liberiaemr-lab = >=1.0.0
content.liberiaemr-pharmacy = >=1.0.0
content.liberiaemr-opd-ipd = >=1.0.0
