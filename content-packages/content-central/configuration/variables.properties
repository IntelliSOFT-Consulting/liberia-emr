# variables.properties — liberiaemr-central
#
# Declare every UUID ONCE here, then reference it as ${var.<name>} in Initializer CSV/JSON,
# forms, reports and frontend configuration. Never hard-code a UUID anywhere else.
# See IMPLEMENTATION.md §7.
#
# The locations of every site package (LE-339, docs/adr/0012-central-site-locations.md) are
# taken from the site packages themselves when the image is built, already resolved against
# each site's own variables, so nothing is declared here for them. A setting that belongs to
# central alone declares its variables here.

# OpenMRS ID generator for central. Facility OpenMRS IDs sync here and the type is UNIQUE, so
# central's own generator cannot share the facilities' range (LE-595). A new source, not a new
# base on the common one: idgen reads the base only until a generator has a sequence value.
var.idgen.openmrs-id-central.uuid=35266eb7-fcc7-40e8-9fe6-173765bce86d
