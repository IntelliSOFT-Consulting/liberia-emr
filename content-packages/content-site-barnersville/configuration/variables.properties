# variables.properties — liberiaemr-site-barnersville
#
# Facility-specific values for Barnersville Health Center. A site package is the LAST layer to load, so any
# variable set here overrides the same variable in common, national or a programme package.
#
# Overriding a UUID is the supported way to map LiberiaEMR metadata onto objects that
# already exist in this facility's database instead of creating duplicates
# (IMPLEMENTATION.md §7). Security variables from liberiaemr-national must NOT be
# overridden looser — see IMPLEMENTATION.md §10.

# ---------------------------------------------------------------------------
# Facility root — required. content-common deliberately leaves this unset.
# ---------------------------------------------------------------------------
var.location.facility-root.uuid=3d5f7b91-2e40-4c68-8f13-b5d7f9213c4e

# ---------------------------------------------------------------------------
# Departments and service points
# ---------------------------------------------------------------------------
var.location.opd.uuid=5f7b9113-4062-4e8a-a135-d7f9213c5e60
var.location.maternity.uuid=d557799b-c8ea-4602-29b3-5e7092b4d6e8
var.location.ward.uuid=7b911335-6284-40ac-c357-f9213c5e7082
var.location.laboratory.uuid=91133557-84a6-42ce-e579-213c5e7092a4
var.location.pharmacy.uuid=b3355779-a6c8-44e0-0791-3c5e7092b4c6

# ---------------------------------------------------------------------------
# Administrative parents
# ---------------------------------------------------------------------------
var.location.county.name=Montserrado
var.location.district.name=Greater Monrovia District

# ---------------------------------------------------------------------------
# Sync identity
# ---------------------------------------------------------------------------
var.site.facility-code=barnersville
