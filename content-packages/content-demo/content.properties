# content.properties
#
# DECLARE RANGES HERE (>=), NEVER EXACT PINS. A content package says "I need this or
# later"; only distribution/distro.properties pins an exact tested version.
# See IMPLEMENTATION.md §6.
#
# The configuration/ tree of this package is LIFTED VERBATIM from
# openmrs/openmrs-content-referenceapplication-demo at tag 1.9.2. Do not hand-edit it —
# re-lift with scripts/build/lift-demo-content.sh. See README.md.

name=${project.artifactId}
version=${project.version}

# ############################################################################
# NEVER SHIP THIS PACKAGE TO PRODUCTION. Training and test environments only.
# It is deliberately excluded from distribution/distro.properties and included only
# from distribution/compose/facility/docker-compose.demo.yml.
# ############################################################################

# === Platform ===
# 2.7 is the floor for the conceptreferencerange domain the lifted content uses.
war.openmrs = >=2.7.0

# === Backend modules (OMOD) ===
# Floors are the versions distro.properties pins today: this content is only known to
# apply against the RefApp 3.7.1 baseline, and a downgrade below any of them would
# silently drop the domain named beside it rather than fail loudly.
omod.initializer = >=2.12.0
# addresshierarchy/
omod.addresshierarchy = >=2.21.0
# appointmentservicedefinitions/, appointmentservicetypes/, appointmentspecialities/
omod.appointments = >=2.1.0
omod.appointments.groupId = org.bahmni.module
# billableservices/, cashpoints/, paymentmodes/, globalproperties/billing-core_demo.xml
omod.billing = >=2.3.0
# dispositions/, proceduretypes/
omod.emrapi = >=3.4.0
# globalproperties/fhir-properties.xml
omod.fhir2 = >=4.2.0
# idgen/, autogenerationoptions/
omod.idgen = >=5.0.4
# metadatasets/, metadatatermmappings/
omod.metadatamapping = >=2.0.0
# ampathforms/, ampathformstranslations/
omod.o3forms = >=2.3.0
# ocl/ — fetched by scripts/build/lift-demo-content.sh, not committed
omod.openconceptlab = >=3.1.0
# queues/
omod.queue = >=3.0.0
# roles/roles_stockmanagement.csv, privileges/privileges_stockmanagement.csv
omod.stockmanagement = >=3.0.0

# NOT declared, deliberately: metadatasharing. The lifted tree carries
# metadatasharing/emrapi.Metadata_Source-1-core_demo.zip, but the RefApp 3.7.1 baseline
# does not ship that module, so distro.properties does not pin it and Initializer has no
# loader to apply the file with. Declaring it here would demand a module the distribution
# has no tested version of. See README.md.

# === Content package dependencies ===
content.liberiaemr-common = >=1.0.0
content.liberiaemr-mch = >=1.0.0
