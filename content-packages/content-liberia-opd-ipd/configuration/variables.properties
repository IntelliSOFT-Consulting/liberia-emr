# --- Disposition, on the O3 inpatient-ward model ---
# The question and its three answers were previously CIEL 159488 plus 162646 / 162647 /
# 164284, which are "Jugular venous pressure (cm)", "Urine output, qualitative" and
# "Subdural-peritoneal shunt with valve" — unrelated concepts that happened to be free.
# They stayed invisible because concepts.csv defined all three locally under those UUIDs.
#
# CIEL 169402 carries NO answer mappings of its own, so the answer linkage still has to be
# declared in concepts.csv; only the identities come from CIEL now.
#
# These are REAL UUIDs, not the <id> padded with A that most CIEL concepts use. That
# convention is not universal: CIEL assigns a random UUID to newer concepts, and everything
# in the 167xxx-169xxx range here is one. Padding them produced a UUID no concept has, so
# the import created the answers under their real UUIDs while this file pointed at
# non-existent ones, and the question row failed with "The object identified by
# '169401AAAA...' could not be found in database".
#
# Take the value from the export's external_id, never from the id. scripts/build/
# build-distribution.sh now checks every CIEL variable against the shipped exports.
var.concept.ciel.disposition.uuid=ce085d74-323c-4c9a-9fdf-051de81dd020
var.concept.ciel.disposition-discharge.uuid=2537896a-7d27-4c71-8e93-4c265ffa5954
var.concept.ciel.disposition-admit.uuid=77eafb3f-58d3-4397-a6dc-d2c06e9062f3
var.concept.ciel.disposition-refer.uuid=dc98ea48-66e9-4b2a-8533-3833f8200d06
var.concept.ciel.followup-date.uuid=5096AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
