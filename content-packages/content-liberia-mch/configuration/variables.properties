# --- ANC IPT (self-contained MCH 1st–4th value set) ---
# National IPT dose question (1st/2nd/3rd+) is left unchanged: it has no exact 4th answer
# and its "3rd IPT dose+" must not be reused for exact 3rd.
# Woman receiving IPT and LLIN received at ANC are the NATIONAL coded Yes/No questions
# (var.concept.national.*), answered by CIEL 1065/1066. Both answers ARE present in the
# subscribed LIB/mch collection, so the MCH Boolean fallbacks that used to live here were
# unnecessary and have been removed. Do NOT reintroduce a local Boolean: OpenMRS resolves
# a Boolean obs through the concept.true / concept.false global properties (CIEL 1065/1066),
# which this distro never sets, so the obs would be rejected on save.
# All four dose answers are MCH-local so concepts-mch.csv does not depend on national
# answers that load later in the merged configuration tree.
var.concept.mch.ipt-dose-administered.uuid=edf4344a-2e9f-4e0e-88d1-824bd3f25069
var.concept.mch.1st-ipt-dose.uuid=025d9262-58ae-4261-a04d-77a8dfa4bd0b
var.concept.mch.2nd-ipt-dose.uuid=5b45044d-e950-41ee-b798-24cee7e10c03
