# --- ANC fetal presentation (local MCH fallback for CIEL 160090) ---
# CIEL 160090 and its 12 answers were ADDED to the LIB/mch collection on 2026-08-18. They are
# NOT in the pinned export yet: distro.properties pins ocl.collection.version=1.0.1 and the
# build fetches a released version, so a new version has to be cut and that pin bumped first.
# National Presentation is Vertex-only. Local value set supplies the approved ANC answers.
# Do not invent CIEL answer IDs.
# Same-as CIEL:160090 omitted: without a CIEL concept source Initializer rejects the map. The
# collection carries 825 concepts and ZERO mappings, so no CIEL source reaches the runtime.
# KEEPING this local set is a live option, not merely a stopgap: CIEL collapses Transverse and
# Oblique into one answer (112259) and has no "Other", so migrating onto 160090 LOSES clinical
# granularity the DAK asks for. See docs/metadata-specs/mch.md §"ANC prenatal presentation"
# and open items 17-19. Either way, changing the concept means migrating every obs already
# recorded here — concepts are append-only in production (IMPLEMENTATION.md §9).
var.concept.mch.fetal-presentation.uuid=5e358516-82b3-4370-b765-e76d84ed233e
var.concept.mch.presentation-vertex.uuid=6b7b79fc-b14e-48f9-add1-d75417cc33cc
