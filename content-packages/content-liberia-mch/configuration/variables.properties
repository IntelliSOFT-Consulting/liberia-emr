# --- Program-defining concepts (CIEL where one exists) ---
# These are the "Program concept" column of programs-mch.csv, so each one must resolve to a
# Program-class concept that exists.
#
# anc previously named CIEL 1907 and family-planning CIEL 1909 — "Number of other sick
# household members seen during visit" and "…receiving antimalarials during visit". Neither
# has anything to do with either programme, and both UUIDs were written 40 characters long
# (a CIEL UUID is the id padded with A to 36), so they could not have resolved to any
# concept at all.
var.concept.ciel.anc.uuid=165475AAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
# CIEL has no Program-class concept for family planning, so this one is local and declared
# in concepts-mch.csv, the same way L&D and PNC are.
