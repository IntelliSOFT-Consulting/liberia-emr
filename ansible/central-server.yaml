---
# Ansible playbook — provision the LiberiaEMR central server from scratch.
#
# Setup (once):
#   cp central-server.vars.yml.example central-server.vars.yml   # fill in real values
#   cp inventory.ini.example inventory.ini                        # fill in real host
#   echo -e 'central-server.vars.yml\ninventory.ini' >> .gitignore
#
# Usage:
#   ansible-playbook -i inventory.ini central-server.yaml
#
# CI deploys (LE-368): set ci_deploy_public_key in the vars file to let the "Update central
# dev environment" job in .github/workflows/ci.yml reach this server as ansible_user. That job
# fast-forwards the checkout at repo_dest to the commit it deploys, so the compose file always
# matches the images; leave the checkout clean (central.env is git-ignored).
#


- name: Provision LiberiaEMR central server
  hosts: central
  become: true
  vars_files:
  - central-server.vars.yml
  vars:
    central_env_file: "{{ repo_dest }}/distribution/env/central.env"
    ci_key_marker: liberia-emr-ci-deploy:ansible-managed

  tasks:
  # -----------------------------------------------------------------
  # Docker — same steps as docker_installation.sh, as idempotent
  # Ansible tasks instead of a re-run-unsafe shell script.
  # -----------------------------------------------------------------
  - name: Update apt cache
    ansible.builtin.apt:
      update_cache: true

  - name: Install prerequisites
    ansible.builtin.apt:
      name:
      - ca-certificates
      - curl
      state: present

  - name: Create keyrings directory
    ansible.builtin.file:
      path: /etc/apt/keyrings
      state: directory
      mode: "0755"

  - name: Download Docker's GPG key
    ansible.builtin.get_url:
      url: https://download.docker.com/linux/ubuntu/gpg
      dest: /etc/apt/keyrings/docker.asc
      mode: "0644"

  - name: Get Ubuntu codename
    ansible.builtin.command: bash -c '. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}"'
    register: ubuntu_codename
    changed_when: false

  - name: Get system architecture
    ansible.builtin.command: dpkg --print-architecture
    register: dpkg_arch
    changed_when: false

  - name: Add Docker apt source
    ansible.builtin.copy:
      dest: /etc/apt/sources.list.d/docker.sources
      mode: "0644"
      content: |
        Types: deb
        URIs: https://download.docker.com/linux/ubuntu
        Suites: {{ ubuntu_codename.stdout }}
        Components: stable
        Architectures: {{ dpkg_arch.stdout }}
        Signed-By: /etc/apt/keyrings/docker.asc

  - name: Update apt cache after adding Docker source
    ansible.builtin.apt:
      update_cache: true

  - name: Install Docker
    ansible.builtin.apt:
      name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      state: present

  - name: Add {{ ansible_user }} to the docker group
    ansible.builtin.user:
      name: "{{ ansible_user }}"
      groups: docker
      append: true

  # -----------------------------------------------------------------
  # CI deploy key (LE-368). The private half is the
  # CENTRAL_DEV_SSH_PRIVATE_KEY repository secret.
  #
  # The key is written with a fixed comment, ci_key_marker, and every
  # task finds it by that marker, so there is exactly one CI key:
  # changing ci_deploy_public_key REPLACES the old key (a rotation
  # revokes), and unsetting it REMOVES it. Other keys in the file are
  # never touched. Whatever comment the key came with is dropped; a key
  # carrying authorized_keys options is refused rather than mangled.
  # -----------------------------------------------------------------
  - name: Look up {{ ansible_user }}'s home directory
    ansible.builtin.getent:
      database: passwd
      key: "{{ ansible_user }}"

  - name: Refuse a CI deploy key that is not a plain "type base64 [comment]" key
    ansible.builtin.assert:
      that: ci_deploy_public_key is match('^(ssh-|ecdsa-|sk-)[A-Za-z0-9@.-]+ [A-Za-z0-9+/=]+( .*)?$')
      fail_msg: ci_deploy_public_key must be a plain public key line, e.g. "ssh-ed25519 AAAA... comment", with no options before it.
    when: ci_deploy_public_key | default('') | length > 0

  - name: Create {{ ansible_user }}'s .ssh directory
    ansible.builtin.file:
      path: "{{ getent_passwd[ansible_user][4] }}/.ssh"
      state: directory
      owner: "{{ ansible_user }}"
      mode: "0700"
    when: ci_deploy_public_key | default('') | length > 0

  # Before these tasks managed the key by marker, it was appended as-is, and that line is not
  # recognisable later. Two ways it goes: the unmarked copy of the CURRENT key is dropped just
  # below (the marked line replaces it), and any key listed in ci_deploy_revoked_keys is
  # removed whatever its comment or marker. A server whose key is rotated, or whose
  # ci_deploy_public_key is unset, in the same run as this upgrade must list the old key
  # there, or its unmarked line stays authorized: the marker-based revocation below cannot
  # see it.
  # Every entry is checked before ANY is removed. A partial entry would be a pattern, not a
  # key: a bare "ssh-ed25519" would match, and remove, every Ed25519 key in the file,
  # operators' included. So each must be a whole plain key line, body and all.
  - name: Refuse a ci_deploy_revoked_keys entry that is not a whole plain public key
    ansible.builtin.assert:
      that: ci_deploy_revoked_keys | default([]) | reject('match', '^(ssh-|ecdsa-|sk-)[A-Za-z0-9@.-]+ [A-Za-z0-9+/=]{16,}( .*)?$') | list | length == 0
      fail_msg: >-
        Every ci_deploy_revoked_keys entry must be a complete public key line, e.g.
        "ssh-ed25519 AAAA... comment". Not a plain key:
        {{ ci_deploy_revoked_keys | default([]) | reject('match', '^(ssh-|ecdsa-|sk-)[A-Za-z0-9@.-]+ [A-Za-z0-9+/=]{16,}( .*)?$') | list }}

  - name: Revoke the keys listed in ci_deploy_revoked_keys
    ansible.builtin.lineinfile:
      path: "{{ getent_passwd[ansible_user][4] }}/.ssh/authorized_keys"
      # Matched on the type and base64 body only, so the comment it carries does not matter.
      regexp: "^{{ (item.split())[:2] | join(' ') | regex_escape }}(\\s|$)"
      state: absent
    loop: "{{ ci_deploy_revoked_keys | default([]) }}"

  - name: Remove an unmarked copy of the CI deploy key from before it was managed
    ansible.builtin.lineinfile:
      path: "{{ getent_passwd[ansible_user][4] }}/.ssh/authorized_keys"
      line: "{{ ci_deploy_public_key }}"
      state: absent
    when: ci_deploy_public_key | default('') | length > 0

  - name: Authorize the CI deploy key, replacing any earlier one
    ansible.builtin.lineinfile:
      path: "{{ getent_passwd[ansible_user][4] }}/.ssh/authorized_keys"
      regexp: "\\s{{ ci_key_marker | regex_escape }}$"
      line: "{{ (ci_deploy_public_key.split())[:2] | join(' ') }} {{ ci_key_marker }}"
      create: true
      owner: "{{ ansible_user }}"
      mode: "0600"
    when: ci_deploy_public_key | default('') | length > 0

  - name: Revoke the CI deploy key when ci_deploy_public_key is unset
    ansible.builtin.lineinfile:
      path: "{{ getent_passwd[ansible_user][4] }}/.ssh/authorized_keys"
      regexp: "\\s{{ ci_key_marker | regex_escape }}$"
      state: absent
    when: ci_deploy_public_key | default('') | length == 0

  # -----------------------------------------------------------------
  # Repo
  # -----------------------------------------------------------------
  # The checkout belongs to {{ ansible_user }}, not root: CI logs in as that user and runs
  # `git fetch`/`merge` in it, which a root-owned .git refuses. The recursive chown also
  # repairs a checkout an earlier run of this playbook cloned as root. Safe to repeat: the
  # central containers only mount files from here read-only, so nothing in it is written as
  # another user.
  - name: Give {{ ansible_user }} the checkout directory
    ansible.builtin.file:
      path: "{{ repo_dest }}"
      state: directory
      owner: "{{ ansible_user }}"
      recurse: true

  - name: Clone liberia-emr
    become: false
    ansible.builtin.git:
      repo: "{{ repo_url }}"
      dest: "{{ repo_dest }}"
      version: main
      force: false

  # -----------------------------------------------------------------
  # Certbot — standalone, since nothing is bound to port 80 yet on a
  # fresh server. Re-running this playbook after the gateway is up
  # would need --webroot or a brief gateway stop instead; standalone
  # only works on a genuinely empty box like this one.
  # -----------------------------------------------------------------
  - name: Install certbot
    ansible.builtin.apt:
      name: certbot
      state: present

  - name: Check for an existing certificate
    ansible.builtin.stat:
      path: "/etc/letsencrypt/live/{{ certbot_domain }}/fullchain.pem"
    register: existing_cert

  - name: Issue certificate via standalone mode
    ansible.builtin.command: >
      certbot certonly --standalone --non-interactive --agree-tos -m {{ certbot_email }} -d {{ certbot_domain }}
    when: not existing_cert.stat.exists

  - name: Create TLS cert directory for the gateway container
    ansible.builtin.file:
      path: "{{ tls_cert_dir }}"
      state: directory
      mode: "0750"

  - name: Symlink fullchain.pem into TLS_CERT_DIR
    ansible.builtin.file:
      src: "/etc/letsencrypt/live/{{ certbot_domain }}/fullchain.pem"
      dest: "{{ tls_cert_dir }}/fullchain.pem"
      state: link
      force: true

  - name: Symlink privkey.pem into TLS_CERT_DIR
    ansible.builtin.file:
      src: "/etc/letsencrypt/live/{{ certbot_domain }}/privkey.pem"
      dest: "{{ tls_cert_dir }}/privkey.pem"
      state: link
      force: true

  # certbot's own systemd timer (installed with the package on Ubuntu)
  # already runs `certbot renew` twice daily — this just adds the
  # deploy-hook so the gateway container actually picks up a renewed
  # cert instead of serving the old one until someone notices.
  - name: Add a renewal deploy-hook to restart the gateway on cert renewal
    ansible.builtin.copy:
      dest: /etc/letsencrypt/renewal-hooks/deploy/restart-gateway.sh
      mode: "0755"
      content: |
        #!/bin/sh
        docker restart liberiaemr-central-gateway-1

  # -----------------------------------------------------------------
  # Bring up the central stack.
  #
  # central.env does not exist yet on a fresh checkout (it's
  # git-ignored, same as facility.env) — copy the example and stop
  # here for a human to fill in real values (DB passwords, DHIS2
  # creds if/when needed) rather than templating secrets through
  # Ansible unreviewed.
  # -----------------------------------------------------------------
  - name: Check whether central.env already exists
    ansible.builtin.stat:
      path: "{{ central_env_file }}"
    register: central_env_stat

  # {{ ansible_user }} owns it because CI runs `docker compose --env-file` as that user. 0600
  # keeps the secrets in it from every other account; root (this playbook) reads it anyway.
  - name: Copy central.env.example to central.env
    ansible.builtin.copy:
      src: "{{ repo_dest }}/distribution/env/central.env.example"
      dest: "{{ central_env_file }}"
      remote_src: true
      owner: "{{ ansible_user }}"
      mode: "0600"
    when: not central_env_stat.stat.exists

  - name: Keep central.env readable by {{ ansible_user }} only
    ansible.builtin.file:
      path: "{{ central_env_file }}"
      owner: "{{ ansible_user }}"
      mode: "0600"
    when: central_env_stat.stat.exists

  - name: Fail here if central.env needs real values filled in
    ansible.builtin.fail:
      msg: >
        central.env was just created from the example template at {{ central_env_file }}. Edit it with real DB passwords before re-running this playbook — the MYSQL_* placeholders in the example are not safe to run with as-is. Also set SYNC_MGMT_DB_PASSWORD, SYNC_REST_USER and SYNC_REST_PASSWORD: the central compose file requires them even when the sync receiver is not started, so without them docker compose refuses to run at all.
    when: not central_env_stat.stat.exists

  # sync-receiver and dhis2-export deliberately omitted — see the
  # ASSUMPTIONS note at the top of this file.
  - name: Bring up db, backend, frontend, gateway
    ansible.builtin.command: >
      docker compose --env-file {{ central_env_file }} up -d db backend frontend gateway
    args:
      chdir: "{{ repo_dest }}/distribution/compose/central"
