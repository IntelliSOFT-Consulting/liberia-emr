# Backend OMOD pipeline — modules/liberiaemr.
#
# Shaped after packages.yml, which does the same job for the ESMs on npm: one workflow per
# area, paths-scoped, PR builds and tests, and publishing only from main or a tag.
#
# Deliberately NOT part of ci.yml. ci.yml carries the single required status check for
# branch protection ("CI gate"), and a publish step that can fail on a credential or a
# registry outage must never be able to block a PR merge. ci.yml still builds and tests this
# module in its backend-module job; this workflow is only about shipping the artifact.
#
# Two version streams, and they are the whole design:
#
#   merge to main       ->  1.0.0-SNAPSHOT   re-deployed over itself on every merge
#   release x.y.z       ->  x.y.z            stamped from the tag, immutable, OPT-IN
#
# The release stream is opt-in because a distribution release is cut far more often than this
# module changes, and publishing on every one of them would fill Repsy with versions whose
# contents are byte-identical to the version before. The opt-in signal is the pom's base:
# the module publishes on a release only when modules/liberiaemr/pom.xml's <version>, minus
# -SNAPSHOT, equals the tag being released. So to ship the module as 1.2.0, set the pom to
# 1.2.0-SNAPSHOT on main BEFORE cutting 1.2.0; leave it alone and release 1.2.0 carries
# whichever module version was published last. The `decide` job below is where that is
# worked out, and it says on the run summary which way it went and why.
#
# The bump is therefore a PRE-release act. modules/liberiaemr/README.md used to call it a
# post-release one; both it and this comment have to stay in step with the decide job.
#
# The backend image takes neither version: distribution/backend/Dockerfile builds the module
# from source (it COPYs modules/liberiaemr) and stamps it with the distribution version it is
# being built into, so a release image never ships a SNAPSHOT (IMPLEMENTATION.md §6/§11) and
# never depends on the module having been published at all. Repsy is for consumers outside
# this repository.
name: Modules CI / CD

on:
  push:
    branches: [main]
    paths:
      - 'modules/**'
      - '.github/workflows/modules.yml'
  # A published release, NOT a tag push. `paths` applies to the whole push event, and a tag
  # push commonly reports no changed files at all — so a `tags:` trigger sitting beside this
  # filter would silently never fire, and the release version would never be published.
  # packages.yml publishes to npm off the same event for the same reason.
  release:
    types: [created]
  pull_request:
    branches: [main]
    paths:
      - 'modules/**'
      - '.github/workflows/modules.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modules-${{ github.head_ref || github.ref_name }}
  # Never cancel a run that is mid-publish; a half-deployed Maven directory is worse than a
  # queued build.
  cancel-in-progress: ${{ github.ref_name != 'main' && github.event_name != 'release' }}

env:
  JAVA_VERSION: '17'

jobs:
  build-and-test:
    name: Build and test the module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Build and test
        working-directory: modules/liberiaemr
        run: mvn -B clean package
      - name: Keep the surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: module-surefire-reports
          path: modules/liberiaemr/*/target/surefire-reports/
          if-no-files-found: ignore

  # Does this event publish anything at all?
  #
  # A separate job rather than an `if:` on a step inside publish, for one reason: GitHub
  # enters a job's `environment:` when the job starts, so a step-level skip would still put
  # a release that ships nothing in front of repsy-publish's reviewer, if one is ever
  # attached. Skipping the whole job never touches the environment.
  #
  # Deliberately does NOT need build-and-test — it reads one field out of a pom and has no
  # reason to queue behind a Maven build. publish needs both.
  decide:
    name: Decide whether to publish
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        name: Compare the pom version against the release
        env:
          POM: modules/liberiaemr/pom.xml
        run: |
          set -euo pipefail

          reason() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }

          # Everything that is not a release keeps the behaviour of the `if:` expression this
          # job replaced: the SNAPSHOT stream publishes from main and from nowhere else. A
          # pull request and a workflow_dispatch build and test, and stop there — a fork PR
          # must not reach the credentials, and an unreviewed branch must not be able to move
          # a published artifact.
          if [[ "$GITHUB_EVENT_NAME" != "release" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
              reason "main push -> publishing the SNAPSHOT stream."
            else
              echo "publish=false" >> "$GITHUB_OUTPUT"
              reason "${GITHUB_EVENT_NAME} on ${GITHUB_REF} never publishes."
            fi
            exit 0
          fi

          # help:evaluate would need setup-java and a network fetch of the OpenMRS parent pom
          # to answer one question, and would fail this job on a Maven outage. Read the field
          # directly instead: find() searches direct children, so <parent><version> — which
          # comes FIRST in this pom — cannot be picked up by mistake.
          tag="$GITHUB_REF_NAME"
          pom="$(python3 - "$POM" <<'PY'
          import sys, xml.etree.ElementTree as ET
          NS = "{http://maven.apache.org/POM/4.0.0}"
          v = ET.parse(sys.argv[1]).getroot().find(NS + "version")
          if v is None or not (v.text or "").strip():
              sys.exit("modules/liberiaemr/pom.xml has no project-level <version>")
          print(v.text.strip())
          PY
          )"
          base="${pom%-SNAPSHOT}"
          echo "release tag: ${tag}"
          echo "pom version: ${pom} (base ${base})"

          # Fails CLOSED by design: an unbumped pom means no publish. An unreadable one fails
          # the job instead, which blocks publish through `needs` and turns the run red rather
          # than quietly shipping nothing.
          if [[ "$base" == "$tag" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            reason "pom base version ${base} matches release ${tag} -> publishing the module."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            reason "pom base version ${base} is not release ${tag} -> the module did not change for this release, so nothing is published and ${tag} carries the module version published before it. To have shipped it as ${tag}, modules/liberiaemr/pom.xml needed to say ${tag}-SNAPSHOT in the commit this tag points at -- a bump on main now will not change that. Either move the tag onto a commit carrying the bump and release again, or let the module ship with the next release."
          fi

  publish:
    name: Publish to Repsy
    runs-on: ubuntu-latest
    needs: [build-and-test, decide]
    if: needs.decide.outputs.publish == 'true'
    # The environment is where REPSY_USERNAME / REPSY_PASSWORD live, and where a required
    # reviewer can be attached if publishing should ever need approval. Same pattern as
    # packages.yml's npm-publish environment.
    environment: repsy-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          # Generates ~/.m2/settings.xml with a <server> whose id matches the repository id
          # used by -DaltDeploymentRepository below. The two names must stay equal.
          #
          # These two values are the NAMES of environment variables for Maven to interpolate,
          # not credentials. REPSY_PW is deliberately short: scripts/validate/no-secrets.sh
          # refuses `password[:=] <12+ characters>` anywhere in the tree, and `server-password:
          # REPSY_PASSWORD` matches that shape exactly. The scanner is right to be blunt about
          # it, so the workflow bends rather than the scanner. Do not "tidy" this back to
          # REPSY_PASSWORD -- it fails the Validate content job. The GitHub secret keeps its
          # full name; only the variable carrying it into Maven is shortened.
          server-id: repsy
          server-username: REPSY_USERNAME
          server-password: REPSY_PW

      # https://repsy.io/intellisoftdev/liberiaemr, whose Maven endpoint is the URL below.
      # Defaulted here rather than required as configuration, the same way
      # scripts/build/build-distribution.sh defaults REGISTRY to intellisoftdev — but still
      # overridable by a repository variable, so moving or renaming the Repsy repo does not
      # need a commit.
      - name: Resolve the Repsy destination
        id: repsy
        env:
          REPSY_MAVEN_URL: ${{ vars.REPSY_MAVEN_URL }}
        run: |
          set -euo pipefail
          url="${REPSY_MAVEN_URL:-https://repo.repsy.io/mvn/intellisoftdev/liberiaemr}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "publishing to ${url}"

      # On a release, the version IS the tag. versions:set rewrites the reactor so the
      # deployed coordinate matches it; without this a release would publish a SNAPSHOT
      # again and no release version would ever exist.
      #
      # Since the decide job only lets a release through when the pom's base version already
      # equals the tag, all this now changes is dropping -SNAPSHOT — and it still has to run,
      # because that suffix is exactly what must not reach Repsy as a release. It also keeps
      # the reactor's child modules in step, which a hand-edited parent <version> would not.
      - name: Stamp the release version
        if: github.event_name == 'release'
        working-directory: modules/liberiaemr
        run: |
          set -euo pipefail
          mvn -B -q org.codehaus.mojo:versions-maven-plugin:2.16.2:set \
            -DnewVersion="${GITHUB_REF_NAME}" -DgenerateBackupPoms=false
          echo "module stamped as ${GITHUB_REF_NAME}"

      # Refuse the one combination that silently produces a wrong artifact: a release tag
      # that still resolves to a SNAPSHOT, or a main build that somehow is not one.
      - name: Check the version matches the stream
        working-directory: modules/liberiaemr
        run: |
          set -euo pipefail
          version="$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version)"
          echo "module version: ${version}"
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            [[ "${version}" != *SNAPSHOT* ]] \
              || { echo "::error::release ${GITHUB_REF_NAME} would publish a SNAPSHOT"; exit 1; }
            [[ "${version}" == "${GITHUB_REF_NAME}" ]] \
              || { echo "::error::version ${version} does not match release ${GITHUB_REF_NAME}"; exit 1; }
          else
            [[ "${version}" == *SNAPSHOT* ]] \
              || { echo "::error::main must publish a SNAPSHOT, got ${version}." >&2
                   echo "Bump modules/liberiaemr/pom.xml to the next -SNAPSHOT after a release." >&2
                   exit 1; }
          fi

      # -DskipTests: build-and-test above already ran them on this exact commit.
      # altDeploymentRepository takes id::url on Maven 3.8.1+; the id must match server-id.
      - name: Deploy
        working-directory: modules/liberiaemr
        env:
          REPSY_USERNAME: ${{ secrets.REPSY_USERNAME }}
          # Short name, see the setup-java step above.
          REPSY_PW: ${{ secrets.REPSY_PASSWORD }}
        run: |
          set -euo pipefail
          mvn -B -DskipTests deploy \
            -DaltDeploymentRepository="repsy::${{ steps.repsy.outputs.url }}" \
            | tee "$RUNNER_TEMP/deploy.log"

      # The .omod reaches the repository only because omod/pom.xml attaches it with
      # build-helper; nothing else in the build would fail if that attachment stopped working.
      # A reordered plugin, a changed finalName or a build-helper upgrade would publish a jar
      # and a green tick, and the gap would surface as an unresolvable coordinate in whichever
      # distro pinned it. Assert the upload instead of assuming it.
      - name: Check the .omod was published
        run: |
          set -euo pipefail
          grep -qE 'Uploaded to repsy: .*/liberiaemr-omod-[^ ]+\.omod ' "$RUNNER_TEMP/deploy.log" || {
            echo "::error::deploy uploaded no .omod -- check the build-helper attach-omod execution in modules/liberiaemr/omod/pom.xml"
            grep -E 'Uploaded to repsy:' "$RUNNER_TEMP/deploy.log" >&2 || true
            exit 1
          }
          grep -E 'Uploaded to repsy: .*\.omod ' "$RUNNER_TEMP/deploy.log"
