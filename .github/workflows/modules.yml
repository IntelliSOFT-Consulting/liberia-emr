# Backend OMOD pipeline — modules/liberiaemr.
#
# Shaped after packages.yml, which does the same job for the ESMs on npm: one workflow per
# area, PR builds paths-scoped, and publishing only from main or a tag.
#
# Deliberately NOT part of ci.yml. ci.yml carries the single required status check for
# branch protection ("CI gate"), and a publish step that can fail on a credential or a
# registry outage must never be able to block a PR merge. ci.yml still builds and tests this
# module in its backend-module job; this workflow is only about shipping the artifact.
#
# Two version streams, and they are the whole design:
#
#   push to main              ->  x.y.z-SNAPSHOT   the pom's version, re-deployed over itself
#   push liberiaemr-x.y.z     ->  x.y.z            immutable, cut by maven-release-plugin
#
# A GitHub release publishes NOTHING here. The bare x.y.z tags are the distribution's
# release namespace (release.yml); the module's are liberiaemr-x.y.z, cut locally with
# `mvn release:prepare` and pushed after the release PR merges. The decision, its failure
# modes and its test live in scripts/ci/module-publish-decision.sh and
# qa/ci/verify-module-publish-decision.sh. The sequence is docs/runbooks/release-module.md.
#
# The backend image takes neither version: distribution/backend/Dockerfile builds the module
# from source (it COPYs modules/liberiaemr) and stamps it with the distribution version it is
# being built into, so a release image never ships a SNAPSHOT (IMPLEMENTATION.md §6/§11) and
# never depends on the module having been published at all. Repsy is for consumers outside
# this repository.
#
# build-and-test carries no `paths` filter on the push trigger, so it builds on every push to
# main, not just ones that touch modules/. That is the accepted price of a tag trigger that
# cannot silently fail: gating the test job on `decide`'s output would make a bug in the
# decision script also stop the module being tested, and the module's test signal must not
# depend on the publish decision being correct.
name: Modules CI / CD

on:
  # No `paths` filter here, and there cannot be one: `paths` applies to the whole push
  # event, and a tag push reports no changed files — so a paths filter beside the tags
  # filter below would stop module releases firing at all (the reason module releases
  # hung off a GitHub `release:` event before). scripts/ci/module-publish-decision.sh filters main pushes
  # by path instead, which also puts the whole publish decision in one place.
  push:
    branches: [main]
    # maven-release-plugin's tags, namespaced so they cannot collide with the bare x.y.z
    # tags release.yml watches for DISTRIBUTION releases.
    tags: ['liberiaemr-[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main]
    paths:
      - 'modules/**'
      - '.github/workflows/modules.yml'
      - 'scripts/ci/module-publish-decision.sh'
      - 'qa/ci/verify-module-publish-decision.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modules-${{ github.head_ref || github.ref_name }}
  # Never cancel a run that is mid-publish; a half-deployed Maven directory is worse than a
  # queued build. That covers both publishing streams: a push to main, and a push of a
  # liberiaemr-x.y.z tag.
  cancel-in-progress: ${{ github.ref_name != 'main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  JAVA_VERSION: '17'

jobs:
  build-and-test:
    name: Build and test the module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      # This is what makes the `scripts/ci/` and `qa/ci/` entries in the pull_request `paths`
      # filter above meaningful: without it, nothing in this workflow ever runs the test
      # suite, and it starts decaying the day a change breaks it silently. Runs before the
      # Maven build so a broken publish decision fails fast.
      - name: Verify the publish decision
        run: ./qa/ci/verify-module-publish-decision.sh
      - name: Build and test
        working-directory: modules/liberiaemr
        run: mvn -B clean package
      - name: Keep the surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: module-surefire-reports
          path: modules/liberiaemr/*/target/surefire-reports/
          if-no-files-found: ignore

  # modules/liberiaemrreports (ADR 0010 decision 6): build and test only. It is never published
  # to Repsy; the backend image builds it from source, like liberiaemr. It reads its report UUIDs
  # from content-packages/content-liberia-national, so a change there is also tested by ci.yml's
  # reactor build, which includes this module.
  build-and-test-reports:
    name: Build and test the reports module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Build and test
        working-directory: modules/liberiaemrreports
        run: mvn -B clean package
      - name: Keep the surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-module-surefire-reports
          path: modules/liberiaemrreports/*/target/surefire-reports/
          if-no-files-found: ignore

  # Does this event publish anything at all?
  #
  # A separate job rather than an `if:` on a step inside publish, for one reason: GitHub
  # enters a job's `environment:` when the job starts, so a step-level skip would still put
  # an event that ships nothing in front of repsy-publish's reviewer, if one is ever
  # attached. Skipping the whole job never touches the environment.
  #
  # Deliberately does NOT need build-and-test — deciding is a clone, a fetch and a diff, none
  # of which have any reason to queue behind a Maven build. publish needs both.
  decide:
    name: Decide whether to publish
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      # fetch-depth: 0 and the explicit main fetch are for the reachability check in the
      # script: a tag push checks out a detached commit with no branches, so there would
      # otherwise be no origin/main to compare against. This is also load-bearing for the
      # main stream: at the default depth of 1, `git cat-file -e "$BEFORE_SHA"` would always
      # miss, the script would fail open on "no usable base", and EVERY main push would
      # publish. A future "optimisation" back to a shallow clone would change that silently
      # rather than break visibly.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # actions/checkout@v4 with fetch-depth: 0 already leaves origin/main in place on an
      # ordinary checkout. This is belt-and-braces for the case that actually needs it: a
      # detached tag checkout, where the ref being built is not a branch, so an explicit
      # fetch is cheap insurance against a checkout behaviour change removing origin/main.
      - name: Make main available for the reachability check
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - id: decide
        name: Decide whether this event publishes
        env:
          # github.event.before is how the script path-filters a main push, now that the
          # trigger cannot carry a paths filter. It is absent on non-push events, which the
          # script treats as "no usable base" and fails open on.
          BEFORE_SHA: ${{ github.event.before }}
        run: ./scripts/ci/module-publish-decision.sh

  publish:
    name: Publish to Repsy
    runs-on: ubuntu-latest
    needs: [build-and-test, decide]
    if: needs.decide.outputs.publish == 'true'
    # The environment is where REPSY_USERNAME / REPSY_PASSWORD live, and where a required
    # reviewer can be attached if publishing should ever need approval. Same pattern as
    # packages.yml's npm-publish environment.
    environment: repsy-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          # Generates ~/.m2/settings.xml with a <server> whose id matches the repository id
          # used by -DaltDeploymentRepository below. The two names must stay equal.
          #
          # These two values are the NAMES of environment variables for Maven to interpolate,
          # not credentials. REPSY_PW is deliberately short: scripts/validate/no-secrets.sh
          # refuses `password[:=] <12+ characters>` anywhere in the tree, and `server-password:
          # REPSY_PASSWORD` matches that shape exactly. The scanner is right to be blunt about
          # it, so the workflow bends rather than the scanner. Do not "tidy" this back to
          # REPSY_PASSWORD -- it fails the Validate content job. The GitHub secret keeps its
          # full name; only the variable carrying it into Maven is shortened.
          server-id: repsy
          server-username: REPSY_USERNAME
          server-password: REPSY_PW

      # https://repsy.io/intellisoftdev/liberiaemr, whose Maven endpoint is the URL below.
      # Defaulted here rather than required as configuration, the same way
      # scripts/build/build-distribution.sh defaults REGISTRY to intellisoftdev — but still
      # overridable by a repository variable, so moving or renaming the Repsy repo does not
      # need a commit.
      - name: Resolve the Repsy destination
        id: repsy
        env:
          REPSY_MAVEN_URL: ${{ vars.REPSY_MAVEN_URL }}
        run: |
          set -euo pipefail
          url="${REPSY_MAVEN_URL:-https://repo.repsy.io/mvn/intellisoftdev/liberiaemr}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "publishing to ${url}"

      # The decision script already asserted the tag stream's invariants. This re-checks them
      # against the tree the deploy will actually run on, which is a different question: the
      # script reads the pom from a plain checkout, this runs in the publish job.
      - name: Check the version matches the stream
        working-directory: modules/liberiaemr
        run: |
          set -euo pipefail
          version="$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version)"
          echo "module version: ${version}"
          if [[ "${GITHUB_REF}" == refs/tags/liberiaemr-* ]]; then
            want="${GITHUB_REF_NAME#liberiaemr-}"
            [[ "${version}" != *SNAPSHOT* ]] \
              || { echo "::error::tag ${GITHUB_REF_NAME} would publish a SNAPSHOT"; exit 1; }
            [[ "${version}" == "${want}" ]] \
              || { echo "::error::version ${version} does not match tag ${GITHUB_REF_NAME}"; exit 1; }
          else
            [[ "${version}" == *SNAPSHOT* ]] \
              || { echo "::error::main must publish a SNAPSHOT, got ${version}." >&2
                   echo "release:prepare sets the next -SNAPSHOT; check its second commit merged." >&2
                   exit 1; }
          fi

      # -DskipTests: build-and-test above already ran them on this exact commit.
      # altDeploymentRepository takes id::url on Maven 3.8.1+; the id must match server-id.
      - name: Deploy
        working-directory: modules/liberiaemr
        env:
          REPSY_USERNAME: ${{ secrets.REPSY_USERNAME }}
          # Short name, see the setup-java step above.
          REPSY_PW: ${{ secrets.REPSY_PASSWORD }}
        run: |
          set -euo pipefail
          mvn -B -DskipTests deploy \
            -DaltDeploymentRepository="repsy::${{ steps.repsy.outputs.url }}" \
            | tee "$RUNNER_TEMP/deploy.log"

      # The .omod reaches the repository only because omod/pom.xml attaches it with
      # build-helper; nothing else in the build would fail if that attachment stopped working.
      # A reordered plugin, a changed finalName or a build-helper upgrade would publish a jar
      # and a green tick, and the gap would surface as an unresolvable coordinate in whichever
      # distro pinned it. Assert the upload instead of assuming it.
      - name: Check the .omod was published
        run: |
          set -euo pipefail
          grep -qE 'Uploaded to repsy: .*/liberiaemr-omod-[^ ]+\.omod ' "$RUNNER_TEMP/deploy.log" || {
            echo "::error::deploy uploaded no .omod -- check the build-helper attach-omod execution in modules/liberiaemr/omod/pom.xml"
            grep -E 'Uploaded to repsy:' "$RUNNER_TEMP/deploy.log" >&2 || true
            exit 1
          }
          grep -E 'Uploaded to repsy: .*\.omod ' "$RUNNER_TEMP/deploy.log"
