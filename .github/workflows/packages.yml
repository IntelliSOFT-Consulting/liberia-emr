name: Packages CI / CD

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/workflows/packages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/workflows/packages.yml'
  release:
    types:
      - created
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' && github.event_name != 'release' }}

jobs:
  build-and-test:
    name: Build Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Build frontend packages
        run: |
          set -euo pipefail
          for pkg_dir in packages/*; do
            [ -d "$pkg_dir" ] || continue
            pkg_name=$(basename "$pkg_dir")

            if [[ -f "$pkg_dir/package.json" ]]; then
              if [[ "$(node -p "require('./$pkg_dir/package.json').private === true")" == "true" ]]; then
                echo "== Skipping $pkg_name (private) =="
                continue
              fi

              echo "== Building $pkg_name =="
              (
                cd "$pkg_dir"
                yarn install --frozen-lockfile --ignore-engines
                yarn typescript
                yarn build
              )
            fi
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-dist
          path: |
            packages/*/dist

  pre-release:
    name: Publish Pre-release to npm
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: npm-publish

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Version & Publish Pre-releases to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          for pkg_dir in packages/*; do
            [ -d "$pkg_dir" ] || continue
            pkg_name=$(basename "$pkg_dir")

            if [[ -f "$pkg_dir/package.json" ]]; then
              if [[ "$(node -p "require('./$pkg_dir/package.json').private === true")" == "true" ]]; then
                echo "== Skipping $pkg_name (private) =="
                continue
              fi

              echo "== Packaging and Publishing $pkg_name (pre-release) =="
              (
                cd "$pkg_dir"
                yarn install --frozen-lockfile --ignore-engines
                yarn typescript
                yarn build

                # Extract base version from package.json
                base_version=$(node -p "require('./package.json').version.split('-')[0]")
                pre_version="${base_version}-pre.${{ github.run_number }}"

                echo "Updating version to ${pre_version}"
                npm version "$pre_version" --no-git-tag-version --allow-same-version

                echo "Publishing ${pkg_name}@${pre_version} with tag 'next'..."
                npm publish --access public --tag next
              )
            fi
          done

  release:
    name: Publish Stable Release to npm
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'release'
    environment: npm-publish

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish Stable Releases to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          for pkg_dir in packages/*; do
            [ -d "$pkg_dir" ] || continue
            pkg_name=$(basename "$pkg_dir")

            if [[ -f "$pkg_dir/package.json" ]]; then
              if [[ "$(node -p "require('./$pkg_dir/package.json').private === true")" == "true" ]]; then
                echo "== Skipping $pkg_name (private) =="
                continue
              fi

              echo "== Packaging and Publishing $pkg_name (stable release) =="
              (
                cd "$pkg_dir"
                yarn install --frozen-lockfile --ignore-engines
                yarn typescript
                yarn build

                pkg_version="${GITHUB_REF_NAME#v}"
                npm version "$pkg_version" --no-git-tag-version --allow-same-version
                if npm view "${pkg_name}@${pkg_version}" version >/dev/null 2>&1; then
                  echo "${pkg_name}@${pkg_version} already published — skipping"
                else
                  echo "Publishing ${pkg_name}@${pkg_version} with tag 'latest'..."
                  npm publish --access public --tag latest
                fi
              )
            fi
          done
