name: Packages CI / CD

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/workflows/packages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/workflows/packages.yml'
  release:
    types:
      - created
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' && github.event_name != 'release' }}

jobs:
  build-and-test:
    name: Build Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Build frontend packages
        run: |
          set -euo pipefail
          for pkg_dir in packages/*; do
            [ -d "$pkg_dir" ] || continue
            pkg_name=$(basename "$pkg_dir")

            if [[ -f "$pkg_dir/package.json" ]]; then
              if [[ "$(node -p "require('./$pkg_dir/package.json').private === true")" == "true" ]]; then
                echo "== Skipping $pkg_name (private) =="
                continue
              fi

              echo "== Building $pkg_name =="
              (
                cd "$pkg_dir"
                yarn install --no-frozen-lockfile
                yarn typescript
                yarn build
              )
            fi
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-dist
          path: |
            packages/*/dist

  pre-release:
    name: Publish Pre-release to npm
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: npm-publish

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Version & Publish Pre-releases to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          failed=()

          for pkg_dir in packages/*; do
            [ -d "$pkg_dir" ] || continue
            [ -f "$pkg_dir/package.json" ] || continue
            pkg_name=$(basename "$pkg_dir")

            if [[ "$(node -p "require('./$pkg_dir/package.json').private === true")" == "true" ]]; then
              echo "== Skipping $pkg_name (private) =="
              continue
            fi

            echo "== Packaging and Publishing $pkg_name (pre-release) =="
            # Each package runs in its own subshell so one failure does not
            # abandon the packages that come after it in the loop. The subshell
            # is a standalone command, never an `if` condition — bash suppresses
            # errexit inside a condition, which would let a failed build publish.
            set +e
            (
              set -euo pipefail
              cd "$pkg_dir"

              # Read the published name from package.json — the directory
              # basename is unscoped and will not resolve on the registry.
              npm_name=$(node -p "require('./package.json').name")
              base_version=$(node -p "require('./package.json').version.split('-')[0]")
              pre_version="${base_version}-pre.${RUN_NUMBER}"

              # Re-runs reuse github.run_number, so skip what is already up.
              if npm view "${npm_name}@${pre_version}" version >/dev/null 2>&1; then
                echo "${npm_name}@${pre_version} already published — skipping"
                exit 0
              fi

              yarn install --no-frozen-lockfile
              yarn typescript
              yarn build

              echo "Updating version to ${pre_version}"
              npm version "$pre_version" --no-git-tag-version --allow-same-version

              echo "Publishing ${npm_name}@${pre_version} with tag 'next'..."
              npm publish --access public --tag next
            )
            status=$?
            set -e
            if (( status != 0 )); then
              echo "::error::Pre-release publish failed for ${pkg_name}"
              failed+=("$pkg_name")
            fi
          done

          if (( ${#failed[@]} > 0 )); then
            echo "::error::Pre-release publish failed for: ${failed[*]}"
            exit 1
          fi

          echo "All pre-release packages published."

  release:
    name: Publish Stable Release to npm
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'release'
    environment: npm-publish

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish Stable Releases to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          failed=()

          for pkg_dir in packages/*; do
            [ -d "$pkg_dir" ] || continue
            [ -f "$pkg_dir/package.json" ] || continue
            pkg_name=$(basename "$pkg_dir")

            if [[ "$(node -p "require('./$pkg_dir/package.json').private === true")" == "true" ]]; then
              echo "== Skipping $pkg_name (private) =="
              continue
            fi

            echo "== Packaging and Publishing $pkg_name (stable release) =="
            # Each package runs in its own subshell so one failure does not
            # abandon the packages that come after it in the loop. The subshell
            # is a standalone command, never an `if` condition — bash suppresses
            # errexit inside a condition, which would let a failed build publish.
            set +e
            (
              set -euo pipefail
              cd "$pkg_dir"

              # Read the published name from package.json — the directory
              # basename is unscoped and will not resolve on the registry.
              npm_name=$(node -p "require('./package.json').name")
              pkg_version="${GITHUB_REF_NAME#v}"

              if npm view "${npm_name}@${pkg_version}" version >/dev/null 2>&1; then
                echo "${npm_name}@${pkg_version} already published — skipping"
                exit 0
              fi

              yarn install --no-frozen-lockfile
              yarn typescript
              yarn build

              npm version "$pkg_version" --no-git-tag-version --allow-same-version

              echo "Publishing ${npm_name}@${pkg_version} with tag 'latest'..."
              npm publish --access public --tag latest
            )
            status=$?
            set -e
            if (( status != 0 )); then
              echo "::error::Stable release publish failed for ${pkg_name}"
              failed+=("$pkg_name")
            fi
          done

          if (( ${#failed[@]} > 0 )); then
            echo "::error::Stable release publish failed for: ${failed[*]}"
            exit 1
          fi

          echo "All stable release packages published."
