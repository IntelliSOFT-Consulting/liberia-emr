---
name: Java DevSecOps Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write
  actions: read
  checks: write

env:
  JAVA_VERSION: "17"
  REGISTRY: intellisoftdev
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build, Test, JaCoCo & SonarQube
  build-test:
    name: Build, Test & SonarQube
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ github.sha }}

    steps:
      # Checkout
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Cache SonarQube packages
      - name: Cache SonarQube Packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      # Build, test and analyze
      - name: Build, Test & SonarQube Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -B verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.2.0.4988:sonar \
            -Dsonar.projectKey=liberia-emr \
            -Dsonar.host.url=${SONAR_HOST_URL} \
            -Dsonar.token=${SONAR_TOKEN} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true

      # Upload JUnit results
      - name: Upload JUnit Results
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: target/surefire-reports/
          if-no-files-found: warn

      # Upload JaCoCo report
      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: warn

  # Software Bill of Materials
  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest

    needs:
      - build-test

    steps:
      # Checkout
      - uses: actions/checkout@v4

      # Setup Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Generate SBOM
      - name: Generate CycloneDX SBOM
        run: |
          mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom

      # Upload SBOM
      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: |
            target/bom.xml
            target/bom.json
          if-no-files-found: warn

  # Software Composition Analysis
  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    needs:
      - build-test

    steps:
      # Checkout
      - uses: actions/checkout@v4

      # Setup Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Cache Dependency Check database
      - name: Cache Dependency Check Database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-${{ runner.os }}

      # Run Dependency Check
      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: liberia-emr
          path: .
          format: ALL
          out: reports

      # Upload reports
      - name: Upload Dependency Check Reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports
          if-no-files-found: warn

  # Build Docker images
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    needs:
      - sbom
      - dependency-check

    strategy:
      matrix:
        service:
          - backend
          - frontend
          - gateway

    steps:
      # Checkout
      - uses: actions/checkout@v4

      # Setup Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build image
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: distribution/docker/${{ matrix.service }}/Dockerfile
          tags: ${{ env.REGISTRY }}/liberia-emr-${{ matrix.service }}:${{ github.sha }}
          push: false
          load: true