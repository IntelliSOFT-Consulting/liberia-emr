# Release pipeline — IMPLEMENTATION.md §8.
#
#   validate -> build content -> Initializer on a clean DB -> metadata tests
#   -> build distribution -> launch full stack -> API + Cypress
#   -> TEST UPGRADE FROM PREVIOUS RELEASE   <- the critical stage
#   -> publish -> deploy to staging -> approve production
name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: Release version (x.y.z)
        required: true

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/intellisoft-consulting
  # The sites one release builds (LE-360). The guard checks them and the build matrix reads
  # them from its output, so there is one list. Shared images come from the first facility
  # site in it (scripts/build/image-refs.sh).
  RELEASE_SITES: careysburg barnersville central
  # The publish job promotes release candidates only once the full-stack and upgrade stages
  # below really test them (IMPLEMENTATION.md section 8). Both are placeholders today, so
  # promotion refuses to run: set this to "true" in the PR that implements them.
  RELEASE_TESTS_READY: "false"

jobs:
  guard:
    name: Release guards
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.sites.outputs.sites }}
      shared_from: ${{ steps.sites.outputs.shared_from }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject latest / dynamic / -SNAPSHOT versions
        run: |
          version="${{ github.event.inputs.version || github.ref_name }}"
          case "$version" in
            *SNAPSHOT*|latest) echo "refusing to release '$version'"; exit 1 ;;
          esac
          grep -nE '=[[:space:]]*(latest|LATEST)|-SNAPSHOT' distribution/distro.properties \
            && { echo "distro.properties contains a dynamic or snapshot version"; exit 1; }
          echo "version discipline ok"
      - run: ./scripts/validate/validate-content.sh
      - run: ./scripts/validate/no-secrets.sh
      - run: ./scripts/validate/no-demo-in-release.sh
      # LE-360: two sites must never publish the same repository at one version, or the second
      # push silently replaces the first and a facility pulls another site's content.
      - name: Every published image reference is distinct
        run: ./scripts/build/image-refs.sh --check $RELEASE_SITES
      - name: Site list for the build matrix
        id: sites
        run: |
          echo "sites=$(printf '%s\n' $RELEASE_SITES | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          for s in $RELEASE_SITES; do
            if [ "$s" != central ]; then echo "shared_from=$s" >> "$GITHUB_OUTPUT"; break; fi
          done

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: guard
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # central builds only liberia-emr-frontend-central; it runs the facility images of
        # the same version otherwise (docs/adr/0011-central-composition.md).
        site: ${{ fromJSON(needs.guard.outputs.sites) }}
    # Without this the release images ship without the MOH's curated CIEL
    # collections, and build-distribution.sh only WARNS about that — so the
    # release would build green and fail at the facility instead. Pin
    # ocl.collection.version in distro.properties before cutting a release
    # too: an empty value exports HEAD, so two builds of one tag can differ.
    env:
      OCL_API_TOKEN: ${{ secrets.OCL_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build immutable versioned images
        run: |
          ./scripts/build/build-distribution.sh \
            --version "${{ github.event.inputs.version || github.ref_name }}" \
            --site "${{ matrix.site }}"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Each matrix job runs on its own machine, so publish cannot push what this job built.
      # Push it here under a candidate tag that no deploy uses; publish promotes it to the
      # release tag only after the tests below, without rebuilding. Only this site's own
      # images, plus the shared ones from the one site the guard named, so no two jobs ever
      # push the same repository (LE-360).
      - name: Push this site's images as release candidates
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
          CANDIDATE: ${{ github.event.inputs.version || github.ref_name }}-rc.${{ github.run_id }}
          SITE: ${{ matrix.site }}
          SHARED_FROM: ${{ needs.guard.outputs.shared_from }}
        run: |
          repos="$(./scripts/build/image-refs.sh --site "$SITE" --role site)"
          if [ "$SITE" = "$SHARED_FROM" ]; then
            repos="$repos $(./scripts/build/image-refs.sh --role shared)"
          fi
          for repo in $repos; do
            docker tag "${REGISTRY}/${repo}:${VERSION}" "${REGISTRY}/${repo}:${CANDIDATE}"
            docker push "${REGISTRY}/${repo}:${CANDIDATE}"
          done

  full-stack-tests:
    name: Full stack — API + Cypress
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Launch the complete Docker environment
        run: 'echo "TODO: bring up distribution/compose/facility"'
      - name: API tests
        run: 'echo "TODO: qa/api"'
      - name: Cypress
        run: 'echo "TODO: qa/e2e"'

  upgrade-test:
    name: Upgrade from the previous release
    runs-on: ubuntu-latest
    needs: full-stack-tests
    steps:
      - uses: actions/checkout@v4
      # THE critical stage. A clean install passes against an empty database, where there
      # is nothing to collide with. Only this stage surfaces UUID collisions, changed
      # concept datatypes, retired metadata still referenced by patient data, and altered
      # workflow semantics. See qa/upgrade/README.md.
      - name: Restore the previous release database and upgrade onto it
        run: ./qa/upgrade/run-upgrade.sh

  publish:
    name: Publish images and packages
    runs-on: ubuntu-latest
    needs: [guard, upgrade-test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Promotes every candidate the build jobs pushed to the release tag, server-side: the
      # bytes that were tested are the bytes released, nothing is rebuilt. The repository list
      # comes from the same script the build jobs and the guard used.
      - name: Refuse to publish images the release has not tested
        if: env.RELEASE_TESTS_READY != 'true'
        run: |
          echo "::error::The full-stack and upgrade stages are still placeholders, so nothing has tested the candidate images. Implement them against the -rc.${{ github.run_id }} candidates, then set RELEASE_TESTS_READY to true (IMPLEMENTATION.md section 8)."
          exit 1
      - name: Promote the release candidates to the release tag
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
          CANDIDATE: ${{ github.event.inputs.version || github.ref_name }}-rc.${{ github.run_id }}
          SITES: ${{ join(fromJSON(needs.guard.outputs.sites), ' ') }}
        run: |
          repos="$(./scripts/build/image-refs.sh --role shared)"
          for s in $SITES; do
            repos="$repos $(./scripts/build/image-refs.sh --site "$s" --role site)"
          done
          for repo in $repos; do
            docker buildx imagetools create \
              -t "${REGISTRY}/${repo}:${VERSION}" "${REGISTRY}/${repo}:${CANDIDATE}"
            echo "published ${REGISTRY}/${repo}:${VERSION}"
          done

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: publish
    environment: staging
    steps:
      # Still a stub. When this is implemented, pass LEGACY_ADMIN_UI=true on the
      # compose command exactly as deploy-dev does in ci.yml — staging is a
      # non-production environment and is allowed the legacy admin UI:
      #
      #   LIBERIAEMR_VERSION=<tag> LEGACY_ADMIN_UI=true \
      #     docker compose --env-file facility.env up -d
      #
      # Set it on the command, not in the staging server's facility.env, so it
      # cannot travel with a copied env file into a facility.
      - run: 'echo "TODO: deploy to staging"'

  approve-production:
    name: Production release
    runs-on: ubuntu-latest
    needs: deploy-staging
    # Manual approval gate configured on the environment.
    environment: production
    steps:
      # Production deploys are manual and must NOT set LEGACY_ADMIN_UI. The gateway
      # image and the compose files both default it to false, which is what keeps MOH
      # ICT SOP control D5 enforced in production. See docs/security/moh-ict-sop-mapping.md.
      - run: echo "Approved. Deploy per docs/runbooks/deploy.md."
