# Pull-request pipeline — IMPLEMENTATION.md §8, stages 1-5, extended with
# SBOM / dependency-check / container build (formerly a separate
# "Java DevSecOps Pipeline" workflow, merged in to avoid building the
# Maven reactor twice per run).
# The release stages (upgrade test, publish, deploy) live in release.yml.
name: CI

on:
  # main only. This trigger used to carry no branches: filter, so every branch
  # push ran the pipeline — but a push to a branch that already had a PR fired
  # this workflow TWICE for one commit, and the concurrency group below cancelled
  # one of the two. A cancelled run still publishes a check run for every job in
  # its plan, so the commit ended up with two checks named "CI gate": one from the
  # run that finished, one cancelled. GitHub requires EVERY check run carrying a
  # required context to pass, so the cancelled leftover blocked the PR even when
  # the surviving run was green — see the gate job for the full story.
  #
  # A required status check therefore needs exactly one run per commit, and that
  # run is the pull_request one. The cost is that a branch gets no CI until a PR
  # exists for it; workflow_dispatch below covers an ad-hoc run before then. (A
  # draft PR also runs it, but moves the Jira issue to In Review — CONTRIBUTING.md.)
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# This used to be what stopped a commit being built twice, back when a branch push
# and its pull_request both triggered the workflow; the push trigger above is now
# restricted to main, so only one event fires per commit and there is nothing left
# to collapse. What the group still does is make a NEW commit cancel the run still
# going for the previous one, instead of queueing behind it.
#
# The key is still the BRANCH rather than the event: on a pull_request event
# github.head_ref is the source branch, on a push it is empty and ref_name is the
# branch, so successive runs for one branch share a group however they were
# triggered — including a workflow_dispatch run on a branch that also has a PR.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  # Never on main. publish-latest, deploy-dev, smoke-test, rollback-dev and dast
  # only run there, so cancelling a run in flight could abort a publish halfway,
  # or leave a deploy half-applied with the rollback job cancelled along with it.
  # Superseded main builds are cheap by comparison.
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read
  security-events: write
  actions: read
  checks: write

env:
  JAVA_VERSION: "17"
  REGISTRY: intellisoftdev
  IMAGE_NAME: liberia-emr

jobs:
  # ---------------------------------------------------------------------
  # Stage 0 — what does this commit actually touch?
  #
  # initializer-clean-db is the longest job in this pipeline by a wide
  # margin: 18 minutes, of which 15 are the CIEL import into an empty
  # database. It is worth every second on a commit that changes a CSV, and
  # nothing at all on one that changes a bash script or a runbook — both of
  # which have paid it in full.
  #
  # The path list is an ALLOW list and deliberately over-broad: content, the
  # whole distribution tree (Dockerfiles, compose, distro.properties), the
  # build scripts that fetch and sanitise the OCL exports, the QA script
  # itself, the indicator-report check the job also runs (qa/reporting/),
  # the reactor pom, and this workflow. modules/ is in the list too:
  # the backend image builds the in-tree OMOD into itself, and that module
  # carries a liquibase changeset and its own global properties, so a change
  # there changes what a clean database ends up holding.
  # Anything that could plausibly change what Initializer loads, or how it is
  # loaded, keeps the gate.
  #
  # Every uncertain case FAILS OPEN — no base commit, an unknown SHA, a
  # branch's first push, workflow_dispatch — because a metadata gate that
  # skips when it cannot tell is worse than one that runs when it need not.
  # ---------------------------------------------------------------------
  changes:
    name: Detect what changed
    runs-on: ubuntu-latest
    outputs:
      metadata: ${{ steps.filter.outputs.metadata }}
      sync: ${{ steps.filter.outputs.sync }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the diff below needs both ends of the range
      - id: filter
        name: Does this commit touch anything that can change metadata?
        env:
          # On a PR, compare against the branch point. On a push, against the
          # commit that was there before. Both come from the event payload;
          # neither is guaranteed to be usable, which the check below handles.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          if [[ -z "${BASE_SHA:-}" ]] || [[ "$BASE_SHA" =~ ^0+$ ]] \
             || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "No usable base commit (${BASE_SHA:-none}) — running the metadata gate."
            echo "metadata=true" >> "$GITHUB_OUTPUT"
            echo "sync=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Three dots on a PR: changes since the branch point, not changes
          # main has made in the meantime. Two on a push: exactly what the
          # push added.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            files="$(git diff --name-only "${BASE_SHA}...HEAD")"
          else
            files="$(git diff --name-only "${BASE_SHA}" HEAD)"
          fi

          echo "Changed files since ${BASE_SHA}:"
          sed 's/^/  /' <<<"$files"

          if grep -qE '^(content-packages/|distribution/|modules/|qa/upgrade/|qa/reporting/|scripts/build/|pom\.xml$|\.github/workflows/ci\.yml$)' <<<"$files"; then
            echo "metadata=true" >> "$GITHUB_OUTPUT"
            echo "-> metadata could have changed; the clean-database gate will run."
          else
            echo "metadata=false" >> "$GITHUB_OUTPUT"
            echo "-> nothing here can change what Initializer loads; skipping the clean-database gate."
          fi

          if grep -qE '^(distribution/(sync|broker|monitoring|compose|env|gateway)/|distribution/distro\.properties$|scripts/(security|sync)/|qa/sync/|\.github/workflows/ci\.yml$)' <<<"$files"; then
            echo "sync=true" >> "$GITHUB_OUTPUT"
            echo "-> the sync security surface changed; the broker refusal suite will run."
          else
            echo "sync=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------
  # Stage 1 — content validation (no build required)
  # ---------------------------------------------------------------------
  validate:
    name: Validate content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # no-secrets.sh uses git ls-files and git grep
      - name: Validate JSON / CSV / version discipline / variables
        run: ./scripts/validate/validate-content.sh
      - name: Refuse secrets, keys and PHI
        run: ./scripts/validate/no-secrets.sh
      # LE-340: proves the scanner still catches short, symbol-bearing credentials and still
      # lets references, placeholders and allowlisted throwaways through.
      - name: The secret scanner catches what it should
        run: ./scripts/validate/tests/no-secrets.test.sh
      - name: Refuse demo content in a production distribution
        run: ./scripts/validate/no-demo-in-release.sh
      # LE-360: the release guard runs the same check, but only when a tag is cut. Reading the
      # site list from release.yml keeps one list and catches a colliding site on the PR.
      - name: Every image a release publishes has a distinct reference
        run: |
          sites="$(sed -n 's/^  RELEASE_SITES: //p' .github/workflows/release.yml)"
          [ -n "$sites" ] || { echo "RELEASE_SITES not found in release.yml"; exit 1; }
          # shellcheck disable=SC2086  # one argument per site
          ./scripts/build/image-refs.sh --check $sites
      # content-demo is upstream's, vendored verbatim. A local edit there is invisible in
      # review and lost at the next re-lift, so it is caught here instead. Needs network:
      # it re-fetches the pinned tag and verifies the commit it resolves to.
      - name: Refuse hand edits to the lifted demo content
        run: ./scripts/build/lift-demo-content.sh --check
      # Runs here rather than with the sync checks because a content change alone can break it.
      - name: Sync receiver skips the records every install shares
        run: |
          # sync-operations.md section 12. The admin provider and the person it hangs on are the
          # content package's, so the receiver's list has to follow them. The other three uuids
          # are OpenMRS core's own, fixed in its liquibase.
          content=content-packages/content-liberia-national/configuration
          provider="$(sed -n "s/.*'ADMIN-PROV'.*'\([0-9a-f-]\{36\}\)'.*/\1/p" \
            "$content/backend_configuration/liquibase/admin-provider.xml")"
          person="$(sed -n 's/^var\.person\.admin\.uuid=//p' "$content/variables.properties")"
          [ -n "$provider" ] && [ -n "$person" ] \
            && grep -qx "var.provider.admin.uuid=$provider" "$content/variables.properties" \
            && grep -q "uuid = '$person'" "$content/backend_configuration/liquibase/admin-provider.xml" \
            || { echo "the admin provider and person uuids in variables.properties and admin-provider.xml disagree"; exit 1; }
          expected="users:82f18b44-6814-11e8-923f-e9a88dcb533f,person:$person,person_name:5f897a68-6814-11e8-923f-e9a88dcb533f,provider:f9badd80-ab76-11e2-9e96-0800200c9a66,provider:$provider"
          grep -qx "db-sync.excludedEntities=$expected" distribution/sync/receiver-application.properties.template \
            || { echo "receiver template must exclude exactly: $expected"; exit 1; }

  # ---------------------------------------------------------------------
  # Stage 2 — build, test, content packages, coverage, static analysis
  #
  # This single `mvn verify` builds the whole reactor, which includes the
  # content-packages module — so this job produces both the JUnit/JaCoCo
  # output AND the content package zips. There is deliberately no separate
  # "build-content" job any more; running `mvn verify` twice against the
  # same reactor wasted ~the whole build time for no extra coverage.
  # ---------------------------------------------------------------------
  build-test:
    name: Build, Test & SonarQube
    runs-on: ubuntu-latest
    needs: validate

    outputs:
      image-tag: ${{ github.sha }}

    # Secrets can't be referenced directly inside a step's `if:` condition
    # (GitHub Actions rejects it at parse time — "Unrecognized named-value:
    # 'secrets'"). Routing them through job-level env first makes them
    # readable from `if:` via the env context instead.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # sonar wants blame history

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Cache SonarQube Packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Build, Test & Validate against Initializer schema
        run: mvn -B clean verify

      # docker-build below builds a facility (careysburg) distribution, whose script checks
      # the facility compose's SPA_CONFIG_URLS. Nothing in CI builds the central frontend, so
      # its list is checked here against the order a central build would collect. Needs only
      # the content packages built above. See docs/adr/0011-central-composition.md.
      - name: Check the central SPA_CONFIG_URLS
        run: |
          ./scripts/build/collect-frontend-config.sh --site central --out "$RUNNER_TEMP/central-config"
          ./scripts/validate/spa-config-urls.sh distribution/compose/central/docker-compose.yml \
            "$RUNNER_TEMP/central-config/.config-urls"

      # Sonar only runs if the secret is actually configured, so this
      # doesn't hard-fail on fork PRs (which never get repo secrets).
      - name: SonarQube Analysis
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.2.0.4988:sonar \
            -Dsonar.projectKey=liberia-emr \
            -Dsonar.host.url=${SONAR_HOST_URL} \
            -Dsonar.token=${SONAR_TOKEN} \
            -Dsonar.qualitygate.wait=true

      # The gate's verdict alone says nothing about *which* condition failed, and the Sonar server
      # is not visible to most contributors. On failure, print the failing conditions, the new
      # issues and the unreviewed hotspots, so the fix can be read from the run log.
      - name: Explain a failed SonarQube quality gate
        if: ${{ failure() && env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        run: |
          task_file=target/sonar/report-task.txt
          if [ ! -f "$task_file" ]; then echo "No Sonar report-task.txt; the analysis did not run."; exit 0; fi
          api() { curl -sf -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/$1"; }
          task=$(sed -n 's/^ceTaskId=//p' "$task_file")
          analysis=$(api "ce/task?id=${task}" | jq -r '.task.analysisId // empty')
          echo "::group::Failing quality gate conditions"
          api "qualitygates/project_status?analysisId=${analysis}" \
            | jq -r '.projectStatus.conditions[] | select(.status != "OK")
                     | "\(.metricKey): actual=\(.actualValue) \(.comparator) threshold=\(.errorThreshold)"'
          echo "::endgroup::"
          echo "::group::New issues (first 100)"
          api "issues/search?componentKeys=liberia-emr&inNewCodePeriod=true&resolved=false&ps=100" \
            | jq -r '.issues[] | "\(.severity) \(.type) \(.rule) \(.component | sub("^liberia-emr:"; "")):\(.line // 0) \(.message)"'
          echo "::endgroup::"
          echo "::group::New security hotspots to review"
          api "hotspots/search?projectKey=liberia-emr&inNewCodePeriod=true&status=TO_REVIEW&ps=100" \
            | jq -r '.hotspots[] | "\(.vulnerabilityProbability) \(.securityCategory) \(.component | sub("^liberia-emr:"; "")):\(.line // 0) \(.message)"'
          echo "::endgroup::"

      - name: Upload JUnit Results
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          # The reactor's in-tree modules write their own reports; the root has none of its own.
          path: |
            target/surefire-reports/
            modules/*/*/target/surefire-reports/
          if-no-files-found: warn

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          # Only modules/liberiaemrreports runs JaCoCo in this reactor; its per-module jacoco.xml
          # is also what the sonar step reads (sonar.coverage.jacoco.xmlReportPaths in its pom).
          path: modules/liberiaemrreports/*/target/site/jacoco
          if-no-files-found: warn

      - name: Upload Content Packages
        uses: actions/upload-artifact@v4
        with:
          name: content-packages
          path: content-packages/*/target/*.zip
          if-no-files-found: error

      # Raw (unzipped) per-layer frontend config JSON, for docker-build's
      # frontend leg to run collect-frontend-config.sh against without
      # rebuilding the reactor. upload-artifact strips the common leading
      # directory across the matched paths (here, "content-packages/"), so
      # the artifact's internal paths start at <layer>/target/... —
      # downloading it back with `path: content-packages` restores exactly
      # content-packages/<layer>/target/configuration/frontend_configuration/,
      # which is the path collect-frontend-config.sh expects.
      - name: Upload Frontend Configuration
        uses: actions/upload-artifact@v4
        with:
          name: frontend-config
          path: content-packages/*/target/configuration/frontend_configuration/config-*.json
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Stage 3 — software supply-chain checks, run in parallel off the same build
  # ---------------------------------------------------------------------
  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Generate CycloneDX SBOM
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: |
            target/bom.xml
            target/bom.json
          if-no-files-found: warn

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: build-test
    # Only needed to read the secret at runtime inside a bash if-check —
    # secrets can't be referenced directly in a step's `if:` (same parse
    # restriction we hit with SONAR_TOKEN earlier), so this routes it
    # through job-level env instead.
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compute cache week
        id: date
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache Dependency Check Database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          # Rotates weekly: a fresh cache once a week forces a full DB
          # rebuild occasionally (the DB format can change between plugin
          # versions), but restore-keys falls back to last week's cache on
          # a miss, so most days still get a fast incremental update
          # instead of a cold download.
          key: dependency-check-${{ runner.os }}-${{ steps.date.outputs.week }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      # Without an API key, NVD heavily rate-limits update requests — this
      # is usually the actual bottleneck, more than caching alone fixes.
      # Get a free key at https://nvd.nist.gov/developers/request-an-api-key
      # and add it as the NVD_API_KEY repo secret; this step just uses it
      # if present and warns (without failing) if it's missing.
      # `package` runs first so the reactor can resolve in-tree module dependencies: the reports
      # omod depends on, and unpacks (MDEP-98), its sibling api jar, which must be packaged first.
      - name: Run OWASP Dependency Check
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            mvn -B -DskipTests package org.owasp:dependency-check-maven:12.1.8:check -Dnvd.api.key="$NVD_API_KEY"
          else
            echo "::warning::NVD_API_KEY not set — NVD updates will be rate-limited and slow. See https://nvd.nist.gov/developers/request-an-api-key"
            mvn -B -DskipTests package org.owasp:dependency-check-maven:12.1.8:check
          fi
      - name: Upload Dependency Check Reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: |
            **/target/dependency-check-report.html
            **/target/dependency-check-report.xml
            **/target/dependency-check-report.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # Stage 4a — initializer smoke test against a clean database
  # ---------------------------------------------------------------------
  initializer-clean-db:
    name: Initializer against a clean database
    runs-on: ubuntu-latest
    # Runs in parallel with the security scans rather than behind them —
    # see the `gate` job at the end of this file for where sbom and
    # dependency-check are actually enforced.
    needs: [build-test, changes]
    # Skipped when nothing in this commit can affect what Initializer loads.
    # See the `changes` job for the path list and for why it fails open. The
    # gate at the end of this file accepts a skip HERE and only here.
    if: needs.changes.outputs.metadata == 'true'
    # The MOH's curated CIEL collections (ocl.org / ocl.collections in
    # distro.properties) are fetched by build-distribution.sh at build time;
    # the exports are gitignored, so without this the runner has only the
    # token-free reference-application dictionaries and every concept that
    # maps to a CIEL source fails to load. The script warns and carries on
    # rather than failing when the token is absent, which is what keeps fork
    # PRs (which never receive repo secrets) working — but it also means a
    # missing secret shows up as rejected metadata further down, not as a
    # clear "no credentials" error. See the ocl/ README.
    env:
      OCL_API_TOKEN: ${{ secrets.OCL_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      # run-clean-install.sh starts a built distribution; it does not build one, and the
      # image is not published from a pull request, so this job builds it via
      # build-distribution.sh, which fetches the OCL/CIEL exports (OCL_API_TOKEN below) before
      # running its own `mvn package`. The build-test content-packages artifact is not
      # downloaded here — its build never fetches OCL content, so it isn't a substitute.
      #
      # 0.0.0-ci, not 1.0.0-SNAPSHOT: build-distribution.sh refuses to build at a -SNAPSHOT
      # or floating version, and rightly so. This is a fixed, obviously-not-a-release tag for
      # a stack that is destroyed at the end of the job.
      - name: Build the backend image under test
        run: |
          ./scripts/build/build-distribution.sh \
            --version 0.0.0-ci --site careysburg --no-frontend
      # Loading metadata into an empty database is the cheapest way to catch a broken CSV,
      # an unresolved ${var.*} or a forward reference between layers.
      # --keep-stack: on a pass the stack stays up for the indicator-report check below, which
      # needs exactly this — a facility stack with a clean database and nothing else in it.
      - name: Load all metadata into an empty database
        run: ./qa/upgrade/run-clean-install.sh --version 0.0.0-ci --no-frontend --keep-stack
      # run-clean-install.sh saves the whole initializer.log on failure, but only prints a
      # 40-line excerpt — enough to name the rejected file, rarely enough to explain it. The
      # rest is lost when the runner is torn down, and recovering it costs a full re-run of
      # this 13-minute job. Keep it: the log is the only place the load ORDER of the concept
      # CSVs is visible, which is what a cross-file answer reference failure turns on.
      - name: Keep the Initializer log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: initializer-log
          path: qa/upgrade/initializer-failure.log
          if-no-files-found: ignore
      # LE-336: the reporting ETL's definition of done (ADR 0010, Consequences, "QA gate") on
      # the stack just installed. Here and not in the End-to-end job because the expected values
      # count every patient in the database, and the demo stack has patients of its own.
      # run-stack-check.sh loads the Careysburg fixtures and asserts, in order: setupEtl()
      # deployed as the ETL user (every routine's definer, no SUPER, no global grant, the
      # MariaDB flags on); a full run succeeds with an empty _mamba_etl_error_log; all 42
      # Careysburg rows of expected-values.csv match (compare-reports.py); a late, back-dated
      # row is picked up by an incremental run and the rows still match; no liberiaemr_etl event
      # is in the binlog. Measured locally at 48 seconds; each step's time lands in the job summary.
      # Central's check is too costly here (its own image and a second dictionary import) and is
      # run by hand: docs/runbooks/reporting-etl.md section 10.
      - name: Indicator reports match their expected values on the clean stack
        run: |
          qa/reporting/run-stack-check.sh --role facility --site careysburg -- \
            -f distribution/compose/facility/docker-compose.yml \
            --env-file qa/upgrade/clean-install.env
      - name: Tear down the clean-install stack
        if: always()
        run: |
          if [[ -f qa/upgrade/clean-install.env ]]; then
            docker compose -f distribution/compose/facility/docker-compose.yml \
              --env-file qa/upgrade/clean-install.env down -v || true
          fi
          rm -rf qa/upgrade/clean-install.env qa/upgrade/.ci-certs
      - name: API tests
        run: 'echo "TODO: qa/api — see qa/api/README.md"'

  # ---------------------------------------------------------------------
  # Stage 4a' — upgrade onto this commit from main (LE-400)
  #
  # The clean install above cannot see what an upgrade breaks: a shipped UUID moved to a name
  # an existing row still holds, a datatype changed under recorded observations, metadata
  # retired while patient data uses it. Both dev servers hit the first on 2026-10-03.
  # run-upgrade.sh installs main's newest published backend image (liberia-emr-backend:<sha>,
  # pushed by publish-latest for every green main commit), writes synthetic patient data,
  # recreates the backend at this commit's image on the same database, and fails on any row
  # Initializer rejects or any change to what the data references. Same trigger as the clean
  # install, and the gate accepts the same skip. See qa/upgrade/README.md.
  # ---------------------------------------------------------------------
  upgrade-from-main:
    name: Upgrade from main
    runs-on: ubuntu-latest
    needs: [build-test, changes]
    if: needs.changes.outputs.metadata == 'true'
    env:
      OCL_API_TOKEN: ${{ secrets.OCL_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # main's first-parent history, which run-upgrade.sh walks back to the newest commit
          # whose image is published
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Build the backend image under test
        run: |
          ./scripts/build/build-distribution.sh \
            --version 0.0.0-ci --site careysburg --no-frontend
      - name: Upgrade onto it from main's newest published image
        run: ./qa/upgrade/run-upgrade.sh --to 0.0.0-ci

  # ---------------------------------------------------------------------
  # Stage 4b — the three distribution images for this commit (not pushed).
  #
  # This calls scripts/build/build-distribution.sh directly instead of
  # hand-rolling the build — an earlier version of this job reimplemented
  # its steps piecemeal (reading spa.core, computing SPA_CONFIG_URLS,
  # collecting frontend config) and, in doing so, missed a step the script
  # doesn't skip: resolving the 31 OMODs pinned in distro.properties into
  # distribution/backend/modules/. Since that directory isn't git-tracked,
  # a fresh checkout has it empty, and `COPY distribution/backend/modules/`
  # on an empty directory does not error — it silently ships a backend
  # image with zero OMODs. The script closes that gap, and also reconciles
  # the collected frontend config order against SPA_CONFIG_URLS in the
  # compose file, which nothing here was checking before.
  #
  # This is the same script initializer-clean-db calls and that a real
  # release build runs too, so a green build-distribution.sh here is a
  # meaningful signal, not just "the Dockerfiles happen to work in CI."
  #
  # Cost: the script runs its own `mvn package`, on top of build-test's reactor build. That
  # duplication is unavoidable here — build-test's build never fetches the OCL/CIEL exports
  # (no OCL_API_TOKEN in that job), so its output isn't a valid substitute for what a real
  # image needs. The backend Dockerfile used to ALSO rebuild content-packages a third time,
  # from scratch, inside its own build stage; it now just unpacks the zips this script already
  # built on the host moments earlier (see distribution/backend/Dockerfile), so this is down
  # to two Maven builds per pipeline run, not three.
  #
  # The backend image also builds the in-tree liberiaemr OMOD in a stage of its own. The
  # backend-module job below has already built and TESTED that module; the image stage skips
  # tests, so it is a compile, not a second test run.
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build-test
    # Same reason as initializer-clean-db: these images ship the dictionary,
    # so an image built without the token is not the image a release ships.
    env:
      OCL_API_TOKEN: ${{ secrets.OCL_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      # Site is fixed to careysburg to match initializer-clean-db — this is
      # a CI smoke build, not a per-site release artifact. Version is the
      # commit SHA: build-distribution.sh refuses -SNAPSHOT/latest, and a
      # SHA-tagged image (unlike a fixed placeholder) stays unique per run,
      # which matters here since these images could later be inspected or
      # cached across jobs — initializer-clean-db's own throwaway stack
      # doesn't need that and uses a fixed 0.0.0-ci instead.
      - name: Build backend, frontend and gateway images
        run: |
          ./scripts/build/build-distribution.sh \
            --version ${{ github.sha }} --site careysburg

      # LE-339: central's backend loads every site package's locations/ and nothing else of
      # theirs. Built here so a broken central backend fails the PR, not the main-only
      # publish-central-latest after merge. build-distribution.sh runs
      # scripts/validate/central-backend-content.sh on the image it builds. The frontend is
      # skipped: publish-central-latest builds it on main, and its config order is checked in
      # build-test.
      - name: Build the central backend and check its content
        run: |
          ./scripts/build/build-distribution.sh \
            --version ${{ github.sha }} --site central --no-frontend

      # Trivy scans the images already built above — no separate job, no
      # artifact transfer, since the images only exist on this runner's
      # local Docker daemon (build-distribution.sh uses plain `docker
      # build`, not buildx, so there's nothing pushed to pull from
      # elsewhere). exit-code: '0' means this reports findings without
      # failing the job — a first rollout of a new base-image scan would
      # almost certainly turn up existing CVEs in openmrs/openmrs-core,
      # nginx:1.27-alpine etc. that haven't been triaged yet. Tighten to
      # exit-code: '1' (with a --severity filter) once there's been a
      # chance to review what it actually finds.
      - name: Trivy scan — backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/liberia-emr-backend:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          trivyignores: .trivyignore.yaml
          exit-code: '0'
      - name: Trivy scan — frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/liberia-emr-frontend:${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          exit-code: '0'
      - name: Trivy scan — gateway
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/liberia-emr-gateway:${{ github.sha }}
          format: sarif
          output: trivy-gateway.sarif
          exit-code: '0'
      # The one third-party binary on the sync path (LE-372): upstream wstunnel, rebuilt as ours.
      - name: Trivy scan — sync tunnel
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/liberia-emr-sync-tunnel:${{ github.sha }}
          format: sarif
          output: trivy-sync-tunnel.sarif
          exit-code: '0'

      # Uploaded as three separate calls, each with its own category —
      # GitHub Code Scanning rejects multiple SARIF runs sharing a category
      # in one upload (as of the 2025-07-21 change), and Trivy doesn't
      # differentiate categories on its own, so uploading all three files
      # via sarif_file: . collided. Needs security-events: write, already
      # granted at the workflow level.
      #
      # continue-on-error because the upload depends on a repository SETTING this workflow
      # cannot assert: with Code Security disabled, upload-sarif fails with "Code Security
      # must be enabled for this repository to use code scanning" and took the whole job,
      # and therefore the CI gate, down with it. That was blocking every open PR on a
      # configuration change rather than a code defect.
      #
      # What this does and does not trade away: the three scans above still RUN, and still
      # fail the job if Trivy itself errors — only the publishing of results to the Security
      # tab is made non-fatal. The cost is that a genuine upload regression now shows up as
      # a red step inside a green job rather than a failed run, so findings can stop
      # reaching the Security tab without anyone being paged. Re-enable Code Security on the
      # repository and these steps go green on their own; drop continue-on-error then, so
      # the upload is load-bearing again.
      - name: Upload Trivy results — backend
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend
      - name: Upload Trivy results — frontend
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend
      - name: Upload Trivy results — gateway
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-gateway.sarif
          category: trivy-gateway
      - name: Upload Trivy results — sync tunnel
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-sync-tunnel.sarif
          category: trivy-sync-tunnel

  # Sync broker hardening (sync-eip.md sections 7.2 and 7.3): every permission and
  # certificate control is proven by a refusal, over OpenWire, the protocol both sync
  # apps use. Runs only when something that can move those controls changed.
  sync-hardening:
    name: Sync broker hardening
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.sync == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Build the broker, sync sender and expiry exporter images
        run: |
          set -euo pipefail
          dbsync_version="$(grep -E '^sync\.dbsync=' distribution/distro.properties | cut -d= -f2)"
          docker build -f distribution/broker/Dockerfile -t lemr-broker:ci distribution/broker
          docker build -f distribution/sync/Dockerfile --target sender \
            --build-arg "DBSYNC_VERSION=${dbsync_version}" -t lemr-sync:ci distribution/sync
          docker build -f distribution/monitoring/cert-expiry/Dockerfile \
            -t lemr-cert-expiry:ci distribution/monitoring/cert-expiry
          docker build -f distribution/monitoring/sync-capture/Dockerfile \
            -t lemr-sync-capture:ci distribution/monitoring/sync-capture
          docker build -f distribution/gateway/Dockerfile -t lemr-gateway:ci distribution/gateway
          docker build -f distribution/sync-tunnel/Dockerfile -t lemr-sync-tunnel:ci distribution/sync-tunnel
      - name: Compose keeps the sync security wiring
        run: qa/sync/verify-compose-wiring.sh
      # The binlog Debezium reads is kept for up to 99 days; a CREATE USER logged there is a
      # clear-text password on disk for that long (LE-361).
      - name: Facility first boot writes no password to the binlog
        run: qa/sync/verify-binlog-secrets.sh
      - name: Broker refusal suite
        run: |
          qa/sync/verify-hardening.sh --broker-image lemr-broker:ci --sender-image lemr-sync:ci \
            --exporter-image lemr-cert-expiry:ci
      # Sync over HTTPS on 443 (LE-372, ADR 0014): through the gateway path, with every
      # certificate control still held by the broker, and through a forward proxy.
      - name: Sync over HTTPS through the gateway
        run: |
          qa/sync/verify-broker-path.sh --gateway-image lemr-gateway:ci --broker-image lemr-broker:ci \
            --sender-image lemr-sync:ci --stub-image lemr-sync-capture:ci --tunnel-image lemr-sync-tunnel:ci
      - name: Sender refuses a weaker configuration
        run: |
          set -euo pipefail
          env_args=(-e DBSYNC_SENDER_ID=careysburg -e OPENMRS_DB_HOST=db -e OPENMRS_DB_PORT=3306
            -e OPENMRS_DB_NAME=openmrs -e OPENMRS_DB_USER=u -e OPENMRS_DB_PASSWORD=p
            -e MGMT_DB_NAME=m -e MGMT_DB_USER=u -e MGMT_DB_PASSWORD=p -e DEBEZIUM_SERVER_ID=20001
            -e DEBEZIUM_DB_USER=u -e DEBEZIUM_DB_PASSWORD=p -e OPENMRS_BASE_URL=http://backend
            -e OPENMRS_REST_USER=u -e OPENMRS_REST_PASSWORD=p)
          refuses() { # expected-message docker-args...
            local want="$1"; shift
            local out
            out="$(docker run --rm "${env_args[@]}" "$@" lemr-sync:ci 2>&1 || true)"
            grep -q "$want" <<<"$out" || { echo "expected '$want', got: $out"; exit 1; }
            echo "refused as expected: $want"
          }
          refuses 'plain tcp is not accepted' -e ARTEMIS_URL=tcp://central:61616
          refuses 'without options' -e 'ARTEMIS_URL=ssl://central:61617?socket.verifyHostName=false'
          refuses 'sync-certs is missing or cannot be entered' -e ARTEMIS_URL=ssl://central:61617
          refuses "this facility's own address" -e ARTEMIS_URL=ssl://central:61617 \
            -e SYNC_OUTPUT_ENDPOINT=activemq:topic:openmrs.sync.topic
          refuses 'must be true for the broker' -e ARTEMIS_URL=ssl://central:61617 -e SYNC_PAYLOAD_ENCRYPTION=false
          refuses 'SYNC_SNAPSHOT_MODE must be initial or schema_only' -e ARTEMIS_URL=ssl://central:61617 \
            -e SYNC_SNAPSHOT_MODE=never
      - name: Sender template declares what syncs and how it first loads
        run: |
          template=distribution/sync/application.properties.template
          # A facility's first start sends its existing records without locking out the clinic.
          grep -qx 'debezium.snapshotMode=${SYNC_SNAPSHOT_MODE}' "$template" \
            && grep -qx 'debezium.snapshotLockingMode=minimal' "$template" \
            || { echo "sender template lost its initial load settings"; exit 1; }
          # The set is declared in the template, not inherited from the jar, and must stay
          # exactly this (sync-entity-coverage.md §1.1). Order is free.
          expected="ALLERGY CONDITIONS DIAGNOSIS_ATTRIBUTE DRUG_ORDER ENCOUNTER ENCOUNTER_DIAGNOSIS ENCOUNTER_PROVIDER OBS
            ORDERS ORDER_ATTRIBUTE ORDER_GROUP ORDER_GROUP_ATTRIBUTE PATIENT PATIENT_IDENTIFIER PATIENT_PROGRAM
            PATIENT_PROGRAM_ATTRIBUTE PATIENT_STATE PERSON PERSON_ADDRESS PERSON_ATTRIBUTE PERSON_NAME PROVIDER
            REFERRAL_ORDER RELATIONSHIP TEST_ORDER USERS VISIT VISIT_ATTRIBUTE"
          declared="$(sed -n 's/^eip\.watchedTables=//p' "$template" | tr ',' '\n' | sort | paste -sd' ' -)"
          [ "$declared" = "$(tr -s ' \n' '\n\n' <<<"$expected" | sed '/^$/d' | sort | paste -sd' ' -)" ] \
            || { echo "sender template watches: ${declared:-nothing}"; echo "expected: $expected" | tr -s ' \n' ' '; echo; exit 1; }
      - name: Receiver refuses a weaker configuration
        run: |
          set -euo pipefail
          V="$(grep -E '^sync\.dbsync=' distribution/distro.properties | cut -d= -f2)"
          docker build -q -f distribution/sync/Dockerfile --target receiver \
            --build-arg "DBSYNC_VERSION=${V}" -t lemr-sync-receiver:ci distribution/sync >/dev/null
          env_args=(-e OPENMRS_DB_HOST=db -e OPENMRS_DB_PORT=3306 -e OPENMRS_DB_NAME=openmrs
            -e OPENMRS_DB_USER=u -e OPENMRS_DB_PASSWORD=p -e MGMT_DB_NAME=m -e MGMT_DB_USER=u
            -e MGMT_DB_PASSWORD=p -e OPENMRS_BASE_URL=http://backend -e OPENMRS_REST_USER=u
            -e OPENMRS_REST_PASSWORD=p)
          refuses() {
            local want="$1"; shift
            local out
            out="$(docker run --rm "${env_args[@]}" "$@" lemr-sync-receiver:ci 2>&1 || true)"
            grep -q "$want" <<<"$out" || { echo "expected '$want', got: $out"; exit 1; }
            echo "refused as expected: $want"
          }
          refuses 'plain tcp is not accepted' -e ARTEMIS_URL=tcp://artemis:61616
          refuses 'sync-certs is missing or cannot be entered' -e ARTEMIS_URL=ssl://artemis:61617
          refuses 'cannot be turned off at central' -e ARTEMIS_URL=ssl://artemis:61617 -e SYNC_PAYLOAD_ENCRYPTION=false
          # The window decides when the receiver stops itself to apply conflict decisions.
          refuses 'SYNC_CONFLICT_WINDOW must be HH:MM-HH:MM' -e ARTEMIS_URL=ssl://artemis:61617 \
            -e SYNC_CONFLICT_WINDOW=nightly
          refuses 'SYNC_CONFLICT_CHECK_SECONDS must be a number' -e ARTEMIS_URL=ssl://artemis:61617 \
            -e SYNC_CONFLICT_CHECK_SECONDS=soon
          # The receiver's protections live in its configuration template; none may be dropped.
          template=distribution/sync/receiver-application.properties.template
          for setting in '^camel\.input\.endpoint=.*[?&]acknowledgementMode=4(&|$)' \
                         '^camel\.input\.endpoint=.*[?&]disableReplyTo=true(&|$)' \
                         '^openmrs\.eip\.dbsync\.encryption\.enabled=true$' \
                         '^logging\.level\.receiver-retry=WARN$' \
                         '^logging\.level\.org\.openmrs\.eip\.dbsync\.receiver\.ComplexObsProcessor=WARN$'; do
            grep -Eq "$setting" "$template" || { echo "receiver template lost: $setting"; exit 1; }
          done
      - name: Alerts are delivered by email and webhook
        run: qa/sync/verify-alert-delivery.sh
      - name: Central alert rules behave (promtool unit tests)
        run: |
          docker run --rm -v "$PWD/distribution/monitoring:/m:ro" --entrypoint promtool \
            prom/prometheus:v2.53.4 test rules /m/tests/rules-central-test.yml
      - name: Facility alert rules behave (promtool unit tests)
        run: |
          docker run --rm -v "$PWD/distribution/monitoring:/m:ro" --entrypoint promtool \
            prom/prometheus:v2.53.4 test rules /m/tests/rules-facility-test.yml
      - name: Capture exporter tells a stalled sender from a quiet one
        run: |
          docker run --rm -v "$PWD/distribution/monitoring:/m:ro" --entrypoint sh \
            lemr-sync-capture:ci /m/tests/sync-capture-test.sh /usr/local/bin/sync-capture.sh
      - name: Expiry exporter reads issued material
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          scripts/security/gen-sync-certs.sh --out "$out" --facilities careysburg >/dev/null
          chmod -R a+rX "$out"
          metrics="$(docker run --rm -v "$out/broker/public:/public:ro" lemr-cert-expiry:ci --once)"
          echo "$metrics"
          grep -q 'sync_cert_not_after_seconds{identity="careysburg",kind="facility"}' <<<"$metrics"
          grep -q '^sync_crl_next_update_seconds ' <<<"$metrics"

  # ---------------------------------------------------------------------
  # Stage 5 — end to end
  # ---------------------------------------------------------------------
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # The job builds its own throwaway --demo images and boots them itself, but
    # waits for the shared validation/build jobs so failures stop the expensive
    # stack setup before it starts.
    needs: [changes, build-test]
    if: always() && needs.build-test.result == 'success'
    env:
      REGISTRY: intellisoftdev
      LIBERIAEMR_VERSION: 0.0.0-ci
    steps:
      - uses: actions/checkout@v4
      # Needed to build the demo images below (build-distribution.sh runs `mvn package` to
      # resolve content-packages before the Docker build stage) — nothing upstream produced
      # an image this job can reuse instead, see above.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Cypress test dependencies
        working-directory: qa/e2e
        run: npm ci
      # RoleSignIn.cy.ts and AuditLog.cy.ts serve these builds in place of the SPA's own while
      # distro.properties pins builds without the behaviour under test (the home dashboards,
      # LE-397): a change here is published only after merge and pinned in a follow-up PR.
      # Once the pin carries it, the specs use the served builds and these go unused
      # (qa/e2e/cypress/support/local-esm.ts).
      - name: Build the LiberiaEMR apps the specs may overlay
        run: |
          set -euo pipefail
          for app in esm-liberia-audit-log-app esm-liberia-reports-app esm-liberia-sync-status-app; do
            (cd "packages/$app" && yarn install --frozen-lockfile && yarn build)
          done

      # --demo: the priority journeys log in as admin/Admin123, which only content-demo
      # provisions (docs/runbooks/demo-stack.md). --no-frontend is deliberately absent —
      # Cypress drives the real SPA, unlike initializer-clean-db.
      - name: Build the demo images under test
        run: |
          ./scripts/build/build-distribution.sh \
            --version "$LIBERIAEMR_VERSION" --site careysburg --demo

      # Self-signed and thrown away with the stack, same as qa/upgrade/run-clean-install.sh —
      # the gateway will not start at all without fullchain.pem/privkey.pem present.
      - name: Generate a throwaway TLS certificate for the gateway
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-certs"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=liberiaemr-e2e" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout "$RUNNER_TEMP/e2e-certs/privkey.pem" \
            -out    "$RUNNER_TEMP/e2e-certs/fullchain.pem"

      # The MFL sync (ADR 0009) is tested against a stub MFL, never the MOH's: a throwaway CA,
      # the stub's certificate, a truststore for the backend and a random stub password, all
      # under $RUNNER_TEMP and gone with the runner. See qa/api/README.md.
      - name: Generate the MFL stub material
        run: qa/api/mfl-stub/gen-material.sh "$RUNNER_TEMP/mfl-stub"

      # Ephemeral credentials for a database that lives only as long as this job — never a
      # facility secret. Random per run rather than literals, so nothing that looks like a
      # password is committed; they are only ever read back from this env file.
      # cypress.env.json is for local development only and must never drive a CI run
      # (Cypress base URL comes from CYPRESS_BASE_URL below instead).
      - name: Start the disposable demo stack
        run: |
          e2e_db_pw="$(openssl rand -hex 16)"
          e2e_db_root_pw="$(openssl rand -hex 16)"
          e2e_etl_pw="$(openssl rand -hex 16)"
          cat > "$RUNNER_TEMP/e2e.env" <<ENV
          REGISTRY=${REGISTRY}
          LIBERIAEMR_VERSION=${LIBERIAEMR_VERSION}
          FACILITY_CODE=careysburg
          MYSQL_DATABASE=openmrs
          MYSQL_USER=openmrs
          MYSQL_PASSWORD=${e2e_db_pw}
          MYSQL_ROOT_PASSWORD=${e2e_db_root_pw}
          ETL_DB_PASSWORD=${e2e_etl_pw}
          OMRS_CREATE_TABLES=true
          TLS_CERT_DIR=$RUNNER_TEMP/e2e-certs
          CENTRAL_URL=http://localhost
          QA_MFL_DIR=$RUNNER_TEMP/mfl-stub
          QA_MFL_STUB_DIR=$GITHUB_WORKSPACE/qa/api/mfl-stub
          QA_MFL_FIXTURES=$GITHUB_WORKSPACE/integration/dhis2/mfl/fixtures
          ENV
          docker compose \
            -f distribution/compose/facility/docker-compose.yml \
            -f distribution/compose/facility/docker-compose.demo.yml \
            -f qa/api/mfl-stub/docker-compose.mfl-stub.yml \
            --env-file "$RUNNER_TEMP/e2e.env" up -d db backend mfl-stub

      - name: Wait for the backend to become healthy
        run: |
          deadline=$(( SECONDS + 1800 ))
          until docker compose \
                  -f distribution/compose/facility/docker-compose.yml \
                  -f distribution/compose/facility/docker-compose.demo.yml \
                  -f qa/api/mfl-stub/docker-compose.mfl-stub.yml \
                  --env-file "$RUNNER_TEMP/e2e.env" exec -T backend \
                  curl -fs http://localhost:8080/openmrs/health/started >/dev/null 2>&1; do
            if (( SECONDS > deadline )); then
              echo "FAIL: backend did not become healthy within 30 minutes" >&2
              docker compose \
                -f distribution/compose/facility/docker-compose.yml \
                -f distribution/compose/facility/docker-compose.demo.yml \
                -f qa/api/mfl-stub/docker-compose.mfl-stub.yml \
                --env-file "$RUNNER_TEMP/e2e.env" logs --no-color backend > "$RUNNER_TEMP/backend.log" 2>&1
              # The last 200 lines alone can be one repeated stack trace; list every ERROR and
              # Caused-by line from the whole boot first, so the real cause is not scrolled away.
              echo "== ERROR / Caused by lines in the whole backend log ==" >&2
              grep -E "ERROR|SEVERE|Caused by" "$RUNNER_TEMP/backend.log" | cut -c1-400 | head -80 >&2 || true
              echo "== last 200 lines ==" >&2
              tail -n 200 "$RUNNER_TEMP/backend.log" >&2
              exit 1
            fi
            sleep 10
          done

      # LE-367: the reporting ETL gets its database user only when ETL_DB_PASSWORD is set
      # (initdb/20-etl-db-user.sh). Without it every boot logged "Access denied for user
      # 'mambaetl'", and those traces were the only errors a failed run showed.
      - name: The reporting ETL reaches its database
        run: |
          if docker compose \
               -f distribution/compose/facility/docker-compose.yml \
               -f distribution/compose/facility/docker-compose.demo.yml \
               -f qa/api/mfl-stub/docker-compose.mfl-stub.yml \
               --env-file "$RUNNER_TEMP/e2e.env" logs --no-color backend 2>&1 \
             | grep -m1 "Access denied for user 'mambaetl'"; then
            echo "FAIL: the reporting ETL cannot log in to its database (is ETL_DB_PASSWORD set?)" >&2
            exit 1
          fi
          echo "ok: no ETL database login failure in the backend log"

      - name: Start the frontend and the gateway
        run: |
          docker compose \
            -f distribution/compose/facility/docker-compose.yml \
            -f distribution/compose/facility/docker-compose.demo.yml \
            -f qa/api/mfl-stub/docker-compose.mfl-stub.yml \
            --env-file "$RUNNER_TEMP/e2e.env" up -d frontend gateway

      - name: Wait for the gateway to serve the SPA
        run: |
          deadline=$(( SECONDS + 120 ))
          until curl -fsk -o /dev/null https://localhost/openmrs/spa/; do
            if (( SECONDS > deadline )); then
              echo "FAIL: gateway did not serve /openmrs/spa/ within 2 minutes" >&2
              docker compose \
                -f distribution/compose/facility/docker-compose.yml \
                -f distribution/compose/facility/docker-compose.demo.yml \
                -f qa/api/mfl-stub/docker-compose.mfl-stub.yml \
                --env-file "$RUNNER_TEMP/e2e.env" logs --tail 40 gateway >&2
              exit 1
            fi
            sleep 5
          done

      # Before Cypress, on a stack no spec has touched, so the first-sync expectations hold.
      # The script creates test users and locations and restores the facility root it borrows.
      - name: MFL sync API tests
        id: mfl-api
        run: |
          python3 qa/api/mfl/verify-mfl-sync.py \
            --base-url https://localhost \
            --material-dir "$RUNNER_TEMP/mfl-stub" \
            --backend-logs-cmd "docker compose -f distribution/compose/facility/docker-compose.yml -f distribution/compose/facility/docker-compose.demo.yml -f qa/api/mfl-stub/docker-compose.mfl-stub.yml --env-file $RUNNER_TEMP/e2e.env logs --no-color backend"

      # cypress.config.ts refuses any CYPRESS_BASE_URL host other than localhost unless it
      # is explicitly allowlisted — so this can never resolve to
      # liberiaemrfacilitydev.intellisoftkenya.com or any other shared/production host, only
      # to the disposable stack just started. admin/Admin123 is the demo stack's own
      # well-known training account (docs/runbooks/demo-stack.md), not a facility credential.
      # RUN_LIVE_REGISTRATION is deliberately left unset: the normal CI run must not create
      # real patient records, and the gated test stays skipped (qa/e2e/README.md Rules).
      # Runs when the MFL API tests failed too, so one run shows both results.
      - name: Cypress
        if: ${{ !cancelled() && (success() || steps.mfl-api.outcome == 'failure') }}
        working-directory: qa/e2e
        env:
          CYPRESS_BASE_URL: https://localhost
          CYPRESS_USERNAME: admin
          CYPRESS_PASSWORD: Admin123
        run: npm test

      # Last, because it replaces the backend: the same database, recreated WITHOUT the stub
      # overlay and so without MFL credentials. The sync must then report itself unavailable
      # and refuse to run (docs/architecture/mfl-sync-api.md, "Availability").
      - name: MFL sync is unavailable without credentials
        if: ${{ !cancelled() && steps.mfl-api.outcome != 'skipped' }}
        run: |
          plain="docker compose -f distribution/compose/facility/docker-compose.yml -f distribution/compose/facility/docker-compose.demo.yml --env-file $RUNNER_TEMP/e2e.env"
          $plain up -d --no-deps --force-recreate backend
          deadline=$(( SECONDS + 900 ))
          until $plain exec -T backend curl -fs http://localhost:8080/openmrs/health/started >/dev/null 2>&1; do
            if (( SECONDS > deadline )); then
              echo "FAIL: the recreated backend did not become healthy within 15 minutes" >&2
              $plain logs --tail 200 backend >&2
              exit 1
            fi
            sleep 10
          done
          python3 qa/api/mfl/verify-mfl-sync.py --unavailable --base-url https://localhost

      - name: Upload Cypress screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            qa/e2e/cypress/screenshots
            qa/e2e/cypress/videos
          if-no-files-found: ignore

      - name: Tear down the disposable demo stack
        if: always()
        run: |
          docker compose \
            -f distribution/compose/facility/docker-compose.yml \
            -f distribution/compose/facility/docker-compose.demo.yml \
            -f qa/api/mfl-stub/docker-compose.mfl-stub.yml \
            --env-file "$RUNNER_TEMP/e2e.env" down -v || true
          rm -rf "$RUNNER_TEMP/e2e-certs" "$RUNNER_TEMP/e2e.env" "$RUNNER_TEMP/mfl-stub"

  # ---------------------------------------------------------------------
  # Frontend module build — independent of the Maven reactor, runs in
  # parallel with everything above.
  # ---------------------------------------------------------------------
  frontend:
    name: Custom Build ESMs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify login app
        working-directory: packages/esm-liberia-login-app
        run: |
          yarn install --frozen-lockfile
          yarn test
          yarn build
      - name: Verify e-partograph
        working-directory: packages/esm-liberia-epartograph-app
        run: 'echo "TODO: yarn install --no-frozen-lockfile && yarn verify once the module is implemented"'
      - name: Verify sync status page
        working-directory: packages/esm-liberia-sync-status-app
        run: |
          yarn install --frozen-lockfile
          yarn typescript
          yarn test
          yarn build
      - name: Verify indicator reports app
        working-directory: packages/esm-liberia-reports-app
        run: |
          yarn install --frozen-lockfile
          yarn typescript
          yarn test
          yarn build
      - name: Verify audit log app
        working-directory: packages/esm-liberia-audit-log-app
        run: |
          yarn install --frozen-lockfile
          yarn lint
          yarn typescript
          yarn test
          yarn build

  backend-module:
    name: Build LiberiaEMR Module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Build and Package
        working-directory: modules/liberiaemr
        run: mvn -B clean package
      # The reporting ETL module (ADR 0010). Its package compiles the ETL SQL with core's
      # compile.sh (bash, jq and rsync, all on the runner) and fails on an unresolved ${var.*},
      # a SET GLOBAL or a DELIMITER; DeployScriptTest then checks the script it ships.
      - name: Build and test the reporting ETL module
        working-directory: modules/mambaetl
        run: mvn -B clean package

  # ---------------------------------------------------------------------
  # Soft gate — the single required status check for branch protection.
  #
  # Everything above runs in parallel where possible (initializer-clean-db
  # and docker-build no longer wait on sbom/dependency-check to finish, so
  # a slow scan doesn't add latency to the smoke test or image build). This
  # job is where that's clawed back: it needs every job whose failure
  # should block a merge, and fails if any of them failed, was cancelled,
  # or was skipped. Point branch protection at this one job instead of
  # every job above — new jobs added later only need `gate` updated once.
  #
  # Jobs that may legitimately be skipped: initializer-clean-db and
  # upgrade-from-main, which the `changes` job stands down on a commit that
  # cannot affect metadata (and sync-hardening, on its own path list). They are
  # named explicitly rather than allowing "skipped" across the board — a skip
  # anywhere else means a dependency failed, and that must still block the
  # merge. `changes` is in this list too, so a fault in the detection itself
  # fails the gate rather than quietly excusing the jobs it was meant to
  # schedule.
  # ---------------------------------------------------------------------
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    # This job is the required status check for main (repository ruleset "Prevent direct
    # push to Main"), which is why the push trigger at the top of this file is restricted
    # to main: a required context must be produced by exactly ONE run per commit. When both
    # a push and a pull_request run existed for the same commit, the one the concurrency
    # group cancelled still published a second check run named "CI gate" — cancelled, not
    # skipped — and a required context blocks the merge unless every check run carrying it
    # passes. A job-level if: does NOT fix that: a cancelled run publishes a check run for
    # every job in its plan, whether or not the condition would have skipped it.
    #
    # always(), so a dependency that failed still reaches the assertion below instead of
    # skipping it and reporting success by omission.
    if: always()
    needs:
      - changes
      - validate
      - build-test
      - sbom
      - dependency-check
      - initializer-clean-db
      - upgrade-from-main
      - docker-build
      - sync-hardening
      - e2e
      - frontend
      - backend-module
    steps:
      - name: Require all jobs to have succeeded
        env:
          # One definition of "acceptable", used by both the assertion and
          # the report below, so the two can never drift apart.
          JQ_OK: |
            def acceptable:
              .key as $k
              | .value.result == "success"
                or (.value.result == "skipped"
                    and ($k == "initializer-clean-db" or $k == "upgrade-from-main"
                         or $k == "sync-hardening"));
        run: |
          echo '${{ toJSON(needs) }}' | jq -e "$JQ_OK"'
            to_entries | all(acceptable)
          ' || {
            echo "One or more required jobs did not succeed:"
            echo '${{ toJSON(needs) }}' | jq -r "$JQ_OK"'
              to_entries[] | select(acceptable | not) | "  \(.key): \(.value.result)"
            '
            exit 1
          }

  # ---------------------------------------------------------------------
  # Merge-to-main only, from here down — see the numbered convention:
  #   1. PR: validate, build, security checks, tests           (everything above)
  #   2. PR merged: 1, plus publish :latest images and update dev
  #   3. Release: separate pipeline, see release.yml
  #
  # Both jobs below are gated on `needs: gate` AND their own `if:` which
  # checks the upstream job's result directly. The `if:` is the active
  # enforcement mechanism — a skipped or failed upstream causes
  # needs.<job>.result to be 'skipped'/'failure', which fails the check
  # and skips the downstream job. Do not simplify away the result check;
  # implicit success() would wrongly block on skipped parents.
  # ---------------------------------------------------------------------

  publish-latest:
    name: Publish :latest images
    runs-on: ubuntu-latest
    needs: gate
    if: >
      !cancelled() &&
      needs.gate.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    # These images are published and deployed to dev. Building them without
    # the dictionary would push a distribution whose concepts do not resolve,
    # so this is the one place the token's absence matters most — and, because
    # build-distribution.sh only warns, the one place it would be quietest.
    env:
      OCL_API_TOKEN: ${{ secrets.OCL_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - uses: docker/login-action@v3
        with:
          # REGISTRY is "intellisoftdev" (a Docker Hub org, not GHCR), so
          # this is a plain Docker Hub login, not docker/login-action's
          # ghcr.io default. DOCKERHUB_USERNAME / DOCKERHUB_TOKEN need
          # creating as repo secrets — DOCKERHUB_TOKEN should be a Docker
          # Hub access token, not your account password.
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # build-distribution.sh explicitly refuses --version latest (it's in
      # the same guard as -SNAPSHOT), so this builds under the commit SHA
      # like docker-build does, then re-tags as :latest afterward. Both
      # tags get pushed — :latest for the dev deploy below, :<sha> so a
      # specific merge's image stays inspectable/rollback-able later.
      - name: Build images
        run: |
          ./scripts/build/build-distribution.sh \
            --version ${{ github.sha }} --site careysburg

      # The backend and frontend, and every site-agnostic image the stacks pull: the gateway and
      # the sync sender, receiver, broker and exporters (scripts/build/image-refs.sh). Without
      # the sync images a dev server started with the sync profile has nothing to pull.
      - name: Tag and push :latest alongside :${{ github.sha }}
        run: |
          for name in liberia-emr-backend liberia-emr-frontend $(scripts/build/image-refs.sh --role shared); do
            image="${REGISTRY}/${name}"
            docker tag "${image}:${{ github.sha }}" "${image}:latest"
            docker push "${image}:${{ github.sha }}"
            docker push "${image}:latest"
          done


  # LE-368: central's images, for deploy-central-dev. Its own job, so a failed central build
  # never stops publish-latest and the dev deploy. A central build makes
  # liberia-emr-backend-central (every site's locations, LE-339) and
  # liberia-emr-frontend-central; central runs the gateway publish-latest pushes (ADR 0011).
  publish-central-latest:
    name: Publish :latest central images
    runs-on: ubuntu-latest
    needs: gate
    if: >
      !cancelled() &&
      needs.gate.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    env:
      OCL_API_TOKEN: ${{ secrets.OCL_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build the central backend and frontend
        run: |
          ./scripts/build/build-distribution.sh \
            --version ${{ github.sha }} --site central
      - name: Tag and push :latest alongside :${{ github.sha }}
        run: |
          for service in backend frontend; do
            image="${REGISTRY}/liberia-emr-${service}-central"
            docker tag "${image}:${{ github.sha }}" "${image}:latest"
            docker push "${image}:${{ github.sha }}"
            docker push "${image}:latest"
          done

  deploy-dev:
    name: Update dev environment
    runs-on: ubuntu-latest
    needs: publish-latest
    if: >
      !cancelled() &&
      needs.publish-latest.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    outputs:
      backend_digest: ${{ steps.previous-version.outputs.backend_digest }}
      frontend_digest: ${{ steps.previous-version.outputs.frontend_digest }}
      gateway_digest: ${{ steps.previous-version.outputs.gateway_digest }}
    steps:
      # Deploy secrets needed (none of these exist yet — create them under
      # Settings > Secrets and variables > Actions):
      #   DEV_SSH_PRIVATE_KEY  the PRIVATE half of a keypair generated for
      #                        CI deploys specifically (not a personal key).
      #                        The PUBLIC half goes into
      #                        ~/.ssh/authorized_keys for DEV_USER on
      #                        DEV_HOST — the private key here is what lets
      #                        the runner authenticate as that trusted key.
      #   DEV_HOST             the dev server's hostname or IP.
      #   DEV_USER             the SSH user (e.g. mnyagah).
      #   DEV_COMPOSE_DIR      absolute path on the server to the directory
      #                        containing docker-compose.yml and
      #                        facility.env (where `docker compose pull`
      #                        was run manually before).
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}

      - name: Trust the dev host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEV_HOST }}" >> ~/.ssh/known_hosts

      # Captures the exact digest (immutable content hash) of each of the
      # THREE running images independently — not just backend's, and not
      # a tag or a label we invented. A tag (even a "unique" one like
      # :<sha>) is a mutable pointer; nothing guarantees it can't later
      # point at different bytes (a re-run of the same commit, a manual
      # overwrite). The digest is what the registry actually hashed the
      # content to — it can't drift. Runs before the risky pull+restart
      # below so it's still captured even if that step fails outright.
      - name: Capture currently-running image digests
        id: previous-version
        run: |
          output=$(ssh "${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }}" '
            for service in backend frontend gateway; do
              # A container has no RepoDigests; its image does. Ask the container for its image
              # ID, then that image for the registry digest a rollback can pull.
              image=$(docker inspect --format="{{.Image}}" "liberiaemr-facility-${service}-1" 2>/dev/null || true)
              digest=$(docker image inspect --format="{{index .RepoDigests 0}}" "$image" 2>/dev/null || true)
              [ -n "$digest" ] || digest=unknown
              echo "${service}: ${digest}"
            done
          ')
          echo "$output"
          echo "backend_digest=$(echo "$output" | awk -F': ' '/^backend:/{print $2}')" >> "$GITHUB_OUTPUT"
          echo "frontend_digest=$(echo "$output" | awk -F': ' '/^frontend:/{print $2}')" >> "$GITHUB_OUTPUT"
          echo "gateway_digest=$(echo "$output" | awk -F': ' '/^gateway:/{print $2}')" >> "$GITHUB_OUTPUT"

      # The compose file on the server has to match the images being deployed, as for central
      # dev: a checkout left behind keeps old service definitions (a facility server ran without
      # the binary log sync reads for weeks this way). Fast-forward only; a checkout with local
      # changes is left as it is, with a warning, and the images still deploy. The "Enable sync
      # on dev" workflow keeps such a change in a stash and brings the checkout up to date.
      - name: Bring the server's checkout to this commit
        run: |
          ssh "${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }}" '
            set -e
            cd "${{ secrets.DEV_COMPOSE_DIR }}"
            top=$(git rev-parse --show-toplevel)
            if [ -n "$(git -C "$top" status --porcelain --untracked-files=no)" ]; then
              echo "::warning::the checkout at $top has local changes, so it stays where it is; run Enable sync on dev, or commit or discard them:"
              git -C "$top" status --short
              exit 0
            fi
            git -C "$top" fetch -q origin main
            if git -C "$top" merge-base --is-ancestor ${{ github.sha }} HEAD; then
              echo "checkout already at or past ${{ github.sha }}"
            else
              git -C "$top" merge -q --ff-only ${{ github.sha }}
              echo "checkout now at $(git -C "$top" rev-parse --short HEAD)"
            fi
          '

      # Overrides LIBERIAEMR_VERSION inline rather than editing the
      # server's persistent facility.env, so this doesn't silently change
      # what a manual `docker compose up` would use later. Confirmed
      # against the real facility.env: LIBERIAEMR_VERSION is exactly the
      # variable that selects the image tag.
      #
      # LEGACY_ADMIN_UI=true is set the same way, and ONLY here. It unblocks
      # /openmrs/admin/ at the gateway and sets module.allow_web_admin on the
      # backend, so dev can reach Manage Modules and the legacy scheduler,
      # which have no O3 equivalent yet. It is safe to hard-code because this
      # job is dev-only (DEV_HOST, main pushes); a facility or central deploy
      # runs from docs/runbooks/deploy.md and never sets it, and both the
      # compose default and the gateway image default are false. Do NOT copy
      # this line into a production deploy path — MOH ICT SOP control D5,
      # docs/security/moh-ict-sop-mapping.md.
      - name: Pull and restart on the dev server
        run: |
          ssh "${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }}" '
            set -e
            cd "${{ secrets.DEV_COMPOSE_DIR }}"
            LIBERIAEMR_VERSION=latest LEGACY_ADMIN_UI=true docker compose --env-file facility.env pull
            LIBERIAEMR_VERSION=latest LEGACY_ADMIN_UI=true docker compose --env-file facility.env up -d
            # Monitoring mounts its config and rules one file at a time, so a running container
            # keeps the old files and up -d does not notice. Recreate it where the sync profile runs it.
            if LIBERIAEMR_VERSION=latest docker compose --env-file facility.env ps --services --status running | grep -qx prometheus; then
              LIBERIAEMR_VERSION=latest LEGACY_ADMIN_UI=true docker compose --env-file facility.env up -d --no-deps --force-recreate prometheus alertmanager
            fi
          '

  # ---------------------------------------------------------------------
  # Smoke test — the cheapest possible confirmation that the just-deployed
  # dev instance actually came up, before spending time on a DAST scan
  # against something that might just be crash-looping. Deliberately
  # unauthenticated: an authenticated check (e.g. the REST session
  # endpoint) would need real dev admin credentials as a new secret, and
  # I didn't want to invent a credential rather than ask for one. Happy to
  # add an authenticated check once there's a secret for it.
  #
  # Confirmed reachable: https://liberiaemrfacilitydev.intellisoftkenya.com
  # /openmrs/spa/ (with trailing slash) returns a real 200 with the actual
  # app shell, self-signed cert (hence -k). Note: /openmrs/spa WITHOUT the
  # trailing slash 301-redirects — this check deliberately does NOT follow
  # redirects (no -L), so an unexpected redirect fails loudly rather than
  # silently passing through.
  #
  # Timing: up to 20 attempts, 15s apart = up to 300s (5 min) total
  # before giving up and failing the job. Widened from an initial 150s —
  # OpenMRS-based backends commonly take well over a minute to become
  # healthy even on a routine restart (32 OMODs + Spring context init),
  # and a false-positive failure here doesn't just fail a job quietly —
  # it triggers rollback-dev, which undoes a perfectly good deploy. Better
  # to wait longer on a genuinely slow-but-fine boot than roll back one
  # that just needed more time.
  # ---------------------------------------------------------------------
  smoke-test:
    name: Smoke test (dev)
    runs-on: ubuntu-latest
    needs: deploy-dev
    # Records a GitHub deployment to "dev" that succeeds only when the new version
    # is up AND healthy. The GitHub for Jira app reads it as a Development deploy,
    # and Jira rule R3 moves the linked LE issues to Ready for Testing
    # (docs/runbooks/jira-automation.md). Deliberately not on deploy-dev: a deploy
    # that smoke-test then rolls back must never reach QA.
    environment: dev
    if: >
      !cancelled() &&
      needs.deploy-dev.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    steps:
      - name: Wait for the SPA to respond
        run: |
          url="https://${{ secrets.DEV_HOST }}/openmrs/spa/"
          for i in $(seq 1 20); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "$url" || echo 000)
            [ "$code" = "200" ] && { echo "ok: $url -> 200"; exit 0; }
            echo "attempt $i: got $code, retrying in 15s..."
            sleep 15
          done
          echo "::error::$url never returned 200 after restart" >&2
          exit 1

  # ---------------------------------------------------------------------
  # Rollback — fires only when deploy-dev itself succeeded (containers
  # actually restarted) but smoke-test then caught that the new version
  # isn't healthy. Deliberately does NOT fire if deploy-dev itself failed
  # (e.g. the SSH command errored outright) — in that case we don't
  # actually know what state the server is in, and blindly redeploying
  # "the previous version" on top of an unknown, possibly-still-old state
  # could make things worse rather than better. That failure mode needs a
  # human to look at the server directly.
  # ---------------------------------------------------------------------
  rollback-dev:
    name: Roll back dev environment
    runs-on: ubuntu-latest
    needs: [deploy-dev, smoke-test]
    if: >
      always() &&
      needs.deploy-dev.result == 'success' &&
      needs.smoke-test.result == 'failure' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}

      - name: Trust the dev host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEV_HOST }}" >> ~/.ssh/known_hosts

      # Pulls each image by its exact digest (not a tag), re-tags it
      # locally on the server as :latest, then restarts WITHOUT calling
      # `docker compose pull` — pulling again here would just re-fetch the
      # broken :latest from the registry and undo the retag. Compose picks
      # up whatever :latest already resolves to in the local Docker daemon,
      # which is now the known-good digest we just pulled.
      - name: Roll back to the previously-running images
        run: |
          backend="${{ needs.deploy-dev.outputs.backend_digest }}"
          frontend="${{ needs.deploy-dev.outputs.frontend_digest }}"
          gateway="${{ needs.deploy-dev.outputs.gateway_digest }}"
          for pair in "backend:$backend" "frontend:$frontend" "gateway:$gateway"; do
            svc="${pair%%:*}"; digest="${pair#*:}"
            if [ -z "$digest" ] || [ "$digest" = "unknown" ]; then
              echo "::error::No previous digest captured for ${svc} — cannot roll back automatically. Manual intervention required on the dev server."
              exit 1
            fi
          done
          # LEGACY_ADMIN_UI=true is repeated in the restart below for the same
          # reason LIBERIAEMR_VERSION is: it lives in the deploy command, not in
          # the server's facility.env, so a rollback that omitted it would leave
          # dev with the admin UI blocked and look like an unrelated regression.
          echo "rolling back to:"
          echo "  backend:  $backend"
          echo "  frontend: $frontend"
          echo "  gateway:  $gateway"
          ssh "${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }}" "
            set -e
            docker pull '$backend'
            docker pull '$frontend'
            docker pull '$gateway'
            docker tag '$backend'  '${{ env.REGISTRY }}/liberia-emr-backend:latest'
            docker tag '$frontend' '${{ env.REGISTRY }}/liberia-emr-frontend:latest'
            docker tag '$gateway'  '${{ env.REGISTRY }}/liberia-emr-gateway:latest'
            cd '${{ secrets.DEV_COMPOSE_DIR }}'
            LIBERIAEMR_VERSION=latest LEGACY_ADMIN_UI=true docker compose --env-file facility.env up -d
          "

      - name: Verify the rollback came back up
        run: |
          url="https://${{ secrets.DEV_HOST }}/openmrs/spa/"
          for i in $(seq 1 20); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "$url" || echo 000)
            [ "$code" = "200" ] && { echo "ok: rollback restored service ($url -> 200)"; exit 0; }
            echo "attempt $i: got $code, retrying in 15s..."
            sleep 15
          done
          echo "::error::Rollback itself did not bring the SPA back up — this needs a human now." >&2
          exit 1

  # ---------------------------------------------------------------------
  # Central dev (LE-368): https://liberiaemrcentraldev.intellisoftkenya.com, a separate
  # server running the CENTRAL composition (distribution/compose/central, ADR 0011). Same
  # shape as deploy-dev / smoke-test / rollback-dev, with three differences:
  #   - it updates only backend and frontend (the -central images, LE-339), gateway and the sync
  #     receiver, with --no-deps; the broker stays at whatever the server runs. It then recreates
  #     prometheus and alertmanager, which mount their config and rules from the checkout one file
  #     at a time: a running container keeps the file it started with, so without that a rule
  #     change never reached central dev (LE-373);
  #   - it refuses to deploy unless the server runs the liberiaemr-central compose project,
  #     so CI never starts a second stack beside a facility one;
  #   - it skips cleanly until its secrets exist. Create, under Settings > Secrets and
  #     variables > Actions: CENTRAL_DEV_SSH_PRIVATE_KEY (a CI-only deploy key),
  #     CENTRAL_DEV_HOST (liberiaemrcentraldev.intellisoftkenya.com), CENTRAL_DEV_USER,
  #     CENTRAL_DEV_COMPOSE_DIR (distribution/compose/central inside a git checkout of this
  #     repo, owned by CENTRAL_DEV_USER), and optionally CENTRAL_DEV_ENV_FILE (relative to
  #     that directory; default ../../env/central.env, where ansible/central-server.yaml and
  #     docs/runbooks/deploy.md put it).
  # LEGACY_ADMIN_UI=true is passed on the deploy command, as deploy-dev does and for the
  # same reason (LE-376): central dev needs Manage Modules and the legacy scheduler. It is
  # never written to central.env, so it cannot travel into a production central server.
  # ---------------------------------------------------------------------
  deploy-central-dev:
    name: Update central dev environment
    runs-on: ubuntu-latest
    needs: [publish-latest, publish-central-latest]
    if: >
      !cancelled() &&
      needs.publish-latest.result == 'success' &&
      needs.publish-central-latest.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    env:
      CENTRAL_DEV_HOST: ${{ secrets.CENTRAL_DEV_HOST }}
      CENTRAL_DEV_USER: ${{ secrets.CENTRAL_DEV_USER }}
      CENTRAL_DEV_COMPOSE_DIR: ${{ secrets.CENTRAL_DEV_COMPOSE_DIR }}
      CENTRAL_DEV_ENV_FILE: ${{ secrets.CENTRAL_DEV_ENV_FILE }}
      HAS_KEY: ${{ secrets.CENTRAL_DEV_SSH_PRIVATE_KEY != '' }}
    outputs:
      configured: ${{ steps.configured.outputs.configured }}
      backend_digest: ${{ steps.previous-version.outputs.backend_digest }}
      frontend_digest: ${{ steps.previous-version.outputs.frontend_digest }}
      gateway_digest: ${{ steps.previous-version.outputs.gateway_digest }}
      receiver_digest: ${{ steps.previous-version.outputs.receiver_digest }}
      checkout_sha: ${{ steps.previous-checkout.outputs.checkout_sha }}
    steps:
      - name: Check the central dev secrets exist
        id: configured
        run: |
          if [ -z "$CENTRAL_DEV_HOST" ] || [ -z "$CENTRAL_DEV_USER" ] || [ -z "$CENTRAL_DEV_COMPOSE_DIR" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::notice::Central dev deploy skipped: set the CENTRAL_DEV_* secrets to enable it (LE-368)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up SSH agent
        if: steps.configured.outputs.configured == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CENTRAL_DEV_SSH_PRIVATE_KEY }}
      - name: Trust the central dev host key
        if: steps.configured.outputs.configured == 'true'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$CENTRAL_DEV_HOST" >> ~/.ssh/known_hosts
      # Refuses a server that is not running the central project: pulling and starting it
      # there would put a second stack beside whatever runs, fighting it for ports. Then
      # records the running digests, as deploy-dev does, for a rollback.
      - name: Check the server runs central, and capture the running image digests
        if: steps.configured.outputs.configured == 'true'
        id: previous-version
        run: |
          output=$(ssh "$CENTRAL_DEV_USER@$CENTRAL_DEV_HOST" '
            if ! docker ps --format "{{.Names}}" | grep -qx "liberiaemr-central-backend-1"; then
              echo "NOT-CENTRAL"
              docker ps --format "{{.Names}}" | sed "s/^/running: /"
              exit 0
            fi
            for service in backend frontend gateway sync-receiver; do
              # A container has no RepoDigests; its image does. Ask the container for its image
              # ID, then that image for the registry digest a rollback can pull.
              image=$(docker inspect --format="{{.Image}}" "liberiaemr-central-${service}-1" 2>/dev/null || true)
              digest=$(docker image inspect --format="{{index .RepoDigests 0}}" "$image" 2>/dev/null || true)
              [ -n "$digest" ] || digest=unknown
              echo "${service}: ${digest}"
            done
          ')
          echo "$output"
          if echo "$output" | grep -qx "NOT-CENTRAL"; then
            echo "::error::The central dev server is not running the liberiaemr-central compose project. Switch it once by hand (docs/runbooks/deploy.md, Central deployment); CI will not start a second stack beside it."
            exit 1
          fi
          echo "backend_digest=$(echo "$output" | awk -F': ' '/^backend:/{print $2}')" >> "$GITHUB_OUTPUT"
          echo "frontend_digest=$(echo "$output" | awk -F': ' '/^frontend:/{print $2}')" >> "$GITHUB_OUTPUT"
          echo "gateway_digest=$(echo "$output" | awk -F': ' '/^gateway:/{print $2}')" >> "$GITHUB_OUTPUT"
          echo "receiver_digest=$(echo "$output" | awk -F': ' '/^sync-receiver:/{print $2}')" >> "$GITHUB_OUTPUT"
      # The compose file on the server has to match the images being deployed: an old checkout
      # names the facility frontend, and lacks newer services and settings. So the compose
      # directory MUST sit in a git checkout (the Ansible playbook clones one); anything else
      # stops here, before the server is touched, rather than deploying against a compose
      # file nobody can identify. The commit is recorded so a rollback can restore it.
      - name: Record the checkout the compose file comes from
        if: steps.configured.outputs.configured == 'true'
        id: previous-checkout
        run: |
          sha=$(ssh "$CENTRAL_DEV_USER@$CENTRAL_DEV_HOST" "git -C '$CENTRAL_DEV_COMPOSE_DIR' rev-parse HEAD" 2>&1) || true
          if ! echo "$sha" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::$CENTRAL_DEV_COMPOSE_DIR on the central dev server is not a readable git checkout, so CI cannot keep its compose file in step with the images: $sha. Clone the repository there as $CENTRAL_DEV_USER (ansible/central-server.yaml does)."
            exit 1
          fi
          echo "checkout at $sha"
          echo "checkout_sha=$sha" >> "$GITHUB_OUTPUT"
      # Fast-forward the checkout to this exact commit. It never rewrites local history: a
      # checkout that cannot fast-forward, or that is already past this commit (a newer deploy
      # or a manual change got there first), stops the deploy for a human rather than start
      # this run's images under a different compose file.
      #
      # -f docker-compose.yml names the tracked file. Without it compose would prefer an
      # untracked compose.yaml, compose.yml or docker-compose.yaml placed beside it, and
      # would load any override file, and none of the checks here would notice.
      #
      # REGISTRY is passed explicitly, as rollback-central-dev's retags already assume: the
      # images come from where this workflow published them, not from whatever central.env
      # says (central.env.example still names ghcr.io). Shell variables win over --env-file.
      # The env file defaults to where the playbook and deploy.md put it, relative to the
      # compose directory.
      - name: Pull and restart backend, frontend and gateway on the central dev server
        if: steps.configured.outputs.configured == 'true'
        run: |
          ssh "$CENTRAL_DEV_USER@$CENTRAL_DEV_HOST" "
            set -e
            cd '$CENTRAL_DEV_COMPOSE_DIR'
            top=\$(git rev-parse --show-toplevel)
            # Checked BEFORE moving anything: a fast-forward keeps a hand edit to any tracked file
            # the target commit does not touch, and HEAD matching says nothing about the files.
            # Untracked files count too: initdb/ is mounted as the MariaDB init directory, so a
            # stray script there would run when the database volume is created. Git-ignored
            # files (central.env) are not listed, so they stay allowed.
            if [ -n \"\$(git -C \"\$top\" status --porcelain --untracked-files=all)\" ]; then
              echo \"checkout at \$top has local changes or untracked files; not starting this run's images under a compose file that differs from ${{ github.sha }}. Commit or discard them by hand:\" >&2
              git -C \"\$top\" status --short --untracked-files=all >&2
              exit 1
            fi
            # The one untracked file that is NOT fine: an override. With -f compose ignores it,
            # but a manual docker compose up here would apply it, so its presence means this
            # server is meant to run something other than the tracked file. Stop for a human.
            for f in docker-compose.override.yml docker-compose.override.yaml compose.override.yml compose.override.yaml; do
              if [ -e \"\$f\" ]; then
                echo \"\$PWD/\$f exists: a manual docker compose up here would apply it on top of ${{ github.sha }}'s compose file. Remove it, or commit what it does, before CI deploys here\" >&2
                exit 1
              fi
            done
            git -C \"\$top\" fetch -q origin main
            git -C \"\$top\" merge -q --ff-only ${{ github.sha }} \
              || { echo 'checkout at '\$top' cannot fast-forward to ${{ github.sha }}; fix it by hand' >&2; exit 1; }
            head=\$(git -C \"\$top\" rev-parse HEAD)
            if [ \"\$head\" != '${{ github.sha }}' ]; then
              echo \"checkout at \$top is at \$head, past ${{ github.sha }}; not starting this run's images under a newer compose file. Fix it by hand\" >&2
              exit 1
            fi
            echo \"checkout \$top now at \$head\"
            REGISTRY='${{ env.REGISTRY }}' LIBERIAEMR_VERSION=latest LEGACY_ADMIN_UI=true docker compose -f docker-compose.yml --env-file '${CENTRAL_DEV_ENV_FILE:-../../env/central.env}' pull backend frontend gateway sync-receiver
            REGISTRY='${{ env.REGISTRY }}' LIBERIAEMR_VERSION=latest LEGACY_ADMIN_UI=true docker compose -f docker-compose.yml --env-file '${CENTRAL_DEV_ENV_FILE:-../../env/central.env}' up -d --no-deps backend frontend gateway sync-receiver
            # Their config and rules are single-file mounts from this checkout; only a new container sees the new files.
            REGISTRY='${{ env.REGISTRY }}' LIBERIAEMR_VERSION=latest LEGACY_ADMIN_UI=true docker compose -f docker-compose.yml --env-file '${CENTRAL_DEV_ENV_FILE:-../../env/central.env}' up -d --no-deps --force-recreate prometheus alertmanager
          "

  # A central deploy is healthy only if the SPA answers AND it is the central build: a
  # facility frontend there would answer 200 too, but serve config-site.json instead.
  smoke-test-central-dev:
    name: Smoke test (central dev)
    runs-on: ubuntu-latest
    needs: deploy-central-dev
    environment: central-dev
    if: >
      !cancelled() &&
      needs.deploy-central-dev.result == 'success' &&
      needs.deploy-central-dev.outputs.configured == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    steps:
      - name: Wait for the central SPA to respond
        run: |
          base="https://${{ secrets.CENTRAL_DEV_HOST }}/openmrs/spa"
          for i in $(seq 1 20); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "$base/" || echo 000)
            if [ "$code" = "200" ]; then
              echo "ok: $base/ -> 200"
              cfg=$(curl -sk -o /dev/null -w '%{http_code}' "$base/config/config-central.json" || echo 000)
              if [ "$cfg" != "200" ]; then
                echo "::error::$base/ answers, but config-central.json is $cfg: this is not the central frontend" >&2
                exit 1
              fi
              echo "ok: the central build is served (config-central.json -> 200)"
              # The frontend serves the SPA even when the backend is down, so check the backend
              # too. A restart after an upgrade runs migrations and Initializer first: allow 15 min.
              health="https://${{ secrets.CENTRAL_DEV_HOST }}/openmrs/health/started"
              for j in $(seq 1 60); do
                hc=$(curl -sk -o /dev/null -w '%{http_code}' "$health" || echo 000)
                [ "$hc" = "200" ] && { echo "ok: backend started ($health -> 200)"; exit 0; }
                echo "backend attempt $j: got $hc, retrying in 15s..."
                sleep 15
              done
              echo "::error::$health never returned 200: the backend did not start" >&2
              exit 1
            fi
            echo "attempt $i: got $code, retrying in 15s..."
            sleep 15
          done
          echo "::error::$base/ never returned 200 after restart" >&2
          exit 1

  rollback-central-dev:
    name: Roll back central dev environment
    runs-on: ubuntu-latest
    needs: [deploy-central-dev, smoke-test-central-dev]
    if: >
      always() &&
      needs.deploy-central-dev.result == 'success' &&
      needs.deploy-central-dev.outputs.configured == 'true' &&
      needs.smoke-test-central-dev.result == 'failure' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      CENTRAL_DEV_HOST: ${{ secrets.CENTRAL_DEV_HOST }}
      CENTRAL_DEV_USER: ${{ secrets.CENTRAL_DEV_USER }}
      CENTRAL_DEV_COMPOSE_DIR: ${{ secrets.CENTRAL_DEV_COMPOSE_DIR }}
      CENTRAL_DEV_ENV_FILE: ${{ secrets.CENTRAL_DEV_ENV_FILE }}
    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CENTRAL_DEV_SSH_PRIVATE_KEY }}
      - name: Trust the central dev host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$CENTRAL_DEV_HOST" >> ~/.ssh/known_hosts
      # As rollback-dev: pull each previous image by digest, re-tag it as :latest locally,
      # and restart WITHOUT pulling, so compose uses the known-good images. The checkout goes
      # back too, so those images start under the compose file they ran with, not the one
      # this deploy fast-forwarded to. `reset --keep` only moves the branch back to a commit
      # it already contains, and refuses rather than discard a local change.
      - name: Roll back to the previously-running images and compose file
        run: |
          backend="${{ needs.deploy-central-dev.outputs.backend_digest }}"
          frontend="${{ needs.deploy-central-dev.outputs.frontend_digest }}"
          gateway="${{ needs.deploy-central-dev.outputs.gateway_digest }}"
          receiver="${{ needs.deploy-central-dev.outputs.receiver_digest }}"
          checkout="${{ needs.deploy-central-dev.outputs.checkout_sha }}"
          for pair in "backend:$backend" "frontend:$frontend" "gateway:$gateway" "sync-receiver:$receiver" "checkout:$checkout"; do
            svc="${pair%%:*}"; digest="${pair#*:}"
            if [ -z "$digest" ] || [ "$digest" = "unknown" ]; then
              echo "::error::No previous ${svc} captured; cannot roll back automatically. Manual intervention required on the central dev server."
              exit 1
            fi
          done
          echo "rolling back to:"
          echo "  backend:  $backend"
          echo "  frontend: $frontend"
          echo "  gateway:  $gateway"
          echo "  receiver: $receiver"
          echo "  checkout: $checkout"
          # The compose file goes back FIRST, and each image is tagged under the name THAT file
          # gives its service: an older compose file may name a different image (the facility
          # frontend, before the central one existed), and tagging a fixed name would leave
          # compose starting whatever that other name points at. python3 is on the server
          # because Ansible, which provisions it, needs it.
          ssh "$CENTRAL_DEV_USER@$CENTRAL_DEV_HOST" "
            set -e
            cd '$CENTRAL_DEV_COMPOSE_DIR'
            # As the deploy step: -f keeps an override out of compose config and compose up,
            # but one added since the deploy means the server is not in the recorded state.
            # (No backticks in these comments: they sit inside a double-quoted ssh string.)
            for f in docker-compose.override.yml docker-compose.override.yaml compose.override.yml compose.override.yaml; do
              if [ -e \"\$f\" ]; then
                echo \"\$PWD/\$f exists: the server is not in the state this deploy recorded. Remove it and roll back by hand\" >&2
                exit 1
              fi
            done
            # Only undo the deploy THIS run made. reset --keep refuses to discard a local edit, but it
            # would happily move a clean checkout back from a newer deploy that landed during
            # the smoke test (a manual one, say), and start old images over it.
            head=\$(git rev-parse HEAD)
            if [ \"\$head\" != '${{ github.sha }}' ]; then
              echo \"checkout is at \$head, not ${{ github.sha }} which this run deployed: something moved it since. Not rolling back over it; check the server by hand\" >&2
              exit 1
            fi
            # reset --keep keeps a local edit to any file the two commits do not differ on, so
            # compose would start the old images under the edited file, not the recorded one.
            # Untracked files count too, as in the deploy step; ignored ones (central.env) do not.
            if [ -n \"\$(git status --porcelain --untracked-files=all)\" ]; then
              echo \"checkout has local changes or untracked files, so the rollback would not restore the recorded compose configuration. Roll back by hand:\" >&2
              git status --short --untracked-files=all >&2
              exit 1
            fi
            git reset -q --keep '$checkout'
            echo \"checkout back at \$(git rev-parse HEAD)\"
            compose() { REGISTRY='${{ env.REGISTRY }}' LIBERIAEMR_VERSION=latest docker compose -f docker-compose.yml --env-file '${CENTRAL_DEV_ENV_FILE:-../../env/central.env}' \"\$@\"; }
            config=\$(compose config --format json)
            for pair in 'backend=$backend' 'frontend=$frontend' 'gateway=$gateway' 'sync-receiver=$receiver'; do
              svc=\${pair%%=*}; digest=\${pair#*=}
              name=\$(printf '%s' \"\$config\" | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"services\"][sys.argv[1]][\"image\"])' \"\$svc\")
              docker pull \"\$digest\"
              docker tag \"\$digest\" \"\$name\"
              echo \"\$svc: \$digest tagged as \$name\"
            done
            compose up -d --no-deps backend frontend gateway sync-receiver
            compose up -d --no-deps --force-recreate prometheus alertmanager
          "
      # Same bar as the smoke test: the SPA answering is not enough, since the frontend serves
      # it with the backend down. A rollback that leaves the backend unhealthy fails here.
      - name: Verify the rollback came back up
        run: |
          url="https://$CENTRAL_DEV_HOST/openmrs/spa/"
          for i in $(seq 1 20); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "$url" || echo 000)
            if [ "$code" = "200" ]; then
              echo "ok: rollback restored the SPA ($url -> 200)"
              health="https://$CENTRAL_DEV_HOST/openmrs/health/started"
              for j in $(seq 1 60); do
                hc=$(curl -sk -o /dev/null -w '%{http_code}' "$health" || echo 000)
                [ "$hc" = "200" ] && { echo "ok: rollback restored the backend ($health -> 200)"; exit 0; }
                echo "backend attempt $j: got $hc, retrying in 15s..."
                sleep 15
              done
              echo "::error::Rollback brought the SPA back but $health never returned 200; the central backend is still down and needs a human now." >&2
              exit 1
            fi
            echo "attempt $i: got $code, retrying in 15s..."
            sleep 15
          done
          echo "::error::Rollback itself did not bring the central SPA back up; this needs a human now." >&2
          exit 1

  # ---------------------------------------------------------------------
  # DAST — OWASP ZAP baseline scan against the live dev instance. Only
  # runs if smoke-test passed (needs: smoke-test), so it never scans a
  # broken/rolled-back instance. Report only for now (cmd_options: '-I' +
  # continue-on-error): a first-ever scan of an app this size will almost
  # certainly surface findings that need triage before this can safely
  # block a deploy. Tighten once there's a baseline to compare against.
  # allow_issue_writing is off so this doesn't start auto-filing GitHub
  # issues without you deciding you want that.
  # ---------------------------------------------------------------------
  dast:
    name: DAST scan (dev)
    runs-on: ubuntu-latest
    needs: smoke-test
    if: >
      !cancelled() &&
      needs.smoke-test.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    steps:
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        continue-on-error: true
        with:
          target: https://${{ secrets.DEV_HOST }}/openmrs/spa/
          cmd_options: '-I'
          allow_issue_writing: false
