# Pull-request pipeline — IMPLEMENTATION.md §8, stages 1-5, extended with
# SBOM / dependency-check / container build (formerly a separate
# "Java DevSecOps Pipeline" workflow, merged in to avoid building the
# Maven reactor twice per run).
# The release stages (upgrade test, publish, deploy) live in release.yml.
name: CI

on:
  # main only. This trigger used to carry no branches: filter, so every branch
  # push ran the pipeline — but a push to a branch that already had a PR fired
  # this workflow TWICE for one commit, and the concurrency group below cancelled
  # one of the two. A cancelled run still publishes a check run for every job in
  # its plan, so the commit ended up with two checks named "CI gate": one from the
  # run that finished, one cancelled. GitHub requires EVERY check run carrying a
  # required context to pass, so the cancelled leftover blocked the PR even when
  # the surviving run was green — see the gate job for the full story.
  #
  # A required status check therefore needs exactly one run per commit, and that
  # run is the pull_request one. The cost is that a branch gets no CI until a PR
  # exists for it; workflow_dispatch below covers an ad-hoc run before then, and
  # a draft PR gets the full pipeline.
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# This used to be what stopped a commit being built twice, back when a branch push
# and its pull_request both triggered the workflow; the push trigger above is now
# restricted to main, so only one event fires per commit and there is nothing left
# to collapse. What the group still does is make a NEW commit cancel the run still
# going for the previous one, instead of queueing behind it.
#
# The key is still the BRANCH rather than the event: on a pull_request event
# github.head_ref is the source branch, on a push it is empty and ref_name is the
# branch, so successive runs for one branch share a group however they were
# triggered — including a workflow_dispatch run on a branch that also has a PR.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  # Never on main. publish-latest, deploy-dev, smoke-test, rollback-dev and dast
  # only run there, so cancelling a run in flight could abort a publish halfway,
  # or leave a deploy half-applied with the rollback job cancelled along with it.
  # Superseded main builds are cheap by comparison.
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read
  security-events: write
  actions: read
  checks: write

env:
  JAVA_VERSION: "17"
  REGISTRY: intellisoftdev
  IMAGE_NAME: liberia-emr

jobs:
  # ---------------------------------------------------------------------
  # Stage 0 — what does this commit actually touch?
  #
  # initializer-clean-db is the longest job in this pipeline by a wide
  # margin: 18 minutes, of which 15 are the CIEL import into an empty
  # database. It is worth every second on a commit that changes a CSV, and
  # nothing at all on one that changes a bash script or a runbook — both of
  # which have paid it in full.
  #
  # The path list is an ALLOW list and deliberately over-broad: content, the
  # whole distribution tree (Dockerfiles, compose, distro.properties), the
  # build scripts that fetch and sanitise the OCL exports, the QA script
  # itself, the reactor pom, and this workflow. modules/ is in the list too:
  # the backend image builds the in-tree OMOD into itself, and that module
  # carries a liquibase changeset and its own global properties, so a change
  # there changes what a clean database ends up holding.
  # Anything that could plausibly change what Initializer loads, or how it is
  # loaded, keeps the gate.
  #
  # Every uncertain case FAILS OPEN — no base commit, an unknown SHA, a
  # branch's first push, workflow_dispatch — because a metadata gate that
  # skips when it cannot tell is worse than one that runs when it need not.
  # ---------------------------------------------------------------------
  changes:
    name: Detect what changed
    runs-on: ubuntu-latest
    outputs:
      metadata: ${{ steps.filter.outputs.metadata }}
      sync: ${{ steps.filter.outputs.sync }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the diff below needs both ends of the range
      - id: filter
        name: Does this commit touch anything that can change metadata?
        env:
          # On a PR, compare against the branch point. On a push, against the
          # commit that was there before. Both come from the event payload;
          # neither is guaranteed to be usable, which the check below handles.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          if [[ -z "${BASE_SHA:-}" ]] || [[ "$BASE_SHA" =~ ^0+$ ]] \
             || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "No usable base commit (${BASE_SHA:-none}) — running the metadata gate."
            echo "metadata=true" >> "$GITHUB_OUTPUT"
            echo "sync=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Three dots on a PR: changes since the branch point, not changes
          # main has made in the meantime. Two on a push: exactly what the
          # push added.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            files="$(git diff --name-only "${BASE_SHA}...HEAD")"
          else
            files="$(git diff --name-only "${BASE_SHA}" HEAD)"
          fi

          echo "Changed files since ${BASE_SHA}:"
          sed 's/^/  /' <<<"$files"

          if grep -qE '^(content-packages/|distribution/|modules/|qa/upgrade/|scripts/build/|pom\.xml$|\.github/workflows/ci\.yml$)' <<<"$files"; then
            echo "metadata=true" >> "$GITHUB_OUTPUT"
            echo "-> metadata could have changed; the clean-database gate will run."
          else
            echo "metadata=false" >> "$GITHUB_OUTPUT"
            echo "-> nothing here can change what Initializer loads; skipping the clean-database gate."
          fi

          if grep -qE '^(distribution/(sync|broker|monitoring|compose|env)/|distribution/distro\.properties$|scripts/(security|sync)/|qa/sync/|\.github/workflows/ci\.yml$)' <<<"$files"; then
            echo "sync=true" >> "$GITHUB_OUTPUT"
            echo "-> the sync security surface changed; the broker refusal suite will run."
          else
            echo "sync=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------
  # Stage 1 — content validation (no build required)
  # ---------------------------------------------------------------------
  validate:
    name: Validate content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # no-secrets.sh uses git ls-files and git grep
      - name: Validate JSON / CSV / version discipline / variables
        run: ./scripts/validate/validate-content.sh
      - name: Refuse secrets, keys and PHI
        run: ./scripts/validate/no-secrets.sh
      - name: Refuse demo content in a production distribution
        run: ./scripts/validate/no-demo-in-release.sh
      # content-demo is upstream's, vendored verbatim. A local edit there is invisible in
      # review and lost at the next re-lift, so it is caught here instead. Needs network:
      # it re-fetches the pinned tag and verifies the commit it resolves to.
      - name: Refuse hand edits to the lifted demo content
        run: ./scripts/build/lift-demo-content.sh --check

  # ---------------------------------------------------------------------
  # Stage 2 — build, test, content packages, coverage, static analysis
  #
  # This single `mvn verify` builds the whole reactor, which includes the
  # content-packages module — so this job produces both the JUnit/JaCoCo
  # output AND the content package zips. There is deliberately no separate
  # "build-content" job any more; running `mvn verify` twice against the
  # same reactor wasted ~the whole build time for no extra coverage.
  # ---------------------------------------------------------------------
  build-test:
    name: Build, Test & SonarQube
    runs-on: ubuntu-latest
    needs: validate

    outputs:
      image-tag: ${{ github.sha }}

    # Secrets can't be referenced directly inside a step's `if:` condition
    # (GitHub Actions rejects it at parse time — "Unrecognized named-value:
    # 'secrets'"). Routing them through job-level env first makes them
    # readable from `if:` via the env context instead.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # sonar wants blame history

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Cache SonarQube Packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Build, Test & Validate against Initializer schema
        run: mvn -B clean verify

      # Sonar only runs if the secret is actually configured, so this
      # doesn't hard-fail on fork PRs (which never get repo secrets).
      - name: SonarQube Analysis
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.2.0.4988:sonar \
            -Dsonar.projectKey=liberia-emr \
            -Dsonar.host.url=${SONAR_HOST_URL} \
            -Dsonar.token=${SONAR_TOKEN} \
            -Dsonar.qualitygate.wait=true

      - name: Upload JUnit Results
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: warn

      - name: Upload Content Packages
        uses: actions/upload-artifact@v4
        with:
          name: content-packages
          path: content-packages/*/target/*.zip
          if-no-files-found: error

      # Raw (unzipped) per-layer frontend config JSON, for docker-build's
      # frontend leg to run collect-frontend-config.sh against without
      # rebuilding the reactor. upload-artifact strips the common leading
      # directory across the matched paths (here, "content-packages/"), so
      # the artifact's internal paths start at <layer>/target/... —
      # downloading it back with `path: content-packages` restores exactly
      # content-packages/<layer>/target/configuration/frontend_configuration/,
      # which is the path collect-frontend-config.sh expects.
      - name: Upload Frontend Configuration
        uses: actions/upload-artifact@v4
        with:
          name: frontend-config
          path: content-packages/*/target/configuration/frontend_configuration/config-*.json
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Stage 3 — software supply-chain checks, run in parallel off the same build
  # ---------------------------------------------------------------------
  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Generate CycloneDX SBOM
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: |
            target/bom.xml
            target/bom.json
          if-no-files-found: warn

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: build-test
    # Only needed to read the secret at runtime inside a bash if-check —
    # secrets can't be referenced directly in a step's `if:` (same parse
    # restriction we hit with SONAR_TOKEN earlier), so this routes it
    # through job-level env instead.
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compute cache week
        id: date
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache Dependency Check Database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          # Rotates weekly: a fresh cache once a week forces a full DB
          # rebuild occasionally (the DB format can change between plugin
          # versions), but restore-keys falls back to last week's cache on
          # a miss, so most days still get a fast incremental update
          # instead of a cold download.
          key: dependency-check-${{ runner.os }}-${{ steps.date.outputs.week }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      # Without an API key, NVD heavily rate-limits update requests — this
      # is usually the actual bottleneck, more than caching alone fixes.
      # Get a free key at https://nvd.nist.gov/developers/request-an-api-key
      # and add it as the NVD_API_KEY repo secret; this step just uses it
      # if present and warns (without failing) if it's missing.
      - name: Run OWASP Dependency Check
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            mvn -B org.owasp:dependency-check-maven:12.1.8:check -Dnvd.api.key="$NVD_API_KEY"
          else
            echo "::warning::NVD_API_KEY not set — NVD updates will be rate-limited and slow. See https://nvd.nist.gov/developers/request-an-api-key"
            mvn -B org.owasp:dependency-check-maven:12.1.8:check
          fi
      - name: Upload Dependency Check Reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: |
            **/target/dependency-check-report.html
            **/target/dependency-check-report.xml
            **/target/dependency-check-report.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # Stage 4a — initializer smoke test against a clean database
  # ---------------------------------------------------------------------
  initializer-clean-db:
    name: Initializer against a clean database
    runs-on: ubuntu-latest
    # Runs in parallel with the security scans rather than behind them —
    # see the `gate` job at the end of this file for where sbom and
    # dependency-check are actually enforced.
    needs: [build-test, changes]
    # Skipped when nothing in this commit can affect what Initializer loads.
    # See the `changes` job for the path list and for why it fails open. The
    # gate at the end of this file accepts a skip HERE and only here.
    if: needs.changes.outputs.metadata == 'true'
    # The MOH's curated CIEL collections (ocl.org / ocl.collections in
    # distro.properties) are fetched by build-distribution.sh at build time;
    # the exports are gitignored, so without this the runner has only the
    # token-free reference-application dictionaries and every concept that
    # maps to a CIEL source fails to load. The script warns and carries on
    # rather than failing when the token is absent, which is what keeps fork
    # PRs (which never receive repo secrets) working — but it also means a
    # missing secret shows up as rejected metadata further down, not as a
    # clear "no credentials" error. See the ocl/ README.
    env:
      OCL_API_TOKEN: ${{ secrets.OCL_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      # run-clean-install.sh starts a built distribution; it does not build one, and the
      # image is not published from a pull request, so this job builds it via
      # build-distribution.sh, which fetches the OCL/CIEL exports (OCL_API_TOKEN below) before
      # running its own `mvn package`. The build-test content-packages artifact is not
      # downloaded here — its build never fetches OCL content, so it isn't a substitute.
      #
      # 0.0.0-ci, not 1.0.0-SNAPSHOT: build-distribution.sh refuses to build at a -SNAPSHOT
      # or floating version, and rightly so. This is a fixed, obviously-not-a-release tag for
      # a stack that is destroyed at the end of the job.
      - name: Build the backend image under test
        run: |
          ./scripts/build/build-distribution.sh \
            --version 0.0.0-ci --site careysburg --no-frontend
      # Loading metadata into an empty database is the cheapest way to catch a broken CSV,
      # an unresolved ${var.*} or a forward reference between layers.
      - name: Load all metadata into an empty database
        run: ./qa/upgrade/run-clean-install.sh --version 0.0.0-ci --no-frontend
      # run-clean-install.sh saves the whole initializer.log on failure, but only prints a
      # 40-line excerpt — enough to name the rejected file, rarely enough to explain it. The
      # rest is lost when the runner is torn down, and recovering it costs a full re-run of
      # this 13-minute job. Keep it: the log is the only place the load ORDER of the concept
      # CSVs is visible, which is what a cross-file answer reference failure turns on.
      - name: Keep the Initializer log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: initializer-log
          path: qa/upgrade/initializer-failure.log
          if-no-files-found: ignore
      - name: API tests
        run: 'echo "TODO: qa/api — see qa/api/README.md"'

  # ---------------------------------------------------------------------
  # Stage 4b — the three distribution images for this commit (not pushed).
  #
  # This calls scripts/build/build-distribution.sh directly instead of
  # hand-rolling the build — an earlier version of this job reimplemented
  # its steps piecemeal (reading spa.core, computing SPA_CONFIG_URLS,
  # collecting frontend config) and, in doing so, missed a step the script
  # doesn't skip: resolving the 32 OMODs pinned in distro.properties into
  # distribution/backend/modules/. Since that directory isn't git-tracked,
  # a fresh checkout has it empty, and `COPY distribution/backend/modules/`
  # on an empty directory does not error — it silently ships a backend
  # image with zero OMODs. The script closes that gap, and also reconciles
  # the collected frontend config order against SPA_CONFIG_URLS in the
  # compose file, which nothing here was checking before.
  #
  # This is the same script initializer-clean-db calls and that a real
  # release build runs too, so a green build-distribution.sh here is a
  # meaningful signal, not just "the Dockerfiles happen to work in CI."
  #
  # Cost: the script runs its own `mvn package`, on top of build-test's reactor build. That
  # duplication is unavoidable here — build-test's build never fetches the OCL/CIEL exports
  # (no OCL_API_TOKEN in that job), so its output isn't a valid substitute for what a real
  # image needs. The backend Dockerfile used to ALSO rebuild content-packages a third time,
  # from scratch, inside its own build stage; it now just unpacks the zips this script already
  # built on the host moments earlier (see distribution/backend/Dockerfile), so this is down
  # to two Maven builds per pipeline run, not three.
  #
  # The backend image also builds the in-tree liberiaemr OMOD in a stage of its own. The
  # backend-module job below has already built and TESTED that module; the image stage skips
  # tests, so it is a compile, not a second test run.
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build-test
    # Same reason as initializer-clean-db: these images ship the dictionary,
    # so an image built without the token is not the image a release ships.
    env:
      OCL_API_TOKEN: ${{ secrets.OCL_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      # Site is fixed to careysburg to match initializer-clean-db — this is
      # a CI smoke build, not a per-site release artifact. Version is the
      # commit SHA: build-distribution.sh refuses -SNAPSHOT/latest, and a
      # SHA-tagged image (unlike a fixed placeholder) stays unique per run,
      # which matters here since these images could later be inspected or
      # cached across jobs — initializer-clean-db's own throwaway stack
      # doesn't need that and uses a fixed 0.0.0-ci instead.
      - name: Build backend, frontend and gateway images
        run: |
          ./scripts/build/build-distribution.sh \
            --version ${{ github.sha }} --site careysburg

      # Trivy scans the images already built above — no separate job, no
      # artifact transfer, since the images only exist on this runner's
      # local Docker daemon (build-distribution.sh uses plain `docker
      # build`, not buildx, so there's nothing pushed to pull from
      # elsewhere). exit-code: '0' means this reports findings without
      # failing the job — a first rollout of a new base-image scan would
      # almost certainly turn up existing CVEs in openmrs/openmrs-core,
      # nginx:1.27-alpine etc. that haven't been triaged yet. Tighten to
      # exit-code: '1' (with a --severity filter) once there's been a
      # chance to review what it actually finds.
      - name: Trivy scan — backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/liberia-emr-backend:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          trivyignores: .trivyignore.yaml
          exit-code: '0'
      - name: Trivy scan — frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/liberia-emr-frontend:${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          exit-code: '0'
      - name: Trivy scan — gateway
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/liberia-emr-gateway:${{ github.sha }}
          format: sarif
          output: trivy-gateway.sarif
          exit-code: '0'

      # Uploaded as three separate calls, each with its own category —
      # GitHub Code Scanning rejects multiple SARIF runs sharing a category
      # in one upload (as of the 2025-07-21 change), and Trivy doesn't
      # differentiate categories on its own, so uploading all three files
      # via sarif_file: . collided. Needs security-events: write, already
      # granted at the workflow level.
      #
      # continue-on-error because the upload depends on a repository SETTING this workflow
      # cannot assert: with Code Security disabled, upload-sarif fails with "Code Security
      # must be enabled for this repository to use code scanning" and took the whole job,
      # and therefore the CI gate, down with it. That was blocking every open PR on a
      # configuration change rather than a code defect.
      #
      # What this does and does not trade away: the three scans above still RUN, and still
      # fail the job if Trivy itself errors — only the publishing of results to the Security
      # tab is made non-fatal. The cost is that a genuine upload regression now shows up as
      # a red step inside a green job rather than a failed run, so findings can stop
      # reaching the Security tab without anyone being paged. Re-enable Code Security on the
      # repository and these steps go green on their own; drop continue-on-error then, so
      # the upload is load-bearing again.
      - name: Upload Trivy results — backend
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend
      - name: Upload Trivy results — frontend
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend
      - name: Upload Trivy results — gateway
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-gateway.sarif
          category: trivy-gateway

  # Sync broker hardening (sync-eip.md sections 7.2 and 7.3): every permission and
  # certificate control is proven by a refusal, over OpenWire, the protocol both sync
  # apps use. Runs only when something that can move those controls changed.
  sync-hardening:
    name: Sync broker hardening
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.sync == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Build the broker, sync sender and expiry exporter images
        run: |
          set -euo pipefail
          dbsync_version="$(grep -E '^sync\.dbsync=' distribution/distro.properties | cut -d= -f2)"
          docker build -f distribution/broker/Dockerfile -t lemr-broker:ci distribution/broker
          docker build -f distribution/sync/Dockerfile --target sender \
            --build-arg "DBSYNC_VERSION=${dbsync_version}" -t lemr-sync:ci distribution/sync
          docker build -f distribution/monitoring/cert-expiry/Dockerfile \
            -t lemr-cert-expiry:ci distribution/monitoring/cert-expiry
      - name: Compose keeps the sync security wiring
        run: qa/sync/verify-compose-wiring.sh
      - name: Broker refusal suite
        run: |
          qa/sync/verify-hardening.sh --broker-image lemr-broker:ci --sender-image lemr-sync:ci \
            --exporter-image lemr-cert-expiry:ci
      - name: Sender refuses a weaker configuration
        run: |
          set -euo pipefail
          env_args=(-e DBSYNC_SENDER_ID=careysburg -e OPENMRS_DB_HOST=db -e OPENMRS_DB_PORT=3306
            -e OPENMRS_DB_NAME=openmrs -e OPENMRS_DB_USER=u -e OPENMRS_DB_PASSWORD=p
            -e MGMT_DB_NAME=m -e MGMT_DB_USER=u -e MGMT_DB_PASSWORD=p -e DEBEZIUM_SERVER_ID=20001
            -e DEBEZIUM_DB_USER=u -e DEBEZIUM_DB_PASSWORD=p -e OPENMRS_BASE_URL=http://backend
            -e OPENMRS_REST_USER=u -e OPENMRS_REST_PASSWORD=p)
          refuses() { # expected-message docker-args...
            local want="$1"; shift
            local out
            out="$(docker run --rm "${env_args[@]}" "$@" lemr-sync:ci 2>&1 || true)"
            grep -q "$want" <<<"$out" || { echo "expected '$want', got: $out"; exit 1; }
            echo "refused as expected: $want"
          }
          refuses 'plain tcp is not accepted' -e ARTEMIS_URL=tcp://central:61616
          refuses 'without options' -e 'ARTEMIS_URL=ssl://central:61617?socket.verifyHostName=false'
          refuses 'sync-certs is missing or cannot be entered' -e ARTEMIS_URL=ssl://central:61617
          refuses "this facility's own address" -e ARTEMIS_URL=ssl://central:61617 \
            -e SYNC_OUTPUT_ENDPOINT=activemq:topic:openmrs.sync.topic
          refuses 'must be true for the broker' -e ARTEMIS_URL=ssl://central:61617 -e SYNC_PAYLOAD_ENCRYPTION=false
      - name: Sender template declares the table set
        run: |
          # The set is declared in the template, not inherited from the jar, and must stay
          # exactly this (sync-entity-coverage.md §1.1). Order is free.
          expected="ALLERGY CONDITIONS DIAGNOSIS_ATTRIBUTE DRUG_ORDER ENCOUNTER ENCOUNTER_DIAGNOSIS ENCOUNTER_PROVIDER OBS
            ORDERS ORDER_ATTRIBUTE ORDER_GROUP ORDER_GROUP_ATTRIBUTE PATIENT PATIENT_IDENTIFIER PATIENT_PROGRAM
            PATIENT_PROGRAM_ATTRIBUTE PATIENT_STATE PERSON PERSON_ADDRESS PERSON_ATTRIBUTE PERSON_NAME PROVIDER
            REFERRAL_ORDER RELATIONSHIP TEST_ORDER USERS VISIT VISIT_ATTRIBUTE"
          declared="$(sed -n 's/^eip\.watchedTables=//p' distribution/sync/application.properties.template | tr ',' '\n' | sort | paste -sd' ' -)"
          [ "$declared" = "$(tr -s ' \n' '\n\n' <<<"$expected" | sed '/^$/d' | sort | paste -sd' ' -)" ] \
            || { echo "sender template watches: ${declared:-nothing}"; echo "expected: $expected" | tr -s ' \n' ' '; echo; exit 1; }
      - name: Receiver refuses a weaker configuration
        run: |
          set -euo pipefail
          V="$(grep -E '^sync\.dbsync=' distribution/distro.properties | cut -d= -f2)"
          docker build -q -f distribution/sync/Dockerfile --target receiver \
            --build-arg "DBSYNC_VERSION=${V}" -t lemr-sync-receiver:ci distribution/sync >/dev/null
          env_args=(-e OPENMRS_DB_HOST=db -e OPENMRS_DB_PORT=3306 -e OPENMRS_DB_NAME=openmrs
            -e OPENMRS_DB_USER=u -e OPENMRS_DB_PASSWORD=p -e MGMT_DB_NAME=m -e MGMT_DB_USER=u
            -e MGMT_DB_PASSWORD=p -e OPENMRS_BASE_URL=http://backend -e OPENMRS_REST_USER=u
            -e OPENMRS_REST_PASSWORD=p)
          refuses() {
            local want="$1"; shift
            local out
            out="$(docker run --rm "${env_args[@]}" "$@" lemr-sync-receiver:ci 2>&1 || true)"
            grep -q "$want" <<<"$out" || { echo "expected '$want', got: $out"; exit 1; }
            echo "refused as expected: $want"
          }
          refuses 'plain tcp is not accepted' -e ARTEMIS_URL=tcp://artemis:61616
          refuses 'sync-certs is missing or cannot be entered' -e ARTEMIS_URL=ssl://artemis:61617
          refuses 'cannot be turned off at central' -e ARTEMIS_URL=ssl://artemis:61617 -e SYNC_PAYLOAD_ENCRYPTION=false
          # The receiver's protections live in its configuration template; none may be dropped.
          template=distribution/sync/receiver-application.properties.template
          for setting in '^camel\.input\.endpoint=.*[?&]acknowledgementMode=4(&|$)' \
                         '^camel\.input\.endpoint=.*[?&]disableReplyTo=true(&|$)' \
                         '^openmrs\.eip\.dbsync\.encryption\.enabled=true$' \
                         '^logging\.level\.receiver-retry=WARN$' \
                         '^logging\.level\.org\.openmrs\.eip\.dbsync\.receiver\.ComplexObsProcessor=WARN$'; do
            grep -Eq "$setting" "$template" || { echo "receiver template lost: $setting"; exit 1; }
          done
      - name: Alerts are delivered by email and webhook
        run: qa/sync/verify-alert-delivery.sh
      - name: Certificate alert rules behave (promtool unit tests)
        run: |
          docker run --rm -v "$PWD/distribution/monitoring:/m:ro" --entrypoint promtool \
            prom/prometheus:v2.53.4 test rules /m/tests/rules-central-test.yml
      - name: Expiry exporter reads issued material
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          scripts/security/gen-sync-certs.sh --out "$out" --facilities careysburg >/dev/null
          chmod -R a+rX "$out"
          metrics="$(docker run --rm -v "$out/broker/public:/public:ro" lemr-cert-expiry:ci --once)"
          echo "$metrics"
          grep -q 'sync_cert_not_after_seconds{identity="careysburg",kind="facility"}' <<<"$metrics"
          grep -q '^sync_crl_next_update_seconds ' <<<"$metrics"

  # ---------------------------------------------------------------------
  # Stage 5 — end to end
  # ---------------------------------------------------------------------
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # The job builds its own throwaway --demo images and boots them itself, but
    # waits for the shared validation/build jobs so failures stop the expensive
    # stack setup before it starts.
    needs: [changes, build-test]
    if: always() && needs.build-test.result == 'success'
    env:
      REGISTRY: intellisoftdev
      LIBERIAEMR_VERSION: 0.0.0-ci
    steps:
      - uses: actions/checkout@v4
      # Needed to build the demo images below (build-distribution.sh runs `mvn package` to
      # resolve content-packages before the Docker build stage) — nothing upstream produced
      # an image this job can reuse instead, see above.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Cypress test dependencies
        working-directory: qa/e2e
        run: npm ci

      # --demo: the priority journeys log in as admin/Admin123, which only content-demo
      # provisions (docs/runbooks/demo-stack.md). --no-frontend is deliberately absent —
      # Cypress drives the real SPA, unlike initializer-clean-db.
      - name: Build the demo images under test
        run: |
          ./scripts/build/build-distribution.sh \
            --version "$LIBERIAEMR_VERSION" --site careysburg --demo

      # Self-signed and thrown away with the stack, same as qa/upgrade/run-clean-install.sh —
      # the gateway will not start at all without fullchain.pem/privkey.pem present.
      - name: Generate a throwaway TLS certificate for the gateway
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-certs"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=liberiaemr-e2e" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout "$RUNNER_TEMP/e2e-certs/privkey.pem" \
            -out    "$RUNNER_TEMP/e2e-certs/fullchain.pem"

      # Ephemeral credentials for a database that lives only as long as this job — never a
      # facility secret. cypress.env.json is for local development only and must never drive
      # a CI run (Cypress base URL comes from CYPRESS_BASE_URL below instead).
      - name: Start the disposable demo stack
        run: |
          cat > "$RUNNER_TEMP/e2e.env" <<ENV
          REGISTRY=${REGISTRY}
          LIBERIAEMR_VERSION=${LIBERIAEMR_VERSION}
          FACILITY_CODE=careysburg
          MYSQL_DATABASE=openmrs
          MYSQL_USER=openmrs
          MYSQL_PASSWORD=ci-ephemeral
          MYSQL_ROOT_PASSWORD=ci-ephemeral-root
          OMRS_CREATE_TABLES=true
          TLS_CERT_DIR=$RUNNER_TEMP/e2e-certs
          CENTRAL_URL=http://localhost
          ENV
          docker compose \
            -f distribution/compose/facility/docker-compose.yml \
            -f distribution/compose/facility/docker-compose.demo.yml \
            --env-file "$RUNNER_TEMP/e2e.env" up -d db backend

      - name: Wait for the backend to become healthy
        run: |
          deadline=$(( SECONDS + 1800 ))
          until docker compose \
                  -f distribution/compose/facility/docker-compose.yml \
                  -f distribution/compose/facility/docker-compose.demo.yml \
                  --env-file "$RUNNER_TEMP/e2e.env" exec -T backend \
                  curl -fs http://localhost:8080/openmrs/health/started >/dev/null 2>&1; do
            if (( SECONDS > deadline )); then
              echo "FAIL: backend did not become healthy within 30 minutes" >&2
              docker compose \
                -f distribution/compose/facility/docker-compose.yml \
                -f distribution/compose/facility/docker-compose.demo.yml \
                --env-file "$RUNNER_TEMP/e2e.env" logs --tail 200 backend >&2
              exit 1
            fi
            sleep 10
          done

      - name: Start the frontend and the gateway
        run: |
          docker compose \
            -f distribution/compose/facility/docker-compose.yml \
            -f distribution/compose/facility/docker-compose.demo.yml \
            --env-file "$RUNNER_TEMP/e2e.env" up -d frontend gateway

      - name: Wait for the gateway to serve the SPA
        run: |
          deadline=$(( SECONDS + 120 ))
          until curl -fsk -o /dev/null https://localhost/openmrs/spa/; do
            if (( SECONDS > deadline )); then
              echo "FAIL: gateway did not serve /openmrs/spa/ within 2 minutes" >&2
              docker compose \
                -f distribution/compose/facility/docker-compose.yml \
                -f distribution/compose/facility/docker-compose.demo.yml \
                --env-file "$RUNNER_TEMP/e2e.env" logs --tail 40 gateway >&2
              exit 1
            fi
            sleep 5
          done

      # cypress.config.ts refuses any CYPRESS_BASE_URL host other than localhost unless it
      # is explicitly allowlisted — so this can never resolve to
      # liberiaemrfacilitydev.intellisoftkenya.com or any other shared/production host, only
      # to the disposable stack just started. admin/Admin123 is the demo stack's own
      # well-known training account (docs/runbooks/demo-stack.md), not a facility credential.
      # RUN_LIVE_REGISTRATION is deliberately left unset: the normal CI run must not create
      # real patient records, and the gated test stays skipped (qa/e2e/README.md Rules).
      # Temporarily skip only the TB save scenario: the current form-engine build crashes
      # during incomplete-form validation. The other TB scenarios must continue to run.
      - name: Cypress
        working-directory: qa/e2e
        env:
          CYPRESS_BASE_URL: https://localhost
          CYPRESS_USERNAME: admin
          CYPRESS_PASSWORD: Admin123
          CYPRESS_SKIP_TB_SCREENING_SAVE_TEST: "true"
        run: npm test

      - name: Upload Cypress screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            qa/e2e/cypress/screenshots
            qa/e2e/cypress/videos
          if-no-files-found: ignore

      - name: Tear down the disposable demo stack
        if: always()
        run: |
          docker compose \
            -f distribution/compose/facility/docker-compose.yml \
            -f distribution/compose/facility/docker-compose.demo.yml \
            --env-file "$RUNNER_TEMP/e2e.env" down -v || true
          rm -rf "$RUNNER_TEMP/e2e-certs" "$RUNNER_TEMP/e2e.env"

  # ---------------------------------------------------------------------
  # Frontend module build — independent of the Maven reactor, runs in
  # parallel with everything above.
  # ---------------------------------------------------------------------
  frontend:
    name: Custom Build ESMs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify e-partograph
        working-directory: packages/esm-liberia-epartograph-app
        run: 'echo "TODO: yarn install && yarn verify once the module is implemented"'

  backend-module:
    name: Build LiberiaEMR Module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Build and Package
        working-directory: modules/liberiaemr
        run: mvn -B clean package

  # ---------------------------------------------------------------------
  # Soft gate — the single required status check for branch protection.
  #
  # Everything above runs in parallel where possible (initializer-clean-db
  # and docker-build no longer wait on sbom/dependency-check to finish, so
  # a slow scan doesn't add latency to the smoke test or image build). This
  # job is where that's clawed back: it needs every job whose failure
  # should block a merge, and fails if any of them failed, was cancelled,
  # or was skipped. Point branch protection at this one job instead of
  # every job above — new jobs added later only need `gate` updated once.
  #
  # One job may legitimately be skipped: initializer-clean-db, which the
  # `changes` job stands down on a commit that cannot affect metadata. It is
  # named explicitly rather than allowing "skipped" across the board — a skip
  # anywhere else means a dependency failed, and that must still block the
  # merge. `changes` is in this list too, so a fault in the detection itself
  # fails the gate rather than quietly excusing the job it was meant to
  # schedule.
  # ---------------------------------------------------------------------
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    # This job is the required status check for main (repository ruleset "Prevent direct
    # push to Main"), which is why the push trigger at the top of this file is restricted
    # to main: a required context must be produced by exactly ONE run per commit. When both
    # a push and a pull_request run existed for the same commit, the one the concurrency
    # group cancelled still published a second check run named "CI gate" — cancelled, not
    # skipped — and a required context blocks the merge unless every check run carrying it
    # passes. A job-level if: does NOT fix that: a cancelled run publishes a check run for
    # every job in its plan, whether or not the condition would have skipped it.
    #
    # always(), so a dependency that failed still reaches the assertion below instead of
    # skipping it and reporting success by omission.
    if: always()
    needs:
      - changes
      - validate
      - build-test
      - sbom
      - dependency-check
      - initializer-clean-db
      - docker-build
      - sync-hardening
      - e2e
      - frontend
      - backend-module
    steps:
      - name: Require all jobs to have succeeded
        env:
          # One definition of "acceptable", used by both the assertion and
          # the report below, so the two can never drift apart.
          JQ_OK: |
            def acceptable:
              .key as $k
              | .value.result == "success"
                or (.value.result == "skipped"
                    and ($k == "initializer-clean-db" or $k == "sync-hardening"));
        run: |
          echo '${{ toJSON(needs) }}' | jq -e "$JQ_OK"'
            to_entries | all(acceptable)
          ' || {
            echo "One or more required jobs did not succeed:"
            echo '${{ toJSON(needs) }}' | jq -r "$JQ_OK"'
              to_entries[] | select(acceptable | not) | "  \(.key): \(.value.result)"
            '
            exit 1
          }

  # ---------------------------------------------------------------------
  # Merge-to-main only, from here down — see the numbered convention:
  #   1. PR: validate, build, security checks, tests           (everything above)
  #   2. PR merged: 1, plus publish :latest images and update dev
  #   3. Release: separate pipeline, see release.yml
  #
  # Both jobs below are gated on `needs: gate` (so they only start once
  # the entire PR-equivalent pipeline has actually passed on main) AND
  # their own `if:` (so they never run on a PR, even though gate itself
  # does run there). If gate is skipped or fails, needs: gate causes both
  # of these to skip automatically — the if: is there for clarity as much
  # as enforcement.
  # ---------------------------------------------------------------------

  publish-latest:
    name: Publish :latest images
    runs-on: ubuntu-latest
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # These images are published and deployed to dev. Building them without
    # the dictionary would push a distribution whose concepts do not resolve,
    # so this is the one place the token's absence matters most — and, because
    # build-distribution.sh only warns, the one place it would be quietest.
    env:
      OCL_API_TOKEN: ${{ secrets.OCL_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - uses: docker/login-action@v3
        with:
          # REGISTRY is "intellisoftdev" (a Docker Hub org, not GHCR), so
          # this is a plain Docker Hub login, not docker/login-action's
          # ghcr.io default. DOCKERHUB_USERNAME / DOCKERHUB_TOKEN need
          # creating as repo secrets — DOCKERHUB_TOKEN should be a Docker
          # Hub access token, not your account password.
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # build-distribution.sh explicitly refuses --version latest (it's in
      # the same guard as -SNAPSHOT), so this builds under the commit SHA
      # like docker-build does, then re-tags as :latest afterward. Both
      # tags get pushed — :latest for the dev deploy below, :<sha> so a
      # specific merge's image stays inspectable/rollback-able later.
      - name: Build images
        run: |
          ./scripts/build/build-distribution.sh \
            --version ${{ github.sha }} --site careysburg

      - name: Tag and push :latest alongside :${{ github.sha }}
        run: |
          for service in backend frontend gateway; do
            image="${REGISTRY}/liberia-emr-${service}"
            docker tag "${image}:${{ github.sha }}" "${image}:latest"
            docker push "${image}:${{ github.sha }}"
            docker push "${image}:latest"
          done

  deploy-dev:
    name: Update dev environment
    runs-on: ubuntu-latest
    needs: publish-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      backend_digest: ${{ steps.previous-version.outputs.backend_digest }}
      frontend_digest: ${{ steps.previous-version.outputs.frontend_digest }}
      gateway_digest: ${{ steps.previous-version.outputs.gateway_digest }}
    steps:
      # Deploy secrets needed (none of these exist yet — create them under
      # Settings > Secrets and variables > Actions):
      #   DEV_SSH_PRIVATE_KEY  the PRIVATE half of a keypair generated for
      #                        CI deploys specifically (not a personal key).
      #                        The PUBLIC half goes into
      #                        ~/.ssh/authorized_keys for DEV_USER on
      #                        DEV_HOST — the private key here is what lets
      #                        the runner authenticate as that trusted key.
      #   DEV_HOST             the dev server's hostname or IP.
      #   DEV_USER             the SSH user (e.g. mnyagah).
      #   DEV_COMPOSE_DIR      absolute path on the server to the directory
      #                        containing docker-compose.yml and
      #                        facility.env (where `docker compose pull`
      #                        was run manually before).
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}

      - name: Trust the dev host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEV_HOST }}" >> ~/.ssh/known_hosts

      # Captures the exact digest (immutable content hash) of each of the
      # THREE running images independently — not just backend's, and not
      # a tag or a label we invented. A tag (even a "unique" one like
      # :<sha>) is a mutable pointer; nothing guarantees it can't later
      # point at different bytes (a re-run of the same commit, a manual
      # overwrite). The digest is what the registry actually hashed the
      # content to — it can't drift. Runs before the risky pull+restart
      # below so it's still captured even if that step fails outright.
      - name: Capture currently-running image digests
        id: previous-version
        run: |
          output=$(ssh "${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }}" '
            for service in backend frontend gateway; do
              digest=$(docker inspect --format="{{index .RepoDigests 0}}" "liberiaemr-facility-${service}-1" 2>/dev/null || echo unknown)
              echo "${service}: ${digest}"
            done
          ')
          echo "$output"
          echo "backend_digest=$(echo "$output" | awk -F': ' '/^backend:/{print $2}')" >> "$GITHUB_OUTPUT"
          echo "frontend_digest=$(echo "$output" | awk -F': ' '/^frontend:/{print $2}')" >> "$GITHUB_OUTPUT"
          echo "gateway_digest=$(echo "$output" | awk -F': ' '/^gateway:/{print $2}')" >> "$GITHUB_OUTPUT"

      # Overrides LIBERIAEMR_VERSION inline rather than editing the
      # server's persistent facility.env, so this doesn't silently change
      # what a manual `docker compose up` would use later. Confirmed
      # against the real facility.env: LIBERIAEMR_VERSION is exactly the
      # variable that selects the image tag.
      #
      # LEGACY_ADMIN_UI=true is set the same way, and ONLY here. It unblocks
      # /openmrs/admin/ at the gateway and sets module.allow_web_admin on the
      # backend, so dev can reach Manage Modules and the legacy scheduler,
      # which have no O3 equivalent yet. It is safe to hard-code because this
      # job is dev-only (DEV_HOST, main pushes); a facility or central deploy
      # runs from docs/runbooks/deploy.md and never sets it, and both the
      # compose default and the gateway image default are false. Do NOT copy
      # this line into a production deploy path — MOH ICT SOP control D5,
      # docs/security/moh-ict-sop-mapping.md.
      - name: Pull and restart on the dev server
        run: |
          ssh "${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }}" '
            set -e
            cd "${{ secrets.DEV_COMPOSE_DIR }}"
            LIBERIAEMR_VERSION=latest LEGACY_ADMIN_UI=true docker compose --env-file facility.env pull
            LIBERIAEMR_VERSION=latest LEGACY_ADMIN_UI=true docker compose --env-file facility.env up -d
          '

  # ---------------------------------------------------------------------
  # Smoke test — the cheapest possible confirmation that the just-deployed
  # dev instance actually came up, before spending time on a DAST scan
  # against something that might just be crash-looping. Deliberately
  # unauthenticated: an authenticated check (e.g. the REST session
  # endpoint) would need real dev admin credentials as a new secret, and
  # I didn't want to invent a credential rather than ask for one. Happy to
  # add an authenticated check once there's a secret for it.
  #
  # Confirmed reachable: https://liberiaemrfacilitydev.intellisoftkenya.com
  # /openmrs/spa/ (with trailing slash) returns a real 200 with the actual
  # app shell, self-signed cert (hence -k). Note: /openmrs/spa WITHOUT the
  # trailing slash 301-redirects — this check deliberately does NOT follow
  # redirects (no -L), so an unexpected redirect fails loudly rather than
  # silently passing through.
  #
  # Timing: up to 20 attempts, 15s apart = up to 300s (5 min) total
  # before giving up and failing the job. Widened from an initial 150s —
  # OpenMRS-based backends commonly take well over a minute to become
  # healthy even on a routine restart (32 OMODs + Spring context init),
  # and a false-positive failure here doesn't just fail a job quietly —
  # it triggers rollback-dev, which undoes a perfectly good deploy. Better
  # to wait longer on a genuinely slow-but-fine boot than roll back one
  # that just needed more time.
  # ---------------------------------------------------------------------
  smoke-test:
    name: Smoke test (dev)
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Wait for the SPA to respond
        run: |
          url="https://${{ secrets.DEV_HOST }}/openmrs/spa/"
          for i in $(seq 1 20); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "$url" || echo 000)
            [ "$code" = "200" ] && { echo "ok: $url -> 200"; exit 0; }
            echo "attempt $i: got $code, retrying in 15s..."
            sleep 15
          done
          echo "::error::$url never returned 200 after restart" >&2
          exit 1

  # ---------------------------------------------------------------------
  # Rollback — fires only when deploy-dev itself succeeded (containers
  # actually restarted) but smoke-test then caught that the new version
  # isn't healthy. Deliberately does NOT fire if deploy-dev itself failed
  # (e.g. the SSH command errored outright) — in that case we don't
  # actually know what state the server is in, and blindly redeploying
  # "the previous version" on top of an unknown, possibly-still-old state
  # could make things worse rather than better. That failure mode needs a
  # human to look at the server directly.
  # ---------------------------------------------------------------------
  rollback-dev:
    name: Roll back dev environment
    runs-on: ubuntu-latest
    needs: [deploy-dev, smoke-test]
    if: >
      always() &&
      needs.deploy-dev.result == 'success' &&
      needs.smoke-test.result == 'failure' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}

      - name: Trust the dev host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEV_HOST }}" >> ~/.ssh/known_hosts

      # Pulls each image by its exact digest (not a tag), re-tags it
      # locally on the server as :latest, then restarts WITHOUT calling
      # `docker compose pull` — pulling again here would just re-fetch the
      # broken :latest from the registry and undo the retag. Compose picks
      # up whatever :latest already resolves to in the local Docker daemon,
      # which is now the known-good digest we just pulled.
      - name: Roll back to the previously-running images
        run: |
          backend="${{ needs.deploy-dev.outputs.backend_digest }}"
          frontend="${{ needs.deploy-dev.outputs.frontend_digest }}"
          gateway="${{ needs.deploy-dev.outputs.gateway_digest }}"
          for pair in "backend:$backend" "frontend:$frontend" "gateway:$gateway"; do
            svc="${pair%%:*}"; digest="${pair#*:}"
            if [ -z "$digest" ] || [ "$digest" = "unknown" ]; then
              echo "::error::No previous digest captured for ${svc} — cannot roll back automatically. Manual intervention required on the dev server."
              exit 1
            fi
          done
          # LEGACY_ADMIN_UI=true is repeated in the restart below for the same
          # reason LIBERIAEMR_VERSION is: it lives in the deploy command, not in
          # the server's facility.env, so a rollback that omitted it would leave
          # dev with the admin UI blocked and look like an unrelated regression.
          echo "rolling back to:"
          echo "  backend:  $backend"
          echo "  frontend: $frontend"
          echo "  gateway:  $gateway"
          ssh "${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }}" "
            set -e
            docker pull '$backend'
            docker pull '$frontend'
            docker pull '$gateway'
            docker tag '$backend'  '${{ env.REGISTRY }}/liberia-emr-backend:latest'
            docker tag '$frontend' '${{ env.REGISTRY }}/liberia-emr-frontend:latest'
            docker tag '$gateway'  '${{ env.REGISTRY }}/liberia-emr-gateway:latest'
            cd '${{ secrets.DEV_COMPOSE_DIR }}'
            LIBERIAEMR_VERSION=latest LEGACY_ADMIN_UI=true docker compose --env-file facility.env up -d
          "

      - name: Verify the rollback came back up
        run: |
          url="https://${{ secrets.DEV_HOST }}/openmrs/spa/"
          for i in $(seq 1 20); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "$url" || echo 000)
            [ "$code" = "200" ] && { echo "ok: rollback restored service ($url -> 200)"; exit 0; }
            echo "attempt $i: got $code, retrying in 15s..."
            sleep 15
          done
          echo "::error::Rollback itself did not bring the SPA back up — this needs a human now." >&2
          exit 1

  # ---------------------------------------------------------------------
  # DAST — OWASP ZAP baseline scan against the live dev instance. Only
  # runs if smoke-test passed (needs: smoke-test), so it never scans a
  # broken/rolled-back instance. Report only for now (cmd_options: '-I' +
  # continue-on-error): a first-ever scan of an app this size will almost
  # certainly surface findings that need triage before this can safely
  # block a deploy. Tighten once there's a baseline to compare against.
  # allow_issue_writing is off so this doesn't start auto-filing GitHub
  # issues without you deciding you want that.
  # ---------------------------------------------------------------------
  dast:
    name: DAST scan (dev)
    runs-on: ubuntu-latest
    needs: smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        continue-on-error: true
        with:
          target: https://${{ secrets.DEV_HOST }}/openmrs/spa/
          cmd_options: '-I'
          allow_issue_writing: false
